# Same-compute shootout: each broker runs ALONE (compose profiles), on
# identical resources (2 CPUs / 2 GB), with its default-durable
# configuration. The driver (ops/shootout/driver) runs on the host and
# pushes the same workload at every system. See README.md for the
# durability asterisks that make cross-system numbers honest.
#
# Host ports are offset (+10000-ish) so a local Redis/NATS doesn't
# collide with the containers.

services:
  narad:
    profiles: [narad]
    build:
      context: ../..
    command: ["serve", "--addr=0.0.0.0:7942", "--data-dir=/var/lib/narad"]
    environment:
      NARAD_SECURITY_ENABLED: "false"
      NARAD_CLUSTER_ADDR: "127.0.0.1:7943"
    ports: ["17942:7942"]
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7942/v1/topics"]
      interval: 2s
      timeout: 2s
      retries: 30

  nats:
    profiles: [nats]
    image: nats:2.12-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["14222:4222"]
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  rabbitmq:
    profiles: [rabbitmq]
    image: rabbitmq:4
    ports: ["15672:5672"]
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    profiles: [redis]
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"] # AOF everysec (default policy)
    ports: ["16379:6379"]
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  pulsar:
    profiles: [pulsar]
    image: apachepulsar/pulsar:4.0.6
    command: ["sh", "-c", "bin/pulsar standalone --no-functions-worker -nss"]
    environment:
      PULSAR_MEM: "-Xms512m -Xmx1g -XX:MaxDirectMemorySize=512m"
    ports: ["16650:6650", "18080:8080"]
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/admin/v2/brokers/health"]
      interval: 5s
      timeout: 5s
      retries: 60

  kafka:
    profiles: [kafka]
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://127.0.0.1:9092,HOST://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    ports: ["19092:19092"]
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "127.0.0.1:9092"]
      interval: 3s
      timeout: 5s
      retries: 30
