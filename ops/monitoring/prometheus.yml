global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9090

  # The nodes' dedicated metrics listeners (NARAD_HTTP_METRICS_ADDR), which
  # serve /metrics without the API credentials; see README.md.
  - job_name: narad
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9101
          - 127.0.0.1:9102
          - 127.0.0.1:9103
