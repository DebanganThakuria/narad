<svg class="nr-dia__wide" viewBox="0 0 800 440" role="img" aria-labelledby="compare-durability-w-t" aria-describedby="compare-durability-w-d">
<title id="compare-durability-w-t">What an ack means: on disk, and on more than one machine</title>
<desc id="compare-durability-w-d">Each system's default sits in a grid of two questions: is the message fsynced to disk before the ack, and is it on more than one machine before the ack. Narad fsyncs before the ack and keeps one copy. RabbitMQ quorum queues and Pulsar with BookKeeper fsync and replicate before the ack. Kafka with RF=3 and acks=all, NATS JetStream at R3, whose quorum ack is in memory, and RabbitMQ streams replicate before the ack but do not fsync. NATS JetStream at R1, its default, and Redis Streams do neither. SQS is managed: it stores a message across availability zones before it responds, and its internals are not published.</desc>

<text class="rl" x="0" y="284">Not fsynced before</text>
