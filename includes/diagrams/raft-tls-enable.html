<svg class="nr-dia__wide" viewBox="0 8 800 512" role="img" aria-labelledby="raft-tls-enable-w-t" aria-describedby="raft-tls-enable-w-d">
<title id="raft-tls-enable-w-t">Turning on Raft TLS in a running cluster</title>
<desc id="raft-tls-enable-w-d">Three stages of turning on Raft TLS in a running three-node cluster. After helm upgrade, the StatefulSet restarts narad-2 on TLS. It cannot talk Raft to its plaintext peers and stays not ready, so the rolling update waits, while narad-0, the leader, and narad-1 keep serving on plaintext. You then delete narad-1 by hand, the one manual step. While it restarts on TLS, neither side holds a majority: there is no Raft leader, and topic, user and schema changes are refused, while produce and consume go on. Once narad-1 and narad-2 both run TLS they are a majority and elect a leader, one of the two. narad-0, still on plaintext, is not ready, and the rolling update restarts it on its own.</desc>
