<title id="delivery-ordering-w-t">Same key, two nodes: the order is not kept</title>
<desc id="delivery-ordering-w-d">Your service sends m1 with key customer-42 to narad-0, which answers 202. After that 202 it sends m2 with the same key to narad-1, which also answers 202. The key maps both to partition orders/1, owned by narad-2. Each node commits what it accepted with its own dispatcher, on its own clock. 3: narad-1's dispatcher commits m2 first, at offset 7. 4: narad-0's dispatcher commits m1 after it, at offset 8. So m1, sent first, lands second.</desc>
