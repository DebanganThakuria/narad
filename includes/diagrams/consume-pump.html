<svg class="nr-dia__wide" viewBox="0 -4 800 376" role="img" aria-labelledby="consume-pump-w-t" aria-describedby="consume-pump-w-d">
<title id="consume-pump-w-t">One pump per broker hands each record to one waiter</title>
<desc id="consume-pump-w-d">On narad-1, consumers of topic orders that found nothing wait in one first-in, first-out queue; pinned consumers wait in their own FIFO per partition, which the pump serves first. The pump wakes on two things: a waiter joined, or records may be ready, which the partition log signals on a high watermark advance, a nack, a lease expiry or a close. It reserves a record once, ord_123, and hands it to the waiter at the head; the others keep waiting. With no waiter, the log's notifier returns on one atomic flag.</desc>
