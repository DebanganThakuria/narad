<title id="produce-dispatcher-w-t">The produce dispatcher: one reader, a queue per partition, a checkpoint that never lies</title>
<desc id="produce-dispatcher-w-d">Inside narad-0, the accepting node. The ingress WAL is a strip of sequence numbers from the checkpoint to the read frontier. Each is done (committed), held (queued or in flight) or skipped (left in the WAL and read again at least once a second). 1: the dispatcher reads each record once, as it becomes durable, and places it on the queue of its partition; each queue has at most one commit in flight. 2: orders/0 is owned here, so its batch is committed into the local partition log. orders/1 is owned by narad-2, so its batch, at most 8 MiB, goes over QUIC. orders/2 is owned by narad-3, which is dead: after 3 s of failures, or at once when membership marks it dead, its records go to the next live partition, orders/0. 3: a commit that lands marks its sequence numbers done. 4: the checkpoint moves to the first sequence number not done, is synced within 250 ms, and the WAL compacts behind it. Up to 16 commits run at once; a commit that runs past 1 s stops counting against that limit.</desc>
