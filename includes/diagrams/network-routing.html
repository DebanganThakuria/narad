<svg class="nr-dia__wide" viewBox="0 -4 800 352" role="img" aria-labelledby="network-routing-w-t" aria-describedby="network-routing-w-d">
<title id="network-routing-w-t">How narad-1 routes four requests</title>
<desc id="network-routing-w-d">narad-1 decides every route from its local metastore replica. 1: a produce, ord_123, is always accepted into narad-1's own ingress WAL; the dispatcher moves it to the owner later. 2: a consume of orders/1, which narad-1 owns, is served from its local log. 3: a consume of orders/2, which narad-2 owns, is forwarded to narad-2 over node RPC. 4: a metadata write, such as creating a topic, is forwarded to the Raft leader, narad-0.</desc>
