<svg class="nr-dia__wide" viewBox="0 -4 800 500" role="img" aria-labelledby="index-node-anatomy-w-t" aria-describedby="index-node-anatomy-w-d">
<title id="index-node-anatomy-w-t">Inside one node: three paths through the same components</title>
<desc id="index-node-anatomy-w-d">A load balancer sends each request to any node, here narad-1. Inside the node, the HTTP API takes it. A produce goes straight into the node's ingress WAL, and the message, ord_123, is answered once it is fsynced there; the produce dispatcher then reads it back and commits it, to the broker engine's partition logs when this node owns the partition, or over QUIC to the owner on another node. A consume or an ack goes to the router, which looks the partition up in the node's own metastore replica and hands it to the broker engine when the partition is owned here, or forwards it to the owner. The fan-out runner reads the owned partition logs and commits child copies, here or on the child partition's owner.</desc>
