<title id="fanout-attach-point-w-t">Where a new child's copy begins on each parent partition</title>
<desc id="fanout-attach-point-w-d">Topic orders has partitions p0, p1 and p2 when a child is attached. 1: while proposing the attach, the node reads each partition's committed high watermark: 19, 10 and 9. 2: they travel inside the Raft attach command, as attach_offsets [19, 10, 9]. 3: each cursor starts exactly at its recorded offset; the records before it are not copied. A partition added later, p3, lies beyond the recorded slice, so its cursor starts at 0.</desc>
