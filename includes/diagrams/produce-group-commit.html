<title id="produce-group-commit-w-t">Group commit: many callers, one fsync</title>
<desc id="produce-group-commit-w-d">Three producers send to narad-0 at the same time: two single produces and a batch of up to 100. The HTTP handlers authorize and validate each one and pick its partition. 1: each record is staged into the ingress WAL's shared buffer, and its caller waits. The batch's records take consecutive sequence numbers, N+1 to N+4, with nothing staged between them; ord_123 takes N+5. 2: one write and one fsync make every staged record durable at once. The sync loop wakes on every append, with a 10 ms backstop. 3: every caller in that flush gets 202 Accepted. A staged record waits for the true outcome of its flush.</desc>
