<title id="commit-combining-w-t">Commit combining: one append and one fsync for every queued batch</title>
<desc id="commit-combining-w-d">narad-2 owns orders/1. Commit batches for it arrive together from the narad-0 dispatcher, the narad-1 dispatcher and a fan-out cursor, and queue on the partition's combiner. 1: the first to arrive with no cycle running leads: it takes the produce lock, and under the lock checks again ownership and the handoff freeze, the live incarnation and that each caller is still waiting. 2: it drains every queued batch and appends them as one run of contiguous offsets. 3: it commits the run with one CommitDurable: fsync, read back, advance the high watermark. 4: every caller in the cycle gets the same outcome.</desc>
