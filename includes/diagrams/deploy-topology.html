<title id="deploy-topology-w-t">What the Helm chart installs</title>
<desc id="deploy-topology-w-d">Clients reach an ingress or load balancer, where TLS ends. A message, ord_123, goes on as plain HTTP to the Service narad on 7942/tcp, which spreads requests over the three pods of the StatefulSet narad, narad-0 to narad-2. Each pod has its own volume, from the claims data-narad-0 to data-narad-2. The pods talk to each other directly, node RPC on 7942/udp and Raft on 7943/tcp, and find each other by DNS through the headless Service narad-headless. The pods read the secret narad-security as environment variables. The secret narad-cluster-tls is mounted only with clusterTLS.enabled. Prometheus scrapes :9100/metrics on every pod.</desc>
