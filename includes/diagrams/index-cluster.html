<desc id="index-cluster-w-d">A Narad cluster of three nodes, narad-0, narad-1 and narad-2. Each holds a full replica of the metastore, the same topics, users and assignments on all three, kept in step by Raft from the leader, narad-0, which also runs the controller. Message data is different: each partition lives on one node only, orders/0 on narad-0, orders/1 on narad-1 and orders/2 on narad-2, so orders/1 is one copy, on one node. The nodes send each other commits and forwarded requests over QUIC.</desc>
