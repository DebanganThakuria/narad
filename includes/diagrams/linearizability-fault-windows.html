<svg class="nr-dia__wide" viewBox="0 36 800 440" role="img" aria-labelledby="linearizability-fault-windows-w-t" aria-describedby="linearizability-fault-windows-w-d">
<title id="linearizability-fault-windows-w-t">A redelivery after an ack is judged against fault windows</title>
<desc id="linearizability-fault-windows-w-d">A run on a time line. Two faults, kill narad-1 and a network partition of narad-2, each open a fault window that lasts from the fault's start to its end plus a grace, by default the visibility timeout plus 20 s. A redelivery after a confirmed ack that falls inside a window is explained. One that falls outside every window is an ANOMALY, and the run fails. The report prints the fault coverage, the share of the run inside windows; above 75% the check says UNKNOWN. Faults closer together than the grace merge into one long window, so the injector spaces them further apart than the grace.</desc>
<rect class="win" x="40" y="56" width="120" height="92" rx="2"/>
<path class="ln1" d="M40 56H160V148H40Z"/>
<text class="an" x="52" y="84">kill</text>
<text class="cd" x="52" y="106">narad-1</text>
<rect class="win" x="160" y="56" width="172" height="92" rx="2"/>
<path class="ln1 dash" d="M160 56H332V148H160"/>
<text class="an" x="172" y="84">grace: visibility</text>
<text class="an" x="172" y="106">timeout + 20 s</text>
<rect class="win" x="456" y="56" width="120" height="92" rx="2"/>
<path class="ln1" d="M456 56H576V148H456Z"/>
<text class="an" x="468" y="84">partition</text>
<text class="cd" x="468" y="106">narad-2</text>
<rect class="win" x="576" y="56" width="172" height="92" rx="2"/>
<path class="ln1 dash" d="M576 56H748V148H576"/>
<text class="an" x="588" y="84">grace</text>
<path class="ln1" d="M0 172H800"/>
<text class="an mu end" x="796" y="196">run time</text>
<path class="ln" d="M292 128V172"/>
<text class="an mid" x="292" y="196">explained</text>
<path class="ln" d="M394 70V172"/>
<polygon class="msg" points="337,41 433,41 451,71 355,71"/>
<text class="msg-t" x="394" y="62.5">deliver</text>
<path class="x" d="M386 112L402 128M402 112L386 128"/>
<text class="cd mid" x="394" y="196">ANOMALY</text>
<text class="an mid" x="394" y="218">the run fails</text>
<text class="an" x="0" y="268">fault coverage, the share of the run inside windows:</text>
<text class="an" x="0" y="290">above 75% the check says</text>
<text class="cd" x="220.5" y="290">UNKNOWN</text>
<path class="sep" d="M0 320H800"/>
<text class="lb" x="0" y="352">Faults closer than the grace</text>
<rect class="win" x="0" y="372" width="60" height="24" rx="2"/>
<path class="ln1" d="M0 372H60V396H0Z"/>
<rect class="win" x="60" y="372" width="172" height="24" rx="2"/>
<path class="ln1 dash" d="M60 372H232V396H60"/>
<rect class="win" x="160" y="404" width="60" height="24" rx="2"/>
<path class="ln1" d="M160 404H220V428H160Z"/>
<rect class="win" x="220" y="404" width="172" height="24" rx="2"/>
<path class="ln1 dash" d="M220 404H392V428H220"/>
<path class="ln1" d="M0 436V444H392V436"/>
<text class="an mid" x="196" y="466">one long window</text>
<text class="an" x="424" y="396">they merge into one window:</text>
<text class="an" x="424" y="418">space faults further apart</text>
<text class="an" x="424" y="440">than the grace</text>
</svg>
