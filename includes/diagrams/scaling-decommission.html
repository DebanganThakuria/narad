<title id="scaling-decommission-w-t">Scale in: drain narad-4, then delete it</title>
<desc id="scaling-decommission-w-d">You run narad cluster decommission narad-4 on a five-node cluster. narad-4 is marked draining, so it receives no partitions, and the leader targets each partition it owns at the other four pods, and each destination copies its share: orders/4 to narad-0, orders/9 to narad-1, orders/14 to narad-2 and orders/19 to narad-3, at most 8 moves at once. Once narad-4 owns 0 partitions, the leader removes it from the Raft voters, never going below 3 voters. Then you run helm upgrade with replicaCount=4 and allowScaleIn=true, and the StatefulSet deletes narad-4. Lower replicaCount before step 2 and the partitions still on narad-4 are stranded.</desc>
