<title id="consume-after-outage-w-t">A stranded lease holds a whole run behind it</title>
<desc id="consume-after-outage-w-d">Two views of partition orders/3 after an outage. During the quiet window: the worker that leased offset 42 died holding it. The committed frontier stands at 41, and 43 to 58 were acked out of order, so they sit in the acked-ahead set below the high watermark at 58. Nothing is left to reserve, so consumers get 204. One visibility timeout later, 30 s by default, the lease on 42 lapses; a live worker takes 42 and acks it, the gap closes, and the frontier jumps to 58: the whole run clears at once, the burst.</desc>
