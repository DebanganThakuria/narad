<svg class="nr-dia__wide" viewBox="0 16 800 548" role="img" aria-labelledby="network-planes-w-t" aria-describedby="network-planes-w-d">
<title id="network-planes-w-t">Which traffic rides which port</title>
<desc id="network-planes-w-d">Clients reach a node through your ingress, where TLS ends, and speak HTTP with Basic auth to port 7942/tcp. Inside the cluster network, which must stay private, every node talks to every other on two ports. Node RPC runs over QUIC on 7942/udp: produce, consume and ack lanes of 16 streams each and a control lane of 4, authenticated by the cluster secret, proved per TLS session; a forwarded commit batch travels here. Raft runs on 7943/tcp, over mutual TLS once Raft TLS is configured (clusterTLS in the chart); it is plaintext otherwise, so fence the port. Prometheus scrapes metrics on 9100/tcp, which also answers the kubelet's startup and liveness probes; it has no auth, so keep it internal. pprof on 6060 is off by default.</desc>
<rect class="rg" x="300" y="20" width="500" height="448" rx="6"/>
<text class="rl" x="320" y="50">Cluster network: private, fence it</text>
