<svg class="nr-dia__wide" viewBox="0 96 800 388" role="img" aria-labelledby="consume-delivery-tokens-w-t" aria-describedby="consume-delivery-tokens-w-d">
<title id="consume-delivery-tokens-w-t">Delivery tokens: one token spent, one record claimed</title>
<desc id="consume-delivery-tokens-w-d">1: a consumer sends GET /consume?wait=10s to narad-1, the gateway, whose own partitions of the topic are empty. 2: narad-1 probes the remote owners, narad-0 and narad-2, and both answer empty. 3: narad-1 leaves a token with each owner, with a time to live of the remaining wait plus 250 ms. Then nothing polls: while the consumer waits, a keeper re-sends each registration every 5 seconds, so a token an owner lost is repaired. 4: a record commits on narad-0, whose pump spends the one token by notifying narad-1. 5: narad-1 claims it with a consume that does not wait and carries the Claim flag, and narad-0 returns the record, ord_123. 6: narad-1 answers the consumer 200. The token at narad-2 is never spent and lapses at its time to live.</desc>
