<title id="fanout-children-w-t">One produce, a copy in every child</title>
<desc id="fanout-children-w-d">Your service produces ord_123 to the topic orders, a parent, and orders keeps its own consumers. Every message committed to orders is copied to each of its children: orders-analytics and orders-billing get their copy at once, and orders-retry, a delay child, gets its copy 1 hour after the parent's commit. Each child is an ordinary topic with its own consumers: analytics, billing and a retry worker. Producers change nothing.</desc>
