<svg class="nr-dia__wide" viewBox="0 12 800 412" role="img" aria-labelledby="node-down-timeline-w-t" aria-describedby="node-down-timeline-w-d">
<title id="node-down-timeline-w-t">What clients see while a node is down</title>
<desc id="node-down-timeline-w-d">narad-2 stops at 0 seconds and comes back later; the time axis is not to scale. Producers get 202 throughout. For the first 3 seconds, messages for narad-2's partitions are held; after 3 seconds they go to other partitions of the topic; once narad-2 is marked dead, after about 30 seconds without a heartbeat, they are rerouted at once. Consumers without partition= are served from the other partitions all along. Acks of messages on narad-2, and consumes pinned to its partitions, get 502 while the owner does not answer, then 503, partition owner is down, once it is marked dead. Messages stored on narad-2, such as ord_123, wait for the node. After it returns, its partitions can deliver with quiet gaps of up to one visibility timeout.</desc>
<defs><pattern id="node-down-timeline-w-h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="hb" width="10" height="10"/><path class="hl" d="M0 0V10"/></pattern></defs>
<text class="cd" x="0" y="46">narad-2</text>
<rect class="dead" x="216" y="24" width="456" height="32" fill="url(#node-down-timeline-w-h)"/>
<rect class="plate" x="412" y="26" width="64" height="28"/>
<text class="an mid" x="444" y="45">down</text>
<rect class="bx" x="680" y="24" width="116" height="32" rx="2"/>
<text class="an mid" x="738" y="46">back</text>
<text class="lb" x="0" y="100">Producers</text>
<text class="cd" x="0" y="122">202</text>
<text class="an" x="42" y="122">throughout</text>
<rect class="win" x="216" y="88" width="76" height="32" rx="2"/>
<text class="an" x="224" y="110">held</text>
<rect class="win" x="300" y="88" width="192" height="32" rx="2"/>
<text class="an" x="308" y="110">to other partitions</text>
<rect class="win" x="500" y="88" width="172" height="32" rx="2"/>
<text class="an" x="508" y="110">rerouted at once</text>
<text class="lb" x="0" y="172">Consumers</text>
<text class="an" x="0" y="194">without</text>
<text class="cd" x="66" y="194">partition=</text>
<rect class="win" x="216" y="160" width="580" height="32" rx="2"/>
<text class="an" x="224" y="182">served from the other partitions</text>
<text class="an" x="0" y="244">Acks and pinned</text>
<text class="an" x="0" y="266">consumes</text>
<rect class="win" x="216" y="232" width="276" height="32" rx="2"/>
<text class="cd" x="224" y="254">502</text>
<text class="an" x="266" y="254">no answer from the owner</text>
<rect class="win" x="500" y="232" width="172" height="32" rx="2"/>
<text class="cd" x="508" y="254">503</text>
<text class="an" x="550" y="254">owner is down</text>
<text class="an" x="0" y="316">Messages stored</text>
<text class="an" x="0" y="338">on</text>
<text class="cd" x="26" y="338">narad-2</text>
<rect class="win" x="216" y="304" width="456" height="32" rx="2"/>
<text class="an" x="224" y="326">wait for the node</text>
<polygon class="msg" points="548,305 644,305 662,335 566,335"/>
<text class="msg-t" x="605" y="326.5">ord_123</text>
<rect class="win" x="680" y="304" width="116" height="32" rx="2"/>
<rect class="ln1 dash" x="680" y="304" width="116" height="32"/>
<text class="an" x="688" y="326">quiet gaps</text>
<text class="an mu end" x="796" y="360">up to one visibility timeout</text>
<path class="ln1" d="M216 384H796M216 384V392M296 384V392M496 384V392M676 384V392"/>
<text class="an mu mid" x="216" y="414">0 s</text>
<text class="an mu mid" x="296" y="414">3 s</text>
<text class="an mu mid" x="496" y="414">about 30 s</text>
<text class="an mu mid" x="676" y="414">returns</text>
</svg>
