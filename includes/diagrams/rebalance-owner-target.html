<title id="rebalance-owner-target-w-t">The leader writes the target; the destination does the move</title>
<desc id="rebalance-owner-target-w-d">The metastore, replicated by Raft, holds the assignment of orders/3: Owner narad-0, Target narad-3. 1: the controller on the Raft leader writes only the Target. 2: the move runner on narad-3 looks for partitions targeted at it every second and finds this one. 3: it copies orders/3 from narad-0. 4: it proposes the flip, a compare-and-swap: Owner becomes narad-3 only if Owner is still narad-0 and Target is still narad-3.</desc>
