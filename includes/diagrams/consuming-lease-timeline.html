<title id="consuming-lease-timeline-w-t">The lease is a clock</title>
<desc id="consuming-lease-timeline-w-d">Four of your workers each consume a message at 0 seconds, which leases it for the topic's visibility timeout, 30 seconds by default. Ack in time: the first acks at 12 seconds and gets 204, and the message is settled. Extend: the second extends at 10 seconds and gets 204, which restarts a full 30 seconds from then, so the lease that would have ended at 30 seconds runs to 40; it acks at 35 seconds and gets 204. Nack: the third nacks at 5 seconds and gets 204, and the message is back in the queue at once. Too slow: 30 seconds pass with no ack from the fourth, so its lease runs out and ord_123 goes back to the queue, where the next consumer takes it. The fourth worker's ack at 38 seconds then gets 410 Gone.</desc>
