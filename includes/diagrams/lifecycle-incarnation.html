<svg class="nr-dia__wide" viewBox="0 24 800 484" role="img" aria-labelledby="lifecycle-incarnation-w-t" aria-describedby="lifecycle-incarnation-w-d">
<title id="lifecycle-incarnation-w-t">A recreated topic never serves the deleted one</title>
<desc id="lifecycle-incarnation-w-d">Two lanes in time order, not to scale: the metastore, replicated by Raft, and the disk of narad-2. 1: orders is created with incarnation id 3f9a..., and narad-2 holds a directory for it marked 3f9a.... narad-2 then goes down. 2: orders is deleted; the purge reaches the live nodes but not narad-2, so its old directory stays. 3: orders is created again with a new id, 7c21.... 4: narad-2 returns and opens topics/orders/. Its marker says 3f9a..., not 7c21..., so the directory is renamed to topics/orders.stale-3f9a..., quarantined and never served, and a fresh directory opens for 7c21.... 5: once the leader confirms that 3f9a... is gone, the sweep reclaims the quarantined directory.</desc>
