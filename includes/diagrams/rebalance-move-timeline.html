<svg class="nr-dia__wide" viewBox="0 16 800 504" role="img" aria-labelledby="rebalance-move-timeline-w-t" aria-describedby="rebalance-move-timeline-w-d">
<title id="rebalance-move-timeline-w-t">One partition move: copy while traffic flows, then a short freeze</title>
<desc id="rebalance-move-timeline-w-d">Time runs left to right, not to scale. narad-0, the source, keeps taking produce and consume while narad-3, the target, copies the partition in passes that shrink: the first copies the bulk, gigabytes perhaps, and the copy stops pre-copying once a pass copies 4 MiB or less. 1: PrepareHandoff freezes the source and returns a freeze token. 2: Finalize drains the last tail under the freeze, re-arming the token every 7.5 s, a quarter of the 30 s freeze. 3: the fence presents the token once more; the source must still hold that freeze and report the same high watermark, or it answers 409 and the target freezes and drains again. 4: the target installs the copy, a rename with a move marker, and CompleteMove proposes the guarded flip, after which narad-3 owns the partition. Producers get 202 throughout: commits to this partition wait in the WAL and land on narad-3 after the flip. Consumers get nothing new from this partition during the freeze, and leases still out come back from narad-3. If the copy does not converge after 20 passes, or 3 without progress, the target freezes anyway, and the freeze is longer.</desc>

<text class="an" x="194" y="236">PrepareHandoff: freeze the source, get a token</text>
<circle class="sc" cx="172" cy="254" r="13"/><text class="sn" x="172" y="259.5">2</text>
<text class="an" x="194" y="260">Finalize: drain the tail; re-arm the token every 7.5 s</text>
<circle class="sc" cx="172" cy="278" r="13"/><text class="sn" x="172" y="283.5">3</text>
<text class="an" x="194" y="284">fence: token still live, same high watermark; or 409, freeze again</text>
<circle class="sc" cx="172" cy="302" r="13"/><text class="sn" x="172" y="307.5">4</text>
<text class="an" x="194" y="308">install (rename, move marker), then CompleteMove: the guarded flip</text>
<text class="lb" x="0" y="368">Producers</text>
<text class="cd" x="160" y="368">202</text>
<text class="an" x="205.5" y="368">throughout</text>
<text class="an" x="448" y="368">its commits wait in</text>
<text class="an" x="448" y="390">the WAL, retried</text>
<text class="an" x="652" y="368">they land</text>
<text class="an" x="652" y="390">on narad-3</text>
<text class="lb" x="0" y="436">Consumers</text>
<text class="an" x="160" y="436">served by narad-0</text>
<text class="an" x="448" y="436">nothing new from this</text>
<text class="an" x="448" y="458">partition</text>
<text class="an" x="652" y="436">leases still out</text>
<text class="an" x="652" y="458">come back from</text>
<text class="an" x="652" y="480">narad-3</text>
<text class="an mu" x="0" y="512">no convergence after 20 passes, or 3 without progress: freeze anyway, for longer</text>
</svg>
