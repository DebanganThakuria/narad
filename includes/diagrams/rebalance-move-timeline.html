<svg class="nr-dia__wide" viewBox="0 16 800 544" role="img" aria-labelledby="rebalance-move-timeline-w-t" aria-describedby="rebalance-move-timeline-w-d">
<title id="rebalance-move-timeline-w-t">One partition move: copy while traffic flows, then a short freeze</title>
<desc id="rebalance-move-timeline-w-d">Time runs left to right, not to scale. narad-0, the source, keeps taking produce and consume while narad-3, the target, copies the partition in passes that shrink: the first copies the bulk, gigabytes perhaps, and the copy stops pre-copying once a pass copies 4 MiB or less. 1: PrepareHandoff freezes the source and returns a freeze token. 2: Finalize drains the last tail under the freeze, re-arming the token every 7.5 s, a quarter of the 30 s freeze. 3: the fence presents the token once more; the source must still hold that freeze and report the same high watermark, or it answers 409 and the target freezes and drains again. 4: the target installs the copy, a rename with a move marker, and CompleteMove proposes the guarded flip, after which narad-3 owns the partition. Producers get 202 throughout: commits to this partition wait in the WAL and land on narad-3 after the flip, unless the freeze outlasts 3 s; then the dispatcher sends them, and what queued behind them, to a sibling partition, which gives up their per-key order. Consumers get nothing new from this partition during the freeze, and leases still out come back from narad-3. If the copy does not converge after 20 passes, or 3 without progress, the target freezes anyway, and the freeze is longer.</desc>
