<svg class="nr-dia__wide" viewBox="0 -4 800 454" role="img" aria-labelledby="delivery-availability-w-t" aria-describedby="delivery-availability-w-d">
<title id="delivery-availability-w-t">What still works with one node down, and with two</title>
<desc id="delivery-availability-w-d">Two views of a three-node cluster behind a load balancer. With one of three nodes down, narad-2, the load balancer sends traffic to narad-0 and narad-1. A produce, ord_123, is answered 202 by any live node. Consumes work, except that messages stored on narad-2 wait for it to return, and a consume or an ack pinned to one of its partitions is answered 502 while the node does not answer, then 503 once the controller marks it dead, about 30 seconds after its last heartbeat. Topic and user changes work, because Raft still has a quorum, 2 of 3. With two of three down, narad-1 and narad-2, narad-0 has no Raft leader and reports not ready, so the load balancer routes nothing to it. A produce sent to narad-0 directly is still answered 202, and a consume sent to it directly is served from what it stores. Topic and user changes are answered 503: there is no quorum.</desc>
<defs><pattern id="delivery-availability-w-hd" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="hb deep" width="10" height="10"/><path class="hl" d="M0 0V10"/></pattern></defs>
<rect class="rg" x="0" y="0" width="392" height="446" rx="6"/>
<text class="rl" x="20" y="30">One of three nodes down</text>
<rect class="bx bxq" x="20" y="48" width="352" height="36" rx="2"/>
<text class="an mid" x="196" y="72.12">load balancer</text>
<rect class="bx" x="20" y="136" width="104" height="44" rx="2"/>
<text class="pod" x="72" y="164.46">narad-0</text>
<rect class="bx" x="144" y="136" width="104" height="44" rx="2"/>
<text class="pod" x="196" y="164.46">narad-1</text>
<rect class="dead" x="268" y="136" width="104" height="44" fill="url(#delivery-availability-w-hd)"/>
<rect class="plate deep" x="268.7" y="142" width="102.6" height="32"/>
<text class="pod" x="320" y="164.46">narad-2</text>
<path class="ln" d="M72.0 84V93.0M72.0 127.0V124"/>
<path class="ah" d="M65 124L72 136L79 124Z"/>
<polygon class="msg" points="15,95 111,95 129,125 33,125"/>
<text class="msg-t" x="72" y="116.5">ord_123</text>
<path class="ln" d="M196 84V124"/>
<path class="ah" d="M189 124L196 136L203 124Z"/>
<text class="an mu" x="20" y="212"><tspan class="cd">narad-0</tspan>, <tspan class="cd">narad-1</tspan>: ready</text>
<text class="an" x="20" y="248">produce:</text>
<text class="cd" x="100.5" y="248">202</text>
<text class="an" x="20" y="270">on any live node</text>
<text class="an" x="20" y="304">consume: yes, except messages</text>
<text class="an" x="20" y="326">stored on <tspan class="cd">narad-2</tspan>: they wait;</text>
<text class="an" x="20" y="348">pinned to them: <tspan class="cd">502</tspan>, then <tspan class="cd">503</tspan></text>
<text class="an" x="20" y="370">once it is marked dead</text>
<text class="an" x="20" y="404">topics and users: yes,</text>
<text class="an" x="20" y="426">Raft quorum 2 of 3</text>
<rect class="rg" x="408" y="0" width="392" height="446" rx="6"/>
<text class="rl" x="428" y="30">Two of three nodes down</text>
<rect class="bx bxq" x="428" y="48" width="352" height="36" rx="2"/>
<text class="an mid" x="604" y="72.12">load balancer</text>
<rect class="bx ghost" x="428" y="136" width="104" height="44" rx="2"/>
<text class="pod" x="480" y="164.46">narad-0</text>
<rect class="dead" x="552" y="136" width="104" height="44" fill="url(#delivery-availability-w-hd)"/>
<rect class="plate deep" x="552.7" y="142" width="102.6" height="32"/>
<text class="pod" x="604" y="164.46">narad-1</text>
<rect class="dead" x="676" y="136" width="104" height="44" fill="url(#delivery-availability-w-hd)"/>
<rect class="plate deep" x="676.7" y="142" width="102.6" height="32"/>
<text class="pod" x="728" y="164.46">narad-2</text>
<path class="ln1 dash" d="M480.0 84V136"/>
<path class="x" d="M472 102L488 118M488 102L472 118"/>
<text class="an" x="500" y="116">routes nothing</text>
<text class="an mu" x="428" y="212"><tspan class="cd">narad-0</tspan>: not ready, no Raft leader</text>
<text class="an" x="428" y="248">produce sent to <tspan class="cd">narad-0</tspan></text>
<text class="an" x="428" y="270">directly: still</text>
<text class="cd" x="531.2" y="270">202</text>
<text class="an" x="428" y="304">consume sent to <tspan class="cd">narad-0</tspan></text>
<text class="an" x="428" y="326">directly: what it stores</text>
<text class="an" x="428" y="404">topics and users: <tspan class="cd">503</tspan></text>
<text class="an" x="428" y="426">no Raft quorum</text>
