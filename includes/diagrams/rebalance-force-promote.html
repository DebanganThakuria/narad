<title id="rebalance-force-promote-w-t">Force-promote: only a copy that holds everything the source made visible</title>
<desc id="rebalance-force-promote-w-d">The source of a move, narad-0, is dead. The destination, narad-3, knows the source's high watermark from the last listing it read, and holds a staged copy. It waits: only after the source has been dead for 2 minutes does it consider promoting. Then it checks the gate: does the staged copy reach the source's last-known high watermark? If yes, it promotes: it skips the freeze and flips ownership to itself. If not, it keeps waiting for the source. If the source was never reached at all, it refuses.</desc>
