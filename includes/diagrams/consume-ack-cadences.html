<title id="consume-ack-cadences-w-t">Two clocks and two slots: how acks reach the disk</title>
<desc id="consume-ack-cadences-w-d">Acks settle in memory at once. Every tick, T, 100 ms, the committer writes a fresh consumer.ahead record for each changed partition into the window slot, which is only the page cache: it survives a crash of the process, not of the machine. Once every durability interval, D, 1 s, at a phase set by a hash of the partition, here 0.7 s into each second, the partition is written out: fdatasync on Linux; on macOS fsync, then one F_FULLFSYNC per device. consumer.ahead has two 4 KiB slots. The anchor holds the newest durable record and is never written while it is the anchor; ticks write the other slot, the window. A writeout that succeeds swaps the two roles. The ack followed here settles at 0.23 s, reaches the page cache at the tick at 0.3 s, and is durable at the writeout at 0.7 s. So a process crash hands back about one tick of acks, 100 ms, and a power loss up to D plus T plus the sync, about 1.1 s. consumer.offset is levelled with the frontier at most every 30 s and at Close.</desc>
