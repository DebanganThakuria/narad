<svg class="nr-dia__wide" viewBox="0 -4 800 516" role="img" aria-labelledby="consume-offset-strip-w-t" aria-describedby="consume-offset-strip-w-d">
<title id="consume-offset-strip-w-t">One partition's shard of the in-flight table</title>
<desc id="consume-offset-strip-w-d">In memory on the owner, the shard for orders/3 covers offsets 38 to 49. 38 to 41 are acked, so the committed frontier stands at 41: everything up to and including 41 is acked. 42 is available. 43 and 45 are leased, each with a nonce and an expiry. 44 was acked ahead of the gap at 42 and 43. 46 and 47 are available, the high watermark stands after 47, and 48 and 49 are written but not yet visible. The lease on 43 is held through its receipt handle, 3:43:58..., which is partition:offset:nonce. Two leases are in flight against max_in_flight_per_partition, 1024 by default, and one offset is acked ahead against max_acked_ahead_per_partition, 1024 by default. On disk beside the log, consumer.ahead holds the frontier and the acked-ahead set, written every 100 ms and synced every 1 s, and consumer.offset holds the frontier alone, levelled at most every 30 s. Leases live only in memory: a crash forgets them and the messages come back.</desc>
