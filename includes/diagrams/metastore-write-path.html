<svg class="nr-dia__wide" viewBox="0 -4 800 488" role="img" aria-labelledby="metastore-write-path-w-t" aria-describedby="metastore-write-path-w-d">
<title id="metastore-write-path-w-t">A metadata write: through the leader, answered after the local replica</title>
<desc id="metastore-write-path-w-d">A Narad cluster of three nodes; narad-0 is the Raft leader. Each node holds a Raft log and an FSM, both stored in bbolt. 1: a client sends POST /v1/topics to narad-2. 2: narad-2 forwards the write to the leader, narad-0. 3: the leader appends the entry, create orders, to its Raft log and replicates it to narad-1 and narad-2; a quorum commits it. 4: every node applies the committed entry to its own FSM. 5: narad-2 asks the leader for the index it applied and waits, up to 3 s, until its own FSM has reached it. 6: then narad-2 answers the client 201, after at most 3 s even if its FSM has not caught up, and at once if the leader cannot be reached. Reads never leave the node: narad-1 answers them from its local FSM.</desc>
