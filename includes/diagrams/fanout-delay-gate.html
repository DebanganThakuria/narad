<title id="fanout-delay-gate-w-t">The delay gate is a line on the clock</title>
<desc id="fanout-delay-gate-w-d">On the clock of the node that owns orders/3, it is now 13:00:00.5, and the retry child delays by 1 hour, so the gate stands at now minus the delay, 12:00:00.5. The parent log holds r1, committed at 12:00:00, r2 at 12:00:01 and r3 at 12:00:02. r1 is left of the gate, so it is due and the cursor commits it to the retry child. r2 is the first record not due: the cursor stops there and sleeps until 13:00:01, when r2 becomes due, and never longer than 30 s. Commit times never decrease along a partition, so nothing after r2 is due either.</desc>
