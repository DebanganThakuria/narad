<svg class="nr-dia__wide" viewBox="0 -4 800 372" role="img" aria-labelledby="fanout-cursor-loop-w-t" aria-describedby="fanout-cursor-loop-w-d">
<title id="fanout-cursor-loop-w-t">The cursor loop: commit before advance</title>
<desc id="fanout-cursor-loop-w-d">One fan-out cursor runs a loop of four steps. 1: read a slab from the parent partition, up to 4,096 records or 4 MiB, lingering up to 25 ms. 2: bucket the records by child partition, by key hash, keeping their order. 3: commit the buckets to the child partitions' owners, up to 16 at once. If some fail, back off 1 s and retry only those buckets, from memory. 4: once every bucket has committed, write the cursor offset: 256 bytes and one fdatasync. Then read the next slab. The offset never passes a record the child has not committed.</desc>
