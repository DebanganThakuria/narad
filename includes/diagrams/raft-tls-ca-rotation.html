<svg class="nr-dia__wide" viewBox="0 8 800 332" role="img" aria-labelledby="raft-tls-ca-rotation-w-t" aria-describedby="raft-tls-ca-rotation-w-d">
<title id="raft-tls-ca-rotation-w-t">Rotating the CA in three rolls</title>
<desc id="raft-tls-ca-rotation-w-d">Rotating the CA of the Raft certificates takes three rolling restarts. At the start, every pod's ca.crt trusts the old CA and its tls.crt is issued by the old CA. Roll 1, trust both: ca.crt trusts the old and the new CA, while the certificates stay on the old CA. Roll 2, new certificates: tls.crt is issued by the new CA, and pods still trust both. Roll 3, drop the old CA: ca.crt trusts the new CA alone. At every step, every pod trusts the certificate every other pod presents. Skip roll 1 and a certificate from the new CA meets peers that trust only the old CA, and it is refused.</desc>

<path class="ah" d="M557 74L562 84L567 74Z"/>

<text class="an" x="580" y="58">certificate is refused</text>
