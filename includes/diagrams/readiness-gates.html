<title id="readiness-gates-w-t">Where a pod stops on its way to ready</title>
<desc id="readiness-gates-w-d">/readyz passes four gates in order, and a pod that is not ready answers with the first gate it fails. Gate 1: the pod has finished starting and, if it is a new node, has been admitted; otherwise it answers not ready. Gate 2: a Raft leader is known; otherwise no raft leader known. Gate 3: the pod has heard from the leader within 5 seconds, or is the leader; otherwise no contact with the raft leader yet, or last raft leader contact &lt;duration&gt; ago. Gate 4: its metadata has caught up with the leader once since it started; otherwise replica has not caught up with the leader since start. Past all four it answers {"status":"ready"}. narad-2, the pod in the example above, stops at gate 2. Readiness is not a latch: a ready pod that loses the leader turns not ready again. Answers 2 to 4 start with metastore: node is not ready:.</desc>
