<svg class="nr-dia__wide" viewBox="0 12 800 508" role="img" aria-labelledby="index-journey-w-t" aria-describedby="index-journey-w-d">
<title id="index-journey-w-t">One message, end to end</title>
<desc id="index-journey-w-d">The life of one message, ord_123, across five actors, in order but not to scale. 1: the producer sends POST /produce to narad-0, which fsyncs it into its ingress WAL and answers 202 Accepted. 2: narad-0's dispatcher commits it over QUIC to narad-2, the partition's owner, which appends it, fsyncs, reads it back and checks the CRC, then advances the high watermark, and ord_123 becomes visible. narad-2 confirms, and narad-0's WAL entry becomes reclaimable. 3: the fan-out cursor on narad-2 commits a copy to narad-1, the child partition's owner. 4: a consumer's GET /consume gets ord_123 from narad-2 with a receipt handle. 5: the consumer acks it with POST /ack and gets 204.</desc>
