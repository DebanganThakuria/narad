<svg class="nr-dia__wide" viewBox="0 -4 800 512" role="img" aria-labelledby="lifecycle-join-w-t" aria-describedby="lifecycle-join-w-d">
<title id="lifecycle-join-w-t">A new node joins: the loop ends when its own Raft sees a leader</title>
<desc id="lifecycle-join-w-d">narad-3 starts with an empty Raft configuration and reports not ready. 1: it sends JoinCluster to narad-1, a follower, which answers 421, not the leader, so it tries the next peer. 2: it sends JoinCluster to the leader, narad-0, which adds narad-3 as a voter and answers 200. 3: the leader starts replicating to it with AppendEntries. 4: once narad-3's own Raft sees a leader it is admitted; it catches up its state machine and /readyz answers 200. A node with no Raft configuration answers 412, and a decommissioned node gets 409. The loop tries every 2 s until its own Raft sees a leader.</desc>
<rect class="bx ghost" x="0" y="48" width="140" height="240" rx="2"/>
<text class="pod" x="70" y="78">narad-3</text>
<text class="an mu" x="16" y="108">not ready</text>
<circle class="sc" cx="27" cy="152" r="13"/><text class="sn" x="27" y="157.5">4</text>
<text class="an" x="46" y="158">admitted,</text>
<text class="an" x="46" y="180">then</text>
<text class="an" x="46" y="202">ready</text>

<path class="ln1" d="M400 272H150"/>
<path class="ah" d="M150 267L140 272L150 277Z"/>
<circle class="sc" cx="320" cy="296" r="13"/><text class="sn" x="320" y="301.5">3</text>
<path class="sep" d="M0 336H800"/>
<circle class="sc" cx="13" cy="362" r="13"/><text class="sn" x="13" y="367.5">1</text>
<text class="cd" x="34" y="368">JoinCluster</text>
<text class="an" x="166.3" y="368">to a follower:</text>
<text class="cd" x="279.4" y="368">421</text>

<text class="cd" x="498.8" y="398">200</text>
<circle class="sc" cx="13" cy="422" r="13"/><text class="sn" x="13" y="427.5">3</text>
<text class="an" x="34" y="428">replication begins</text>
<circle class="sc" cx="13" cy="452" r="13"/><text class="sn" x="13" y="457.5">4</text>
<text class="an" x="34" y="458">narad-3 sees a leader: admitted; it catches up, and</text>
<text class="cd" x="453.3" y="458">/readyz</text>
<text class="cd" x="540" y="458">200</text>
<text class="cd mu" x="0" y="500">412</text>
<text class="an mu" x="37.2" y="500">: no Raft configuration there;</text>
<text class="cd mu" x="278.5" y="500">409</text>
