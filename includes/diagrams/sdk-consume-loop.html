<svg class="nr-dia__wide" viewBox="0 0 800 404" role="img" aria-labelledby="sdk-consume-loop-w-t" aria-describedby="sdk-consume-loop-w-d">
<title id="sdk-consume-loop-w-t">One worker's loop inside client.Consume</title>
<desc id="sdk-consume-loop-w-d">Each worker in client.Consume runs this loop. Step 1: it long-polls GET .../consume?wait=10s, which waits up to 10 seconds for a message. Step 2: the message, ord_123, goes to your handler. While the handler runs, a lease keeper extends the lease every 10 seconds, a third of the topic's 30 second visibility timeout; if an extend gets 410, the lease is lost, the handler's context is cancelled and the message is left alone. Step 3: if the handler returns nil, the worker acks the message and gets 204; if it returns an error, the worker nacks it and the message is back in the queue at once. A panic is recovered and nacked like an error. Then the worker polls again.</desc>
