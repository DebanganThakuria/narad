<title id="fanout-cursor-placement-w-t">Fan-out cursors run where the parent partition lives</title>
<desc id="fanout-cursor-placement-w-d">narad-1 owns partition 3 of orders, so both cursors for it run on narad-1 and read its log from local disk: one for the analytics child and one for the retry child, which delays by 1 hour. Each keeps its position in a file beside the log, fanout-analytics.offset and fanout-retry.offset. Each commits batches to the owners of its child partitions: analytics partitions on narad-0, retry partitions on narad-2. A reconciler on every node starts and stops cursors every second, one for each link and each parent partition the node owns.</desc>
