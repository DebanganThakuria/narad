<svg class="nr-dia__wide" viewBox="0 -4 800 432" role="img" aria-labelledby="fanout-cursor-placement-w-t" aria-describedby="fanout-cursor-placement-w-d">
<title id="fanout-cursor-placement-w-t">Fan-out cursors run where the parent partition lives</title>
<desc id="fanout-cursor-placement-w-d">narad-1 owns partition 3 of orders, so both cursors for it run on narad-1 and read its log from local disk: one for the analytics child and one for the retry child, which delays by 1 hour. Each keeps its position in a file beside the log, fanout-analytics.offset and fanout-retry.offset. Each cursor splits a batch by key hash over all its child's partitions and commits each share to that partition's owner. Child partitions are spread across the nodes, so each cursor commits to more than one: here analytics/0 and retry/1 live on narad-0, analytics/1 and retry/0 on narad-2. A reconciler on every node starts and stops cursors every second, one for each link and each parent partition the node owns.</desc>
