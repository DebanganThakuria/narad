<title id="storage-segments-w-t">Segments, frames and records</title>
<desc id="storage-segments-w-d">A partition directory, topics/orders/p00003/, holds segment files named by the 20-digit offset of their first record, up to 64 MiB each. 00000000000000000000.log is sealed: immutable, and deleted whole by retention. 00000000000000450832.log is the active segment, a run of frames with the last one being written. A frame is the unit of writing, one per flush: a header with the magic 0xCAFE, the codec, the record count, the base offset, the sizes and a crc32c, then its records. Each record is the keyed envelope, [version][key][commit-time][payload], the unit a consumer reads.</desc>
