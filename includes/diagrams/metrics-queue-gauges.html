<title id="metrics-queue-gauges-w-t">What each queue gauge measures</title>
<desc id="metrics-queue-gauges-w-d">One partition's log drawn as a strip of offsets, oldest on the left, not to scale. Messages below the committed frontier are acked. The message just above the frontier, highlighted, is the oldest one not yet acked: its lease ran out and it waits to be delivered again. After it come five leased messages, two acked ahead of it and three that no one has taken yet, up to the high watermark. Past the high watermark two more are written but not yet visible to consumers. narad_consumer_lag_messages is the high watermark minus the committed frontier, 11 here: it counts the highlighted, leased, acked-ahead and not yet taken messages, and never the hidden tail. narad_inflight_size counts the five leased messages and narad_acked_ahead_size the two acked ahead. narad_oldest_unconsumed_message_age_seconds is the age of the highlighted message, read from the last write to the segment file that holds it. In a second partition the committed frontier sits below the log start: retention deleted four messages before anyone acked them, and narad_consumer_dropped_messages is the log start minus the frontier, 4 here.</desc>
