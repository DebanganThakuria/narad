openapi: 3.1.0

# The Narad HTTP API contract. Hand-written from
# internal/transport/httpserver/router.go and the handlers under
# internal/transport/httpserver/handlers. Two checks keep it honest:
#
#   go test ./internal/transport/httpserver -run TestOpenAPIContract
#     fails when a route is registered but missing here (or the
#     reverse), and when a documented status code is one the route's
#     handler and middleware can never write.
#   python3 scripts/gen-http-api-docs.py --check
#     fails when docs/reference/http-api.md is stale.
#
# Layout rules the contract test relies on: two-space indentation,
# status codes as quoted keys ("200"), one operation per method key.
#
# Narad extensions:
#   x-narad-grant    the grant or role an operation needs
#   x-narad-since    "unreleased" for anything in master but not in the
#                    latest release (v3.0.1)
#   x-narad-guide    the how-to page for the operation
#   x-narad-example  one request and its answer, from a real run
#   x-narad-common   a response every operation of its kind can give;
#                    the reference page folds these into one line
#   x-narad-origin   "forwarding": written by the node that forwarded
#                    the request, not by the operation's handler

info:
  title: Narad HTTP API
  version: v1
  summary: >-
    Look up every Narad HTTP endpoint, with its parameters, request and
    response fields, status codes and a real example.
  description: |-
    Send each request to the API port of any node (7942 by default) or
    to a load balancer in front of the nodes. Any node answers any
    request and forwards it when another node owns the data. API paths
    start with `/v1`; the health probes and `/metrics` do not.

    **Authentication.** Send HTTP Basic credentials on every request
    except `/healthz` and `/readyz`. Without valid credentials the
    answer is `401` with `WWW-Authenticate: Basic realm="narad"`, for
    any path, before the path is looked at. After five wrong passwords
    for an existing user, a node answers `429` for that user and allows
    one more attempt every 12 seconds. With security off
    (`security.enabled: false`, or `narad server start --dev`) no
    credentials are needed and every grant check passes.

    **Content type on writes.** Every `POST`, `PUT` and `PATCH` must send
    `Content-Type: application/json` or `application/octet-stream`, or
    an `X-Narad-Client` header with any value. This holds even for a
    request without a body, such as an ack or a decommission. Anything
    else gets `415`, which stops a web page from riding an operator's
    cached browser credentials. `GET` and `DELETE` are not checked.

    **Errors.** An error answer is JSON, `{"error": "..."}`, with a
    message written for people. Two kinds are plain text instead: a
    `502` or `503` from the node that forwarded your request to the
    partition's owner, and the router's own `404 page not found` and
    `405 Method Not Allowed` for a path or method that does not exist.
    Narad records `499` in its logs and metrics when a client hangs up
    before the answer; no client ever reads it.

    **Limits.** A request body is at most 1 MiB, and a batch ack body
    at most 64 KiB; a larger one gets `413`. Attaching a child and the
    user endpoints read their JSON body in one pass and answer an
    oversize body with `400` instead. Request headers are at most 64 KiB
    by default (`http.max_header_bytes`); a larger block gets a plain
    text `431`. A consume waits at most
    `http.max_consume_wait` (10 s by default); a longer `wait` is cut to
    that, and the answer carries `X-Narad-Wait-Clamped: 10s`. A batch
    holds at most 100 messages or receipt handles.

    **Pagination.** `GET /v1/topics` takes `limit` and `page_token` and
    answers with `next_page_token`. Keep asking with the token until it
    comes back empty: a page can be short, or even empty, while more
    pages remain.

    **Times.** A topic's `created_at` and a message's `timestamp` are
    Unix seconds. A user's `created_at_ms` and `updated_at_ms` are Unix
    milliseconds.

    **See also.** [Status codes and
    errors](https://debanganthakuria.github.io/narad/reference/status-codes/)
    says whether to retry each code, and the [delivery
    contract](https://debanganthakuria.github.io/narad/understand/delivery-contract/)
    says what each answer promises.
  x-narad-example:
    request: |-
      curl -i -u "$AUTH" "$NARAD/v1/topics"
    response: |-
      HTTP/1.1 200 OK
      Content-Type: application/json

      {
        "next_page_token": "",
        "topics": [
          {
            "name": "orders",
            "id": "8108d715b7a0464e",
            "partitions": 3,
            "retention_ms": 604800000,
            "visibility_timeout_ms": 30000,
            "max_in_flight_per_partition": 1024,
            "max_acked_ahead_per_partition": 1024,
            "created_at": 1790624025,
            "role": "standalone"
          }
        ]
      }
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://127.0.0.1:7942
    description: >-
      A local node. In a cluster, use any node's API port or the load
      balancer in front of them.

security:
  - basicAuth: []

tags:
  - name: Topics
    description: Create, inspect, change and delete topics.
  - name: Fan-out children
    description: >-
      Link topics so every message produced to a parent is copied to
      each child, now or after a delay.
  - name: Messages
    description: Produce, consume and acknowledge messages.
  - name: Users
    description: >-
      Manage the users and grants of a cluster with security on. Every
      operation here needs the admin grant, except changing your own
      password.
  - name: Cluster
    description: See members and partition moves, and drain a member.
  - name: Health and metrics
    description: Probes for Kubernetes and the Prometheus exposition.

paths:
  /v1/topics:
    post:
      operationId: createTopic
      tags: [Topics]
      summary: Create a topic
      description: >-
        Creates a topic. Every setting you leave out or send as `0` takes
        the server's default. With `parent`, the new topic is created as
        a fan-out child of that topic in the same call.
      x-narad-grant: >-
        `create` on the topic name. With `parent`, also owner of the
        parent topic, or admin. The creator becomes the topic's owner.
      x-narad-guide: https://debanganthakuria.github.io/narad/build/topics/
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopicRequest'
            example:
              name: orders
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        "400":
          description: >-
            Malformed JSON, an unknown field, an invalid name, fewer than
            3 or more than `topic.max_partitions` partitions, a retention
            under one hour, or an invalid schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: The `parent` topic does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: >-
            A topic with this name exists, or the `parent` link conflicts
            with the parent's role, its child limit or its retention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "413":
          $ref: '#/components/responses/TooLarge'
        "503":
          $ref: '#/components/responses/ControlPlaneUnavailable'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" -X POST "$NARAD/v1/topics" \
            -H 'Content-Type: application/json' \
            -d '{"name":"orders"}'
        response: |-
          HTTP/1.1 201 Created
          Content-Type: application/json

          {
            "name": "orders",
            "id": "8108d715b7a0464e",
            "partitions": 3,
            "retention_ms": 604800000,
            "visibility_timeout_ms": 30000,
            "max_in_flight_per_partition": 1024,
            "max_acked_ahead_per_partition": 1024,
            "created_at": 1790624025
          }
    get:
      operationId: listTopics
      tags: [Topics]
      summary: List topics
      description: >-
        Lists topics in name order, one page at a time. The page holds
        only the topics you may read, so it can be shorter than `limit`,
        or empty, while `next_page_token` is still set.
      x-narad-grant: >-
        None. The list shows only topics you hold any grant on or own;
        an admin sees every topic.
      x-narad-guide: https://debanganthakuria.github.io/narad/build/topics/
      parameters:
        - name: limit
          in: query
          description: >-
            Page size. Values above 1000 are cut to 1000; `0` or a
            negative number gets `400`.
          schema:
            type: integer
            minimum: 1
            default: 100
        - name: page_token
          in: query
          description: >-
            The `next_page_token` of the previous page. Leave it out for
            the first page.
          schema:
            type: string
      responses:
        "200":
          description: One page of topics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicList'
        "400":
          description: '`limit` is not a positive integer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" "$NARAD/v1/topics?limit=2"
        response: |-
          HTTP/1.1 200 OK
          Content-Type: application/json

          {
            "next_page_token": "orders",
            "topics": [
              {
                "name": "invoices",
                "id": "3d8a755f3b78806e",
                "partitions": 3,
                "retention_ms": 604800000,
                "visibility_timeout_ms": 30000,
                "max_in_flight_per_partition": 1024,
                "max_acked_ahead_per_partition": 1024,
                "created_at": 1790624025,
                "role": "standalone"
              },
              {
                "name": "orders",
                "id": "8108d715b7a0464e",
                "partitions": 3,
                "retention_ms": 604800000,
                "visibility_timeout_ms": 30000,
                "max_in_flight_per_partition": 1024,
                "max_acked_ahead_per_partition": 1024,
                "created_at": 1790624025,
                "role": "standalone"
              }
            ]
          }

  /v1/topics/{topic}:
    parameters:
      - $ref: '#/components/parameters/Topic'
    get:
      operationId: getTopic
      tags: [Topics]
      summary: Get a topic
      description: >-
        Returns the topic record with its current schema and, for each
        partition, its size, offsets and owning node, gathered from every
        node.
      x-narad-grant: Any grant on the topic, ownership of it, or admin.
      x-narad-guide: https://debanganthakuria.github.io/narad/build/topics/
      parameters:
        - name: partition
          in: query
          description: >-
            Return the stats of this partition only (0-based). Out of
            range gets `400`.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The topic with its per-partition stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDetails'
        "400":
          description: '`partition` is not a partition of the topic.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/TopicNotFound'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" "$NARAD/v1/topics/orders?partition=0"
        response: |-
          HTTP/1.1 200 OK
          Content-Type: application/json

          {
            "name": "orders",
            "id": "8108d715b7a0464e",
            "partitions": 3,
            "retention_ms": 604800000,
            "visibility_timeout_ms": 30000,
            "max_in_flight_per_partition": 1024,
            "max_acked_ahead_per_partition": 1024,
            "created_at": 1790624025,
            "role": "standalone",
            "schema_version": 0,
            "partition_stats": [
              {
                "index": 0,
                "segments": 0,
                "oldest_offset": 0,
                "next_offset": 0,
                "high_watermark": 0,
                "size_bytes": 0,
                "owner_node": "narad-0"
              }
            ]
          }
    patch:
      operationId: alterTopic
      tags: [Topics]
      summary: Change a topic
      description: >-
        Changes one or more settings. Each setting you send is applied as
        its own update, in this order: retention, the two caps,
        partitions, schema. The first failure stops the rest and leaves
        the earlier ones applied, so send one setting per request when
        you need all or nothing. The visibility timeout is fixed at
        create time.
      x-narad-grant: Owner of the topic, or admin.
      x-narad-guide: https://debanganthakuria.github.io/narad/build/topics/
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterTopicRequest'
            example:
              retention_ms: 86400000
      responses:
        "200":
          description: >-
            Changed. The body is the topic record after the last applied
            change, without partition stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        "400":
          description: >-
            No setting sent, an unknown field (including
            `visibility_timeout_ms`), a partition count that does not
            grow, a retention under one hour, a negative value, or a
            schema that is invalid, `null`, or incompatible with the
            current one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/TopicNotFound'
        "409":
          description: >-
            `schema_base_version` is not the current version, the schema
            history is full (1000 versions), the topic is an attached
            child whose schema its parent manages, or a shorter retention
            could not hold a delay child's delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "413":
          $ref: '#/components/responses/TooLarge'
        "503":
          $ref: '#/components/responses/ControlPlaneUnavailable'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" -X PATCH "$NARAD/v1/topics/orders" \
            -H 'Content-Type: application/json' \
            -d '{"retention_ms":86400000}'
        response: |-
          HTTP/1.1 200 OK
          Content-Type: application/json

          {
            "name": "orders",
            "id": "8108d715b7a0464e",
            "partitions": 3,
            "retention_ms": 86400000,
            "visibility_timeout_ms": 30000,
            "max_in_flight_per_partition": 1024,
            "max_acked_ahead_per_partition": 1024,
            "created_at": 1790624025,
            "role": "standalone"
          }
    delete:
      operationId: deleteTopic
      tags: [Topics]
      summary: Delete a topic
      description: >-
        Deletes the topic and every message in it. The delete is final
        once it answers `204`; each node then removes its copy of the
        topic's files.
      x-narad-grant: Owner of the topic, or admin.
      x-narad-guide: https://debanganthakuria.github.io/narad/build/topics/
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/TopicNotFound'
        "503":
          $ref: '#/components/responses/ControlPlaneUnavailable'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" -X DELETE "$NARAD/v1/topics/orders-audit"
        response: |-
          HTTP/1.1 204 No Content

  /v1/topics/{topic}/schema:
    parameters:
      - $ref: '#/components/parameters/Topic'
    get:
      operationId: getSchemaHistory
      tags: [Topics]
      summary: Get a topic's schema history
      description: >-
        Returns every schema version of the topic, oldest first, and the
        number of the current one. A topic without a schema answers
        version `0` and an empty list.
      x-narad-grant: Any grant on the topic, ownership of it, or admin.
      x-narad-guide: https://debanganthakuria.github.io/narad/build/schemas/
      responses:
        "200":
          description: The schema history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaHistory'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/TopicNotFound'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" "$NARAD/v1/topics/orders/schema"
        response: |-
          HTTP/1.1 200 OK
          Content-Type: application/json

          {
            "topic": "orders",
            "version": 1,
            "versions": [
              {
                "version": 1,
                "schema": {
                  "type": "object",
                  "required": [
                    "id"
                  ]
                }
              }
            ]
          }

  /v1/topics/{parent}/children:
    parameters:
      - $ref: '#/components/parameters/Parent'
    post:
      operationId: attachChild
      tags: [Fan-out children]
      summary: Attach a child
      description: >-
        Links an existing topic as a fan-out child of `parent`. From now
        on every message produced to the parent is copied to the child;
        messages already in the parent are not. To create the child and
        link it in one call, create it with `parent` instead, which also
        places its partitions away from the parent's.
      x-narad-grant: Owner of both topics, or admin.
      x-narad-guide: https://debanganthakuria.github.io/narad/build/fanout-and-delay/
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachChildRequest'
            example:
              child: orders-audit
      responses:
        "200":
          description: Attached. The body is the parent's topic record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        "400":
          description: >-
            Malformed JSON, an unknown field, no `child`, a negative
            `delay_ms`, a delay over one year, or a body over 1 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: The parent or the child topic does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: >-
            The child is already attached, one of the topics has a role
            that cannot take the link, the parent has 108 children, the
            schemas do not match, or the delay is longer than the
            parent's retention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          $ref: '#/components/responses/ControlPlaneUnavailable'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" -X POST "$NARAD/v1/topics/orders/children" \
            -H 'Content-Type: application/json' \
            -d '{"child":"orders-audit"}'
        response: |-
          HTTP/1.1 200 OK
          Content-Type: application/json

          {
            "name": "orders",
            "id": "8108d715b7a0464e",
            "partitions": 3,
            "retention_ms": 86400000,
            "visibility_timeout_ms": 30000,
            "max_in_flight_per_partition": 1024,
            "max_acked_ahead_per_partition": 1024,
            "created_at": 1790624025,
            "role": "parent",
            "children": [
              "orders-audit"
            ]
          }
    get:
      operationId: listChildren
      tags: [Fan-out children]
      summary: List children
      description: >-
        Lists the parent's children with each one's delay and how many
        parent messages it has not received yet.
      x-narad-grant: Any grant on the parent, ownership of it, or admin.
      x-narad-guide: https://debanganthakuria.github.io/narad/build/fanout-and-delay/
      responses:
        "200":
          description: The children, in attach order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildList'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/TopicNotFound'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" "$NARAD/v1/topics/orders/children"
        response: |-
          HTTP/1.1 200 OK
          Content-Type: application/json

          {
            "parent": "orders",
            "children": [
              {
                "name": "orders-audit",
                "delay_ms": 0,
                "lag_messages": 0,
                "lag_complete": false
              }
            ]
          }

  /v1/topics/{parent}/children/{child}:
    parameters:
      - $ref: '#/components/parameters/Parent'
      - name: child
        in: path
        required: true
        description: The child topic to unlink.
        schema:
          type: string
    delete:
      operationId: detachChild
      tags: [Fan-out children]
      summary: Detach a child
      description: >-
        Unlinks the child. Both topics and their messages stay; the child
        stops receiving the parent's messages. Attaching it again starts
        from the parent's messages stored after the new attach.
      x-narad-grant: Owner of either topic, or admin.
      x-narad-guide: https://debanganthakuria.github.io/narad/build/fanout-and-delay/
      responses:
        "204":
          description: Detached.
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: >-
            One of the topics does not exist, or the child is not
            attached to this parent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          $ref: '#/components/responses/ControlPlaneUnavailable'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" -X DELETE \
            "$NARAD/v1/topics/orders/children/orders-audit"
        response: |-
          HTTP/1.1 204 No Content

  /v1/topics/{topic}/produce:
    parameters:
      - $ref: '#/components/parameters/Topic'
    post:
      operationId: produce
      tags: [Messages]
      summary: Produce a message
      description: >-
        Stores the request body as one message. `202` means the message
        is on disk on the node you reached and will be delivered; do not
        send it again. The body is stored as sent: any bytes, up to
        1 MiB. On a topic with a schema it must be JSON that the schema
        accepts.
      x-narad-grant: '`produce` on the topic.'
      x-narad-guide: https://debanganthakuria.github.io/narad/build/producing/
      parameters:
        - name: key
          in: query
          description: >-
            Messages with the same key go to the same partition. Without
            a key, messages are spread over the partitions in turn and
            stored with no key (unreleased: v3.0.1 gives a keyless message
            an invented `key-<n>`). Send it once at most.
          schema:
            type: string
        - name: partition
          in: query
          description: >-
            Put the message on this partition (0-based) instead of
            picking one from the key. Send it once at most.
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        description: The message payload, 1 byte to 1 MiB.
        content:
          application/json:
            schema: {}
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Accepted and durable. No body.
        "400":
          description: >-
            An empty body, a repeated `key` or `partition`, a partition
            out of range, or a payload the topic's schema rejects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/TopicNotFound'
        "409":
          description: >-
            The topic is a delay child, which receives messages only from
            its parent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "413":
          $ref: '#/components/responses/TooLarge'
        "429":
          description: >-
            Too many concurrent produces for your identity on this node
            (`http.max_produce_in_flight_per_identity`, off by default;
            unreleased), or too many wrong passwords for your username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: >-
            `produce failed`: the node cannot write its ingress WAL and
            refuses every produce until it restarts. Send the message to
            another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" -X POST \
            "$NARAD/v1/topics/orders/produce?key=customer-42" \
            -H 'Content-Type: application/json' \
            -d '{"id":"o-1001","total":42.5}'
        response: |-
          HTTP/1.1 202 Accepted

  /v1/topics/{topic}/produce/batch:
    parameters:
      - $ref: '#/components/parameters/Topic'
    post:
      operationId: produceBatch
      tags: [Messages]
      summary: Produce a batch
      description: >-
        Stores up to 100 messages in one request, all or none. Every
        message is checked as a single produce would check it before any
        is stored; the first that fails is answered with the status a
        single produce of it would get, its error starting with
        `message <index>: `. `202` means every message is durable.
      x-narad-since: unreleased
      x-narad-grant: '`produce` on the topic.'
      x-narad-guide: https://debanganthakuria.github.io/narad/build/producing/
      requestBody:
        required: true
        description: At most 1 MiB, like a single produce.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProduceBatchRequest'
            example:
              messages:
                - key: customer-42
                  payload:
                    id: o-1002
                - key: customer-43
                  payload:
                    id: o-1003
      responses:
        "202":
          description: Every message is accepted and durable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProduceBatchAccepted'
        "400":
          description: >-
            Malformed JSON, an unknown field, no messages, more than 100,
            a `key` or `partition` query parameter, or a message that a
            single produce would refuse with `400`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: >-
            The topic does not exist, or the node runs a release without
            batch produce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: The topic is a delay child.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "413":
          $ref: '#/components/responses/TooLarge'
        "429":
          description: >-
            Too many concurrent produces for your identity on this node;
            a batch counts as its message count. Also too many wrong
            passwords for your username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: >-
            `produce failed`: the node cannot write its ingress WAL. Send
            the batch to another node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" -X POST \
            "$NARAD/v1/topics/orders/produce/batch" \
            -H 'Content-Type: application/json' \
            -d '{"messages":[
                  {"key":"customer-42","payload":{"id":"o-1002"}},
                  {"key":"customer-43","payload":{"id":"o-1003"}}]}'
        response: |-
          HTTP/1.1 202 Accepted
          Content-Type: application/json

          {
            "accepted": 2
          }

  /v1/topics/{topic}/consume:
    parameters:
      - $ref: '#/components/parameters/Topic'
    get:
      operationId: consume
      tags: [Messages]
      summary: Consume messages
      description: >-
        Takes the next available message and leases it to you for the
        topic's visibility timeout. Ack it with its `receipt_handle`
        before the lease ends, or it is delivered again. `204` means
        nothing arrived within `wait`. With `partition` and `offset` it
        replays one stored message instead: no lease, no receipt handle,
        and no wait.
      x-narad-grant: '`consume` on the topic.'
      x-narad-guide: https://debanganthakuria.github.io/narad/build/consuming/
      parameters:
        - name: wait
          in: query
          description: >-
            How long to wait for a message when none is available, as a
            Go duration (`500ms`, `10s`). At most `http.max_consume_wait`
            (10 s by default); a longer value is cut to it and the answer
            carries `X-Narad-Wait-Clamped`. A negative value counts as
            `0`.
          schema:
            type: string
            default: '0'
        - name: max
          in: query
          x-narad-since: unreleased
          description: >-
            Take up to this many messages (1 to 100) in one answer,
            `{"messages":[...]}`, each with its own receipt handle and
            lease. The answer holds what is there when the first message
            arrives; it does not wait to fill `max`. Cannot be combined
            with `offset`.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: partition
          in: query
          description: >-
            Take only from this partition (0-based). Needed with
            `offset`.
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: >-
            Replay the message at this offset of `partition`. Past the
            newest message the answer is `204`; below the oldest kept
            message it is `410`.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: >-
            One message, or with `max`, `{"messages":[...]}` (unreleased).
          headers:
            X-Narad-Wait-Clamped:
              $ref: '#/components/headers/WaitClamped'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Message'
                  - $ref: '#/components/schemas/MessageBatch'
        "204":
          description: >-
            No message within `wait`, or a replay offset past the newest
            message. No body.
          headers:
            X-Narad-Wait-Clamped:
              $ref: '#/components/headers/WaitClamped'
        "400":
          description: >-
            A malformed `wait`, `partition`, `offset` or `max`; `offset`
            without `partition`; `max` with `offset`; or a partition out
            of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/TopicNotFound'
        "410":
          description: >-
            Replay only: the offset has aged out of retention, or the
            record there cannot be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "421":
          $ref: '#/components/responses/NotPartitionOwner'
        "429":
          description: >-
            Too many concurrent consumes for your identity on this node
            (`http.max_consume_in_flight_per_identity`, 1024 by default;
            a batch counts as its `max`), or too many wrong passwords for
            your username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "502":
          $ref: '#/components/responses/ForwardFailed'
        "503":
          $ref: '#/components/responses/OwnerDown'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" "$NARAD/v1/topics/orders/consume?wait=10s"
        response: |-
          HTTP/1.1 200 OK
          Content-Type: application/json

          {
            "topic": "orders",
            "partition": 0,
            "offset": 0,
            "key": "customer-43",
            "payload": {
              "id": "o-1003"
            },
            "timestamp": 1790624025,
            "receipt_handle": "0:0:2062962624719228915"
          }

  /v1/topics/{topic}/ack:
    parameters:
      - $ref: '#/components/parameters/Topic'
    post:
      operationId: ack
      tags: [Messages]
      summary: Acknowledge messages
      description: >-
        Settles a leased message by its receipt handle: acks it for good
        (the default), renews its lease with `extend=true`, or hands it
        back for redelivery with `extend=0`. Without `receipt_handle`, a
        JSON body `{"receipt_handles":[...]}` settles up to 100 handles,
        each on its own. A request with no body still needs the content
        type or `X-Narad-Client` header.
      x-narad-grant: '`consume` on the topic.'
      x-narad-guide: https://debanganthakuria.github.io/narad/build/consuming/
      parameters:
        - name: receipt_handle
          in: query
          description: >-
            The handle from the consume answer. Leave it out to send a
            batch in the body.
          schema:
            type: string
        - name: extend
          in: query
          description: >-
            `true` (or `1`) renews the lease to a full visibility timeout
            from now, so a slow handler can keep the message and ack it
            later with the same handle. `0` ends the lease now and makes
            the message available again (a nack). Absent, empty or
            `false` acks. Applies to every handle of a batch.
          schema:
            type: string
            enum: ['true', '1', '0', 'false']
      requestBody:
        required: false
        description: >-
          A batch ack (unreleased), at most 64 KiB. Only read when
          `receipt_handle` is absent.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckBatchRequest'
            example:
              receipt_handles:
                - 1:0:6691503329743409666
                - 1:1:27800848421602791
      responses:
        "204":
          description: Settled.
        "200":
          x-narad-since: unreleased
          description: >-
            Batch only: one result per handle in request order, each with
            the status a single ack of that handle would have got. Retry
            the handles answered `502` or `503`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckBatchResults'
        "400":
          description: >-
            No handle, a malformed handle, an `extend` value other than
            `true`, `1`, `0` or `false`, or a malformed batch body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/TopicNotFound'
        "410":
          description: >-
            The lease has ended: the visibility timeout passed, or the
            message was already acked or handed back. A message whose
            lease lapsed is delivered again, possibly to another
            consumer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "413":
          description: A batch ack body over 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "421":
          $ref: '#/components/responses/NotPartitionOwner'
        "502":
          x-narad-origin: forwarding
          description: >-
            The node you reached forwarded the ack to the partition's
            owner and got no answer. Plain text body. Retry: an ack
            cannot land twice, so a retry of one that had landed answers
            `410`.
          content:
            text/plain:
              schema:
                type: string
        "503":
          $ref: '#/components/responses/OwnerDown'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" -X POST \
            "$NARAD/v1/topics/orders/ack?receipt_handle=0:0:2062962624719228915" \
            -H 'Content-Type: application/json'
        response: |-
          HTTP/1.1 204 No Content

  /v1/users:
    post:
      operationId: createUser
      tags: [Users]
      summary: Create a user
      description: >-
        Creates a user with a password and grants. You can only hand out
        grants you hold yourself, and only the root admin can hand out
        `admin`.
      x-narad-grant: '`admin`.'
      x-narad-guide: https://debanganthakuria.github.io/narad/operate/users/
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        "201":
          description: Created. The body never carries the password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/UserBadRequest'
        "403":
          description: >-
            You are not an admin, or the grants go beyond your own.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: The username is taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          $ref: '#/components/responses/ControlPlaneUnavailable'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" -X POST "$NARAD/v1/users" \
            -H 'Content-Type: application/json' \
            -d '{"username":"billing-service","password":"'"$PASSWORD"'",
                 "grants":[{"action":"produce","patterns":["orders"]}]}'
        note: >-
          `$PASSWORD` holds the new user's password, 1 to 72 bytes. Keep it
          out of your shell history.
    get:
      operationId: listUsers
      tags: [Users]
      summary: List users
      description: Lists every user, without passwords.
      x-narad-grant: '`admin`.'
      x-narad-guide: https://debanganthakuria.github.io/narad/operate/users/
      responses:
        "200":
          description: Every user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        "403":
          $ref: '#/components/responses/Forbidden'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" "$NARAD/v1/users"

  /v1/users/{username}:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      operationId: getUser
      tags: [Users]
      summary: Get a user
      description: Returns one user, without the password.
      x-narad-grant: '`admin`.'
      x-narad-guide: https://debanganthakuria.github.io/narad/operate/users/
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/UserNotFound'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" "$NARAD/v1/users/billing-service"
    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Delete a user
      description: >-
        Deletes a user. The root admin cannot be deleted, and you cannot
        delete yourself.
      x-narad-grant: '`admin`.'
      x-narad-guide: https://debanganthakuria.github.io/narad/operate/users/
      responses:
        "204":
          description: Deleted.
        "403":
          description: >-
            You are not an admin, the user is the root admin, or the user
            is you.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/responses/UserNotFound'
        "503":
          $ref: '#/components/responses/ControlPlaneUnavailable'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" -X DELETE "$NARAD/v1/users/billing-service"

  /v1/users/{username}/grants:
    parameters:
      - $ref: '#/components/parameters/Username'
    put:
      operationId: updateGrants
      tags: [Users]
      summary: Replace a user's grants
      description: >-
        Replaces the user's grants with the list you send; the password
        is untouched. You cannot change your own grants or the root
        admin's, and you can only hand out grants you hold.
      x-narad-grant: '`admin`.'
      x-narad-guide: https://debanganthakuria.github.io/narad/operate/users/
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGrantsRequest'
            example:
              grants:
                - action: produce
                  patterns: [orders, invoices-*]
                - action: consume
                  patterns: [orders]
      responses:
        "200":
          description: Changed. The body is the user as stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/UserBadRequest'
        "403":
          description: >-
            You are not an admin, the user is you or the root admin, or
            the grants go beyond your own.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/responses/UserNotFound'
        "503":
          $ref: '#/components/responses/ControlPlaneUnavailable'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" -X PUT \
            "$NARAD/v1/users/billing-service/grants" \
            -H 'Content-Type: application/json' \
            -d '{"grants":[{"action":"produce","patterns":["orders"]},
                           {"action":"consume","patterns":["orders"]}]}'

  /v1/users/{username}/password:
    parameters:
      - $ref: '#/components/parameters/Username'
    put:
      operationId: updatePassword
      tags: [Users]
      summary: Change a password
      description: >-
        Sets a new password; grants are untouched. Anyone may change
        their own password by also sending the current one. An admin may
        set anyone's password without it, except the root admin's, which
        only the root admin can change.
      x-narad-grant: '`admin`, or the user themself with `current_password`.'
      x-narad-guide: https://debanganthakuria.github.io/narad/operate/users/
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        "204":
          description: Changed.
        "400":
          $ref: '#/components/responses/UserBadRequest'
        "403":
          description: >-
            You are neither an admin nor the user, the current password
            is wrong, or the user is the root admin and you are not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          $ref: '#/components/responses/UserNotFound'
        "503":
          $ref: '#/components/responses/ControlPlaneUnavailable'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" -X PUT \
            "$NARAD/v1/users/billing-service/password" \
            -H 'Content-Type: application/json' \
            -d '{"new_password":"'"$NEW_PASSWORD"'"}'
        note: >-
          `$NEW_PASSWORD` holds the new password, 1 to 72 bytes. To change
          your own password without the admin grant, also send
          `current_password`.

  /v1/cluster/members:
