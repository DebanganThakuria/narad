      x-narad-grant: '`admin`.'
      x-narad-guide: https://debanganthakuria.github.io/narad/operate/scaling/
      responses:
        "200":
          description: The moves, sorted by topic and partition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveList'
        "403":
          $ref: '#/components/responses/Forbidden'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" "$NARAD/v1/cluster/moves"
        response: |-
          HTTP/1.1 200 OK
          Content-Type: application/json

          {
            "moves": []
          }

  /v1/cluster/members/{id}/decommission:
    parameters:
      - name: id
        in: path
        required: true
        description: The member's id, as `GET /v1/cluster/members` shows it.
        schema:
          type: string
    post:
      operationId: decommissionMember
      tags: [Cluster]
      summary: Drain a member
      description: >-
        Marks the member as draining: it keeps serving while its
        partitions move to the other live nodes, and once it owns none it
        leaves the Raft voter set. Remove the node only once
        `GET /v1/cluster/members` shows it with `owned_partitions` at 0.
      x-narad-grant: '`admin`.'
      x-narad-guide: https://debanganthakuria.github.io/narad/operate/scaling/
      responses:
        "204":
          description: Marked as draining.
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/MemberNotFound'
        "503":
          $ref: '#/components/responses/ControlPlaneUnavailable'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" -X POST \
            "$NARAD/v1/cluster/members/narad-0/decommission" \
            -H 'Content-Type: application/json'
        response: |-
          HTTP/1.1 204 No Content
    delete:
      operationId: cancelDecommission
      tags: [Cluster]
      summary: Cancel a drain
      description: >-
        Clears the member's draining mark, so it can be given partitions
        again.
      x-narad-grant: '`admin`.'
      x-narad-guide: https://debanganthakuria.github.io/narad/operate/scaling/
      responses:
        "204":
          description: No longer draining.
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/MemberNotFound'
        "503":
          $ref: '#/components/responses/ControlPlaneUnavailable'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i -u "$AUTH" -X DELETE \
            "$NARAD/v1/cluster/members/narad-0/decommission"
        response: |-
          HTTP/1.1 204 No Content

  /healthz:
    get:
      operationId: healthz
      tags: [Health and metrics]
      summary: Check liveness
      description: >-
        Answers `200` while the process runs, and `503` once a graceful
        shutdown has begun. Needs no credentials.
      security: []
      x-narad-grant: None; no credentials needed.
      x-narad-guide: https://debanganthakuria.github.io/narad/operate/monitoring/
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "503":
          description: 'Shutting down: `{"status":"shutting down"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i "$NARAD/healthz"
        response: |-
          HTTP/1.1 200 OK
          Content-Type: application/json

          {
            "status": "ok"
          }

  /readyz:
    get:
      operationId: readyz
      tags: [Health and metrics]
      summary: Check readiness
      description: >-
        Answers `200` once the node has finished starting and while it is
        in live contact with the Raft leader and caught up with partition
        ownership. Otherwise `503` with the reason. Needs no credentials.
      security: []
      x-narad-grant: None; no credentials needed.
      x-narad-guide: https://debanganthakuria.github.io/narad/operate/monitoring/
      responses:
        "200":
          description: Ready for traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "503":
          description: Not ready; the error names the reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -i "$NARAD/readyz"
        response: |-
          HTTP/1.1 200 OK
          Content-Type: application/json

          {
            "status": "ready"
          }

  /metrics:
    get:
      operationId: metrics
      tags: [Health and metrics]
      summary: Scrape metrics
      description: >-
        The Prometheus exposition. It is served here, behind the API
        credentials, unless `http.metrics_addr` moves it to a listener of
        its own; `http.metrics_unauthenticated` serves it here without
        credentials.
      x-narad-grant: >-
        Any valid credentials; none with `http.metrics_unauthenticated`.
      x-narad-guide: https://debanganthakuria.github.io/narad/operate/monitoring/
      responses:
        "200":
          description: The metrics, in the Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/AuthThrottled'
        "500":
          $ref: '#/components/responses/InternalError'
      x-narad-example:
        request: |-
          curl -sS -u "$AUTH" "$NARAD/metrics" | grep '^narad_topics_total'
        response: |-
          narad_topics_total 2

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        A Narad username and password. Not needed when security is off.

  parameters:
    Topic:
      name: topic
      in: path
      required: true
      description: The topic name.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,255}$'
    Parent:
      name: parent
      in: path
      required: true
      description: The parent topic.
      schema:
        type: string
    Username:
      name: username
      in: path
      required: true
      description: The username.
      schema:
        type: string

  headers:
    WaitClamped:
      description: >-
        Sent when `wait` was longer than `http.max_consume_wait`; its
        value is the wait that was used, such as `10s`.
      schema:
        type: string

  responses:
    Unauthorized:
      x-narad-common: true
      x-narad-short: missing or wrong credentials
      description: >-
        Missing or wrong credentials (security on).
      headers:
        WWW-Authenticate:
          description: Always `Basic realm="narad"`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthThrottled:
      x-narad-common: true
      x-narad-short: too many wrong passwords
      description: >-
        Too many wrong passwords for this username on this node. Wait,
        then retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      x-narad-common: true
      x-narad-short: a write without an accepted content type
      description: >-
        No `Content-Type: application/json` or `application/octet-stream`
        and no `X-Narad-Client` header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      x-narad-common: true
      x-narad-short: a fault on the node
      description: >-
        A fault on the node, including one that stops it checking
        passwords. The error says what failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >-
        Authenticated, but without the grant this operation needs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TopicNotFound:
      description: The topic does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UserNotFound:
      description: The user does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MemberNotFound:
      description: No member has this id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UserBadRequest:
      description: >-
        Malformed JSON, an unknown field, a body over 1 MiB, a username
        outside `^[A-Za-z0-9._-]{1,64}$`, a password that is empty or
        over 72 bytes, or an invalid grant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: The body is over 1 MiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ControlPlaneUnavailable:
      description: >-
        The change could not be committed right now: no Raft leader, or
        the leader could not be reached (then the body is plain text).
        Retry after a short wait.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/plain:
          schema:
            type: string
    NotPartitionOwner:
      description: >-
        The node you reached does not own the partition right now,
        usually because it is moving. Retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForwardFailed:
      x-narad-origin: forwarding
      description: >-
        The node you reached forwarded the request to the partition's
        owner and got no answer. Plain text body. Retry.
      content:
        text/plain:
          schema:
            type: string
    OwnerDown:
      description: >-
        The partition's owner is down (plain text body, `partition owner
        is down; retry later`), or the cluster cannot serve the request
        right now. Retry after a short wait.
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      title: Error
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: What went wrong, for people to read.

    Status:
      title: Probe status
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: '`ok`, `ready` or `shutting down`.'

    CreateTopicRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,255}$'
          description: The topic name; not `.` or `..`.
        partitions:
          type: integer
          minimum: 0
          default: 0
          description: >-
            How many partitions: at least 3 and at most
            `topic.max_partitions` (108 by default). `0` takes
            `topic.default_partitions` (3), or the parent's count with
            `parent`. Partitions can be added later, never removed.
        retention_ms:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: >-
            How long messages are kept, acked or not; at least 3600000
            (one hour). `0` takes `topic.default_retention_age_ms` (7
            days).
        visibility_timeout_ms:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: >-
            How long a consumed message stays leased before it is
            delivered again. `0` takes
            `topic.default_visibility_timeout_ms` (30 s). Cannot be
            changed later.
        max_in_flight_per_partition:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: >-
            The most leased, unacked messages one partition hands out at
            once. `0` takes `topic.default_max_in_flight_per_partition`
            (1024).
        max_acked_ahead_per_partition:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: >-
            The most messages one partition keeps acked ahead of its
            oldest unacked message. `0` takes
            `topic.default_max_acked_ahead_per_partition` (1024).
        schema:
          description: >-
            A JSON Schema document every produced payload must match, at
            most 256 KiB. Leave it out for a topic that takes any bytes.
        parent:
          type: string
          description: >-
            Create the topic as a fan-out child of this existing topic,
            with its partitions placed away from the parent's.
        fanout_delay_ms:
          type: integer
          format: int64
          minimum: 0
          maximum: 31536000000
          default: 0
          description: >-
            With `parent` only: deliver each parent message this long
            after the parent stored it, which makes the topic a delay
            child. At most one year. Attaching an existing topic takes
            `delay_ms` instead.
        owner:
          type: string
          description: Ignored; the owner is always the caller.

    AlterTopicRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        partitions:
          type: integer
          minimum: 0
          description: >-
            The new partition count; must be more than the current one.
            `0` leaves it unchanged.
        retention_ms:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The new retention, at least one hour; `0` sets the server
            default.
        max_in_flight_per_partition:
          type: integer
          format: int64
          minimum: 0
          description: The new in-flight cap; `0` sets the server default.
        max_acked_ahead_per_partition:
          type: integer
          format: int64
          minimum: 0
          description: The new acked-ahead cap; `0` sets the server default.
        schema:
          description: >-
            Register this JSON Schema document as the next version. It
            must accept everything the current version accepts. A schema
            cannot be removed; `null` gets `400`.
        schema_base_version:
          type: integer
          minimum: 0
          description: >-
            With `schema` only: apply it only if the current version is
            this number, else `409`. Use it so two writers cannot
            overwrite each other.

    Topic:
      title: Topic
      type: object
      properties:
        name:
          type: string
          description: The topic name.
        id:
          type: string
          description: >-
            Identifies this incarnation of the name; a topic deleted and
            created again gets a new id.
        partitions:
          type: integer
          description: How many partitions the topic has.
        retention_ms:
          type: integer
          format: int64
          description: How long messages are kept, in milliseconds.
        visibility_timeout_ms:
          type: integer
          format: int64
          description: How long a consumed message stays leased, in milliseconds.
        max_in_flight_per_partition:
          type: integer
          format: int64
          description: The most leased, unacked messages per partition.
        max_acked_ahead_per_partition:
          type: integer
          format: int64
          description: >-
            The most messages per partition acked ahead of the oldest
            unacked one.
        created_at:
          type: integer
          format: int64
          description: Unix seconds.
        owner:
          type: string
          description: The username that created it; absent with security off.
        role:
          type: string
          enum: [standalone, parent, child]
          description: >-
            The topic's place in fan-out: `standalone`, `parent` or
            `child`. Absent in the answer to creating a standalone topic.
        children:
          type: array
          items:
            type: string
          description: A parent's children, in attach order.
        parent:
          type: string
          description: A child's parent.
        attach_epoch:
          type: string
          description: A child's current attachment; a new attach gets a new one.
        fanout_delay_ms:
          type: integer
          format: int64
          description: A delay child's delay.
        attach_offsets:
          type: array
          items:
            type: integer
            format: int64
          description: >-
            A child's starting point: the parent's committed offset per
            parent partition when it was attached.

    TopicDetails:
      title: Topic details
      description: A topic record plus its schema and partition stats.
      allOf:
        - $ref: '#/components/schemas/Topic'
        - type: object
          properties:
            schema_version:
              type: integer
              description: The current schema version; `0` without a schema.
            schema:
              description: The current schema document; absent without one.
            partition_stats:
              type: array
              description: One entry per partition, or only the one asked for.
              items:
                $ref: '#/components/schemas/PartitionStats'

    PartitionStats:
      title: Partition stats
      type: object
      properties:
        index:
          type: integer
          description: The partition number, from 0.
        segments:
          type: integer
          description: Log segment files on disk.
        oldest_offset:
          type: integer
          format: int64
          description: The oldest offset still kept.
        next_offset:
          type: integer
          format: int64
          description: The offset the next stored message will get.
        high_watermark:
          type: integer
          format: int64
          description: >-
            One past the newest message consumers can see.
        size_bytes:
          type: integer
          format: int64
          description: Bytes on disk.
        oldest_segment_at:
          type: integer
          format: int64
          description: Unix seconds of the oldest segment; absent when unknown.
        owner_node:
          type: string
          description: The node that owns the partition and holds its data.

    TopicList:
      title: Topic list
      type: object
      properties:
        topics:
          type: array
          description: This page's topics, in name order.
          items:
            $ref: '#/components/schemas/Topic'
        next_page_token:
          type: string
          description: Pass as `page_token` for the next page; empty on the last.

    SchemaHistory:
      title: Schema history
      type: object
      properties:
        topic:
          type: string
          description: The topic name.
        version:
          type: integer
          description: The current version; `0` without a schema.
        versions:
          type: array
          description: Every version, oldest first.
          items:
            type: object
            properties:
              version:
                type: integer
                description: The version number, from 1.
              schema:
                description: The schema document of that version.

    AttachChildRequest:
      type: object
      required: [child]
      additionalProperties: false
      properties:
        child:
          type: string
          description: The existing topic to link.
        delay_ms:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: >-
            Deliver each parent message this long after the parent
            stored it, which makes the child a delay child. At most one
            year and no longer than the parent's retention. Creating a
            child with `parent` takes `fanout_delay_ms` instead.

    ChildList:
      title: Child list
      type: object
      properties:
        parent:
          type: string
          description: The parent topic.
        children:
          type: array
          description: The children, in attach order.
          items:
            type: object
            properties:
              name:
                type: string
                description: The child topic.
              delay_ms:
                type: integer
                format: int64
                description: '`0` for a child without delay.'
              lag_messages:
                type: integer
                format: int64
                description: Parent messages the child has not received yet.
              lag_complete:
                type: boolean
                description: >-
                  `false` while some partitions have not reported, which
                  makes `lag_messages` a lower bound.

    Message:
      title: Message
      type: object
      properties:
        topic:
          type: string
          description: The topic name.
        partition:
          type: integer
          description: The partition the message is on.
        offset:
          type: integer
          format: int64
          description: Its position in the partition, from 0.
        key:
          type: string
          description: Absent when the message has no key.
        key_encoding:
          type: string
          enum: [base64]
          x-narad-since: unreleased
          description: >-
            `base64` when the key is not valid UTF-8 and `key` holds its
            base64.
        payload:
          description: >-
            The stored bytes: as JSON when they are valid JSON, as a JSON
            string when they are other text, and as base64 otherwise.
        payload_encoding:
          type: string
          enum: [base64]
          description: '`base64` when `payload` holds base64.'
        timestamp:
          type: integer
          format: int64
          description: When the message was stored, in Unix seconds.
        receipt_handle:
          type: string
          description: >-
            Echo it to ack, extend or nack the message. Absent on a
            replay, which leases nothing.

    MessageBatch:
      title: Message batch
      type: object
      x-narad-since: unreleased
      properties:
        messages:
          type: array
          description: >-
            1 to `max` messages, each as a single consume returns it.
          items:
            $ref: '#/components/schemas/Message'

    ProduceBatchRequest:
      type: object
      required: [messages]
      additionalProperties: false
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 100
          description: 1 to 100 messages, stored in this order.
          items:
            type: object
            additionalProperties: false
            required: [payload]
            properties:
              key:
                type: string
                description: As `?key=` on a single produce.
              key_encoding:
                type: string
                enum: [base64]
                description: '`base64` to send a key that is not valid UTF-8.'
              payload:
                description: >-
                  A JSON value, stored exactly as written. A JSON string
                  is stored with its quotes.
              payload_encoding:
                type: string
                enum: [base64]
                description: >-
                  `base64` to send any bytes: `payload` is then a base64
                  string (standard alphabet, padded).
              partition:
                type: integer
                minimum: 0
                description: As `?partition=` on a single produce.

    ProduceBatchAccepted:
      title: Batch produce result
      type: object
      x-narad-since: unreleased
      properties:
        accepted:
          type: integer
          description: How many messages were stored.

    AckBatchRequest:
      type: object
      required: [receipt_handles]
      additionalProperties: false
      x-narad-since: unreleased
      properties:
        receipt_handles:
          type: array
          minItems: 1
          maxItems: 100
          description: 1 to 100 receipt handles from consume answers.
          items:
            type: string

    AckBatchResults:
      title: Batch ack results
      type: object
      x-narad-since: unreleased
      properties:
        results:
          type: array
          description: One result per handle, in request order.
          items:
            type: object
            properties:
              status:
                type: integer
                description: What a single ack of this handle would have answered.
              error:
                type: string
                description: The error, for a status of 300 or more.

    Grant:
      title: Grant
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [produce, consume, create, admin]
          description: >-
            `produce`, `consume`, `create` or `admin`. `consume` covers
            ack. `create` makes the creator the topic's owner. `admin`
            allows everything and takes no patterns.
        patterns:
          type: array
          items:
            type: string
            pattern: '^[A-Za-z0-9._-]{0,255}\*?$'
          description: >-
            Topic names, or prefixes ending in `*` (`orders-*`; `*` alone
            matches every topic). Required for every action but `admin`.

    User:
      title: User
      type: object
      properties:
        username:
          type: string
          description: The username.
        grants:
          type: array
          description: What the user may do; absent when it has none.
          items:
            $ref: '#/components/schemas/Grant'
        root:
          type: boolean
          description: '`true` for the root admin; absent otherwise.'
        created_at_ms:
          type: integer
          format: int64
          description: Unix milliseconds.
        updated_at_ms:
          type: integer
          format: int64
          description: Unix milliseconds.

    CreateUserRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
          description: Not `.` or `..`.
        password:
          type: string
          description: 1 to 72 bytes.
        grants:
          type: array
          description: What the user may do; none when left out.
          items:
            $ref: '#/components/schemas/Grant'

    UpdateGrantsRequest:
      type: object
      additionalProperties: false
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
          description: >-
            The complete new list. An empty or missing list removes every
            grant.

    UpdatePasswordRequest:
      type: object
      required: [new_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
          description: Required when you change your own password and are not an admin.
        new_password:
          type: string
          description: 1 to 72 bytes.

    MemberList:
      title: Member list
      type: object
      properties:
        members:
          type: array
          description: Every member, sorted by id.
          items:
            type: object
            properties:
              id:
                type: string
                description: The member's node id.
              addr:
                type: string
                description: The member's API address.
              status:
                type: string
                enum: [alive, dead]
                description: '`alive` or `dead`.'
              draining:
                type: boolean
                description: '`true` while the member is being drained.'
              owned_partitions:
                type: integer
                description: Partitions the member owns now.
              outbound_moves:
                type: integer
                description: Partitions moving off this member now.

    MoveList:
      title: Move list
      type: object
      properties:
        moves:
          type: array
          description: Every move in progress, sorted by topic and partition.
          items:
            type: object
            properties:
              topic:
                type: string
                description: The topic name.
              partition:
                type: integer
                description: The partition that is moving.
              from:
                type: string
                description: The member that owns the partition now.
              to:
                type: string
                description: The member it is moving to.
