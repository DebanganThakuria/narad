            Cache-Control: no-store
            Content-Type: application/json
            X-Content-Type-Options: nosniff
            Date: Tue, 06 Oct 2026 13:06:22 GMT
            Content-Length: 622

            {"name":"b","id":"8ccffc20e36f644c","url":"https://localhost:8443","username":"repl-from-a-7f3k9q","password":{"fingerprint":"ced1ea5d18d1","set_at":"2026-10-06T13:06:22Z","set_by":"admin","key_version":"b51c9412df29325d"},"credential_version":1,"ca_pem_sha512":"a85bc5f06c550eb18ff2a2a29187fe3a290b1fc74c76d0ef2781531bd4df4f84187980295b5484a6e363a2ff24c52fd9cec309bd74405beb5c815fb48b1e80b0","limits":{"max_in_flight":16,"request_timeout_ms":30000,"idle_conn_timeout_ms":30000,"conn_max_age_ms":300000,"check_interval_ms":60000,"compression":"none"},"revision":1,"created_at":"2026-10-06T13:06:22Z","created_by":"admin"}
    get:
      operationId: listRemotes
      tags: [Remotes]
