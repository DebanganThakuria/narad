    DecommissionReason:
      type: object
      x-narad-since: v3.1.0
      properties:
        code:
          type: string
          enum: [below_min_voters, no_healthy_majority, move_target, dispatch_backlog, node_status_unavailable, no_receivers, owner_dead, move_budget_full, leader_transfer]
          description: The reason, as `narad_decommission_blocked` labels it ([Troubleshooting](../operate/troubleshooting.md#decommission-blocked)).
        message:
          type: string
          description: What it means here and what to do.
    DecommissionRefusal:
      type: object
      x-narad-since: v3.1.0
      properties:
        error:
          type: string
          description: The first reason, in a sentence.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/DecommissionReason'
    DecommissionDryRun:
      type: object
      x-narad-since: v3.1.0
      properties:
        member:
          type: string
          description: Node ID.
        would_decommission:
          type: boolean
          description: '`true` when a decommission would be accepted.'
        reasons:
          type: array
          description: Why it would be refused; empty when it would not.
          items:
            $ref: '#/components/schemas/DecommissionReason'
        voter:
          type: boolean
          description: '`true` when the node is a Raft voter.'
        owned_partitions:
          type: integer
          description: Partitions the node owns, all of which would move off it.
        inbound_moves:
          type: integer
          description: Moves aimed at the node; a decommission clears them.
    MoveList:
      type: object
      properties:
        moves:
          type: array
          items:
            $ref: '#/components/schemas/Move'
    Move:
      type: object
      properties:
        topic:
          type: string
          description: Topic name.
        partition:
          type: integer
          description: Partition number.
        from:
          type: string
          description: Node that owns the partition now.
        to:
          type: string
          description: Node the partition is moving to.
        from_status:
          type: string
          enum: [alive, dead, draining, not_a_member]
          x-narad-since: v3.1.0
          description: The owner's liveness.
        to_status:
          type: string
          enum: [alive, dead, draining, not_a_member]
          x-narad-since: v3.1.0
          description: The destination's liveness.
        blocked:
          type: string
          enum: [source_dead, target_dead, target_not_member]
          x-narad-since: v3.1.0
          description: Why the move cannot progress as things stand. Absent while it can. A dead source finishes only if the destination can force-promote a complete copy; the leader clears a move to a dead destination after two minutes.
        worker:
          $ref: '#/components/schemas/MoveWorker'
        worker_error:
          type: string
          x-narad-since: v3.1.0
          description: With `detail=true`, why the destination's report could not be read.
    MoveAbort:
      type: object
      x-narad-since: v3.1.0
      properties:
        move:
          $ref: '#/components/schemas/Move'
        note:
          type: string
          description: What happens next.
    ForgottenServer:
      type: object
      properties:
        id:
          type: string
          description: The Raft server ID that was removed.
        voter:
          type: boolean
          description: '`true` when it was a voter, `false` for a non-voter.'
    Status:
      type: object
      properties:
        status:
          type: string
          description: '`ok` for `/healthz`, `ready` for `/readyz`.'
    Readiness:
      type: object
      properties:
        status:
          type: string
          description: Always `ready`.
        degraded:
          type: array
          x-narad-since: v3.1.0
          items:
            type: string
            enum: [raft_tls_certificate_expired, raft_tls_ca_expired]
          description: |
            Present only when something is wrong that does not make the
            node unready: `raft_tls_certificate_expired` when the node's
            Raft TLS certificate has expired, `raft_tls_ca_expired` when
            every CA in its Raft CA bundle has. Peers refuse new Raft
            connections until the node restarts with renewed files.
