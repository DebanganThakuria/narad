# Narad HTTP API, OpenAPI 3.1.
#
# Written by hand from internal/transport/httpserver/router.go and the
# request and response types under internal/transport/httpserver/handlers.
# This is the only spec: the docs site publishes it as-is.
# docs/reference/http-api.md is edited by hand alongside this file: a
# change to an operation, field, parameter or status code goes into both
# in the same pull request. The Go contract test
# (internal/transport/httpserver/openapi_contract_test.go) fails when the
# routes in router.go and the operations here disagree, and when a status
# code here is one the handler cannot answer. Examples are pasted from
# real runs, never typed.
#
# Extensions:
#   x-narad-lead      first paragraph of docs/reference/http-api.md
#   x-narad-grant     the grant or role an operation needs
#   x-narad-since     the release that added it ("v3.1.0"), or "unreleased"
#                     for anything merged since the latest release
#   x-narad-examples  curl requests and their real responses
#   x-narad-origin    "forwarding" on a status the cluster router writes
#                     for a request it forwarded to another node
openapi: 3.1.0
info:
  title: Narad HTTP API
  version: v1
  summary: Produce, consume and manage topics on a Narad cluster over HTTP.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  x-narad-lead: |
    Look up every Narad HTTP endpoint: its parameters, request body, the
    grant it needs, the status codes it returns and a real example.
  x-narad-lead-example:
    request: |
      curl -i -u "$AUTH" "$NARAD/v1/topics/orders?partition=1"
    response: |
      HTTP/1.1 200 OK
      Content-Length: 456
      Content-Type: application/json
      Date: Mon, 28 Sep 2026 19:31:43 GMT

      {
        "name": "orders",
        "id": "681a429c0b683b2d",
        "partitions": 3,
        "retention_ms": 172800000,
        "visibility_timeout_ms": 30000,
        "max_in_flight_per_partition": 1024,
        "max_acked_ahead_per_partition": 1024,
        "created_at": 1790623903,
        "owner": "admin",
        "role": "parent",
        "children": ["orders-audit"],
        "schema_version": 0,
        "partition_stats": [
          {
            "index": 1,
            "segments": 1,
            "oldest_offset": 0,
            "next_offset": 2,
            "high_watermark": 2,
            "size_bytes": 166,
            "oldest_segment_at": 1790623903,
            "owner_node": "narad-0"
          }
        ]
      }
  x-narad-placeholders: |
    - `$NARAD` is the base URL of any node or of the load balancer in front
      of the cluster, for example `http://127.0.0.1:7942`.
    - `$AUTH` is `username:password` of a user with the grant the endpoint
      needs. On a node started with `narad server start --dev`, security is
      off and `-u "$AUTH"` can be left out.

    The same API as an OpenAPI 3.1 file:
    [openapi.yaml](openapi.yaml). Every example on this page was run
    against a single node built from `master`. Long JSON bodies are shown
    indented; the node sends each one on a single line, which is what
    `Content-Length` counts.
  description: |
    ### Base URL

    Send requests to any node's API port (`7942` by default) or to the load
    balancer in front of the cluster. Every node serves every route and
    forwards work to the node that owns the partition, so a client never
    needs to know where a partition lives. API routes live under `/v1`;
    `/healthz`, `/readyz` and `/metrics` do not. What a `202` promises, and
    when a message can arrive twice, is in the
    [delivery contract](../understand/delivery-contract.md).

    ### Authentication

    With security on (the default), every `/v1` route needs HTTP Basic
    credentials, and what the user may do is set by its
    [grants](access-model.md). Missing or wrong credentials get
    [`401`](status-codes.md#status-401) with
    `WWW-Authenticate: Basic realm="narad"`. After 5 wrong passwords for an
    existing user, a node answers [`429`](status-codes.md#status-429) for
    that user and allows one more attempt every 12 seconds. `/healthz` and `/readyz` never need
    credentials. Narad expects TLS to end in front of it, at an ingress or a
    load balancer. With security off (`narad server start --dev`), no
    request needs credentials and every grant check passes. How a client
    gets its credentials is in
    [Connect and authenticate](../build/connect.md#credentials).

    ### Required headers

    `POST`, `PUT` and `PATCH` requests must send one of these headers, or
    they get [`415`](status-codes.md#status-415):

    - `Content-Type: application/json`
    - `Content-Type: application/octet-stream`
    - `X-Narad-Client`, with any value

    A `charset` or other parameter on the content type is fine. The rule
    holds for a request with no body too, such as an ack. `GET` and
    `DELETE` are not checked, except a [batch consume](#consume)
    (`max`), which must send `X-Narad-Client` or gets
    [`400`](status-codes.md#status-400), as a `GET` or a `HEAD`. The rule
    stops a web page in a browser from sending state-changing requests
    with an operator's cached credentials.

    ### Limits

    | Limit | Value | Over it |
    |---|---|---|
    | Request body | 1 MiB (1,048,576 bytes) | [`413`](status-codes.md#status-413); `400` on the user and attach-child routes |
    | Batch produce body (v3.2.0) | 16 MiB, each message's payload at most 1 MiB | [`413`](status-codes.md#status-413) |
    | Batch ack body (v3.1.0) | 64 KiB | [`413`](status-codes.md#status-413) |
    | Remotes request body (v3.2.0) | 128 KiB | [`413`](status-codes.md#status-413) |
    | Request headers | 64 KiB by default | [`431`](status-codes.md#status-431) |
    | Messages per batch produce | 1,000 (from v3.2.0; 100 in v3.1.0) | [`400`](status-codes.md#status-400) |
    | Records per batch consume, handles per batch ack (v3.1.0) | 100 | [`400`](status-codes.md#status-400) |
    | Consume `wait` | 10 s by default | clamped, with an `X-Narad-Wait-Clamped` response header |
    | Concurrent consumes per user (or per client IP with security off), per node | 1024 by default | [`429`](status-codes.md#status-429) |
    | Concurrent produces per user, per node (v3.1.0) | off by default | [`429`](status-codes.md#status-429) |
    | Batch produce bodies over 1 MiB being read at once, per node (v3.2.0) | 256 MiB by default | [`503`](status-codes.md#status-503) with `Retry-After: 1` |

    The limits marked "by default" are settings: `http.max_header_bytes`,
    `http.max_consume_wait`, `http.max_consume_in_flight_per_identity`,
    `http.max_produce_in_flight_per_identity` (from v3.1.0) and
    `http.max_batch_body_bytes_in_flight` (from v3.2.0), in that order,
    all in the [Configuration reference](configuration.md#http).

    ### Errors

    An error answer carries a JSON body with one field:

    ```json
    {"error": "topic not found"}
    ```

    A few answers are plain text instead: a route or method the server does
    not know (`404`, `405`), a header block that is too large (`431`), and
    some answers to a request forwarded to another node. Those are `502`,
    `503` when a partition owner is down or the cluster leader cannot be
    reached, and some `500` and `400` answers to a consume.
    Read the status code first and treat the body as a message for people.

    Each endpoint below lists the codes it answers. On top of those, any
    request with credentials can get [`429`](status-codes.md#status-429)
    after too many wrong passwords, and any request can get
    [`500`](status-codes.md#status-500) when the node fails, for example
    `authentication unavailable` when it cannot read its user store.
    [Status codes and errors](status-codes.md) lists every code and
    whether to retry.

    ### Request and response bodies

    Request bodies are strict: a field the endpoint does not know gets
    [`400`](status-codes.md#status-400). Responses can gain fields within
    `/v1`, so ignore fields you do not know
    ([API stability](api-stability.md)). Topic `created_at` and message
    `timestamp` are Unix seconds; user `created_at_ms` and `updated_at_ms`
    are Unix milliseconds.

    ### Pagination

    Only [list topics](#list-topics) pages. Pass `limit` (default 100, at
    most 1000) and the `page_token` from the previous answer, and stop when
    `next_page_token` is empty. A page can hold fewer topics than `limit`,
    or none, while `next_page_token` is still set, because topics you
    cannot read are removed after the page is cut.

    ### Release markers

    This page describes `master`. Anything v3.2.0 added is marked
    **New in v3.2.0**, and what v3.1.0 added is marked
    **New in v3.1.0**. Where an older node answers a request that uses
    it differently, its entry says how. Anything merged since the latest
    release, v3.2.2, is marked **Unreleased** until it ships. See
    [Which release these docs describe](api-stability.md#docs-version).
servers:
  - url: http://127.0.0.1:7942
    description: A local node started with narad server start --dev
security:
  - basicAuth: []
tags:
  - name: Topics
    description: |
      Create, read, change and delete topics. Changes to topics are
      written through the cluster's Raft log, so they need a quorum of
      nodes and answer [`503`](status-codes.md#status-503) while there is
      no leader. Task guide: [Manage topics](../build/topics.md).
  - name: Fan-out children
    description: |
      Link a topic to a parent so that it receives a copy of every message
      produced to the parent from the moment of the link. Task guide:
      [Fan out and delay messages](../build/fanout-and-delay.md).

      **New in v3.2.0:** a child can also be a
      [remote child](glossary.md#remote-child), whose copy goes to a topic
      on another Narad cluster. Its attach, pause, resume and skip need the
      `admin` grant with security on. Task guide:
      [Replicate a topic to another cluster](../build/remote-children.md).
  - name: Messages
    description: |
      Produce, consume and settle messages. Task guides:
      [Produce messages](../build/producing.md),
      [Consume and acknowledge](../build/consuming.md) and
      [Replay messages](../build/replay.md).
  - name: Users
    description: |
      Manage users and their grants. Every route needs the `admin` grant,
      except a user changing their own password. Task guide:
      [Manage users and grants](../operate/users.md).
  - name: Cluster
    description: |
      See cluster members and partition moves, and drain a node before
      removing it. Every route needs the `admin` grant, reads included.
      Task guide: [Scale out and in](../operate/scaling.md).
  - name: Remotes
    description: |
      **New in v3.2.0.** Register the other Narad clusters this one may send
      [remote children](glossary.md#remote-child) to. Every route needs the
      `admin` grant and a node with security on; with security off each
      one answers [`403`](status-codes.md#status-403) (`remotes require
      security`). Answers carry `Cache-Control: no-store`, never contain a
      password, and every request writes one `component=audit` line on the
      node that took it. A write also needs every member to run this
      release ([`412`](status-codes.md#status-412) until then), and a
      create or a password change needs the node to attest an encrypted
      API hop (`remotes.api_hop_encrypted`). Task guide:
      [Manage remotes](../operate/remotes.md).
  - name: Health and metrics
    description: |
      Probes and the Prometheus exposition. Where each is served, and which
      port the Helm chart probes, is in
      [Helm values reference](helm-values.md#ports-and-probes).
paths:
  /v1/topics:
    post:
      operationId: createTopic
      tags: [Topics]
      summary: Create a topic
      description: |
        Creates a topic and, with `parent`, links it as a fan-out child of
        an existing topic in the same call. The caller becomes the topic's
        [owner](glossary.md#owner). A field left out, or sent as `0`, takes
        the server default, except `retention_ms`, where `0` keeps messages
        forever and only leaving it out takes the default.
      x-narad-grant: |
        `create` on the topic name. With `parent`, also ownership of the
        parent or `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopicRequest'
      responses:
        '201':
          description: Created. The body is the new topic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '400':
          description: A field is invalid, the name is not allowed, or the schema cannot be registered (from v3.1.0, that includes a schema whose validation would cost too much).
        '401':
          description: Missing or wrong credentials.
        '403':
          description: No `create` grant on the name, or no right to manage `parent`, as the node that answers or the cluster leader sees it.
        '404':
          description: '`parent` does not exist, also after the answering node caught up with the leader.'
        '409':
          description: The topic exists, a topic exists whose name differs only in letter case (the error names it), `parent` cannot take this child (role, child limit, schema, or a delay the parent's retention cannot hold), or (from v3.1.0) the schema, or the parent's schema history a child adopts, would pass a schema byte budget, or `parent` was recreated under the request twice in a row (`topic changed since it was read`).
        '413':
          description: The body is over 1 MiB.
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '503':
          description: The cluster has no leader to write the topic, the answering node could not reach the leader to confirm `parent`, or (from v3.1.0) every live node is being decommissioned, so no node can take the new partitions; nothing was written.
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X POST "$NARAD/v1/topics" \
              -H "Content-Type: application/json" \
              -d '{"name": "orders", "partitions": 3}'
          response: |
            HTTP/1.1 201 Created
            Content-Length: 224
            Content-Type: application/json
            Date: Mon, 28 Sep 2026 19:31:43 GMT

            {"name":"orders","id":"681a429c0b683b2d","partitions":3,"retention_ms":604800000,"visibility_timeout_ms":30000,"max_in_flight_per_partition":1024,"max_acked_ahead_per_partition":1024,"created_at":1790623903,"owner":"admin"}
    get:
      operationId: listTopics
      tags: [Topics]
      summary: List topics
      description: |
        Lists topics in name order, one page at a time. See
        [Pagination](#pagination).
      x-narad-grant: |
        Any user. The list holds only topics the caller could read with
        [get a topic](#get-topic).
      parameters:
        - name: limit
          in: query
          description: Page size. Values above 1000 are treated as 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: page_token
          in: query
          description: The `next_page_token` of the previous page. Leave it out for the first page.
          schema:
            type: string
      responses:
        '200':
          description: A page of topics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicPage'
        '400':
          description: '`limit` is not a positive integer.'
        '401':
          description: Missing or wrong credentials.
        '500':
          description: The node could not read its topic list.
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" "$NARAD/v1/topics?limit=2"
          response: |
            HTTP/1.1 200 OK
            Content-Length: 540
            Content-Type: application/json
            Date: Mon, 28 Sep 2026 19:31:43 GMT

            {"next_page_token":"orders-audit","topics":[{"name":"orders","id":"681a429c0b683b2d","partitions":3,"retention_ms":604800000,"visibility_timeout_ms":30000,"max_in_flight_per_partition":1024,"max_acked_ahead_per_partition":1024,"created_at":1790623903,"owner":"admin","role":"standalone"},{"name":"orders-audit","id":"91ad229a6dd04bcf","partitions":3,"retention_ms":604800000,"visibility_timeout_ms":30000,"max_in_flight_per_partition":1024,"max_acked_ahead_per_partition":1024,"created_at":1790623903,"owner":"admin","role":"standalone"}]}
  /v1/topics/{topic}:
    parameters:
      - $ref: '#/components/parameters/TopicPath'
    get:
      operationId: getTopic
      tags: [Topics]
      summary: Get a topic
      description: |
        Returns the topic, its current schema and statistics for each
        partition. The node that answers asks every partition's owner for
        its statistics.

        **New in v3.1.0:** when some partitions' owners are down, the answer
        is still `200`. The partitions that could be read carry their
        statistics and `status` `ok`; each other one is a placeholder with
        zero statistics, `status` `owner_unavailable` and the owner's
        `owner_liveness`, and the body carries `partial: true`. Leave the
        placeholders out of any total. An owner that does not answer within
        2 seconds counts as `unreachable`. A v3.0.1 node answers `421`
        instead.

        **New in v3.2.0:** a [remote child](glossary.md#remote-child)'s stub
        has `partitions: 0` and a `remote` object that names the remote and
        the topic there. Its `created_by` and `paused_by` are shown to
        admins only.
      x-narad-grant: |
        Any grant that matches the topic name, ownership, or `admin`.
      parameters:
        - name: partition
          in: query
          description: Return statistics for this partition only.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: The topic with partition statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDetails'
        '400':
          description: '`partition` is not a partition of the topic.'
        '401':
          description: Missing or wrong credentials.
        '403':
          description: No grant on the topic.
        '404':
          description: The topic does not exist.
        '421':
          description: From a v3.0.1 node, the owner of one of the topic's partitions could not be found or refused to answer. An upgraded node answers `200` with `partial` instead.
        '503':
          description: The answering node could not read its own copy of the cluster metadata (for example while it catches up after a restart). Retry.
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" "$NARAD/v1/topics/orders?partition=1"
          response: |
            HTTP/1.1 200 OK
            Content-Length: 470
            Content-Type: application/json
            Date: Mon, 28 Sep 2026 19:31:43 GMT

            {"name":"orders","id":"681a429c0b683b2d","partitions":3,"retention_ms":172800000,"visibility_timeout_ms":30000,"max_in_flight_per_partition":1024,"max_acked_ahead_per_partition":1024,"created_at":1790623903,"owner":"admin","role":"parent","children":["orders-audit"],"schema_version":0,"partition_stats":[{"index":1,"segments":1,"oldest_offset":0,"next_offset":2,"high_watermark":2,"size_bytes":166,"oldest_segment_at":1790623903,"owner_node":"narad-0","status":"ok"}]}
    patch:
      operationId: alterTopic
      tags: [Topics]
      summary: Change a topic
      description: |
        Changes retention, the per-partition caps or the partition count, or
        registers a new schema version. Send at least one field.
        `visibility_timeout_ms` is fixed when the topic is created.

        Fields are applied one group at a time in this order: retention,
        then the caps, then partitions, then schema. There is no
        transaction across them: the first failure answers its error and
        the groups before it stay applied. Send one field per request when
        you need all or nothing.
      x-narad-grant: |
        Ownership of the topic, or `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterTopicRequest'
      responses:
        '200':
          description: Changed. The body is the topic after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '400':
          description: No field given, a value is invalid, `partitions` is not larger than the current count, or the new schema is not compatible.
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not the owner and not `admin`, as the node that answers or the cluster leader sees the topic.
        '404':
          description: The topic does not exist, also after the answering node caught up with the leader.
        '409':
          description: '`schema_base_version` is not the current version, the history holds 1000 versions or (from v3.1.0) the new version would take it past 4 MiB or the cluster''s schemas past 256 MiB, the topic is a child whose schema its parent manages, the new retention is too short for a delay child, or (from v3.1.0) the topic was deleted and recreated, or grew, under the request twice in a row (`topic changed since it was read`). New in v3.2.0: the topic is a remote child''s stub, which takes no change, or the new retention is below 24 hours on a parent with remote children (a retention already below it may still grow).'
        '413':
          description: The body is over 1 MiB.
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '503':
          description: The cluster has no leader to write the change, the answering node could not reach the leader to confirm a topic it does not have, or (from v3.1.0) a partition increase found every live node being decommissioned, so no node can take the new partitions; nothing was changed.
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X PATCH "$NARAD/v1/topics/orders" \
              -H "Content-Type: application/json" \
              -d '{"retention_ms": 172800000}'
          response: |
            HTTP/1.1 200 OK
            Content-Length: 244
            Content-Type: application/json
            Date: Mon, 28 Sep 2026 19:31:43 GMT

            {"name":"orders","id":"681a429c0b683b2d","partitions":3,"retention_ms":172800000,"visibility_timeout_ms":30000,"max_in_flight_per_partition":1024,"max_acked_ahead_per_partition":1024,"created_at":1790623903,"owner":"admin","role":"standalone"}
    delete:
      operationId: deleteTopic
      tags: [Topics]
      summary: Delete a topic
      description: |
        Deletes the topic's metadata and its data on every node, and
        removes its fan-out links. There is no undo. Once the metadata
        delete is committed the answer is `204`, even if a node that is
        down could not remove its files yet; that node removes them when
        it next starts.

        **New in v3.2.0:** deleting a parent that has
        [remote children](glossary.md#remote-child) deletes their stubs in
        the same entry, and deleting a remote child's stub deletes the link.
        Either is refused with `409` while any record of the parent is not
        yet on the remote, unless `force=true` abandons them; the leader
        checks every member's ingress backlog and every cursor first. The
        same refusal, with its body, is in
        [Detach a child](#detach-child).
      x-narad-grant: |
        Ownership of the topic, or `admin`. New in v3.2.0: a remote child's
        stub has no owner; the owner of its parent, or an `admin`, deletes
        it, with security on.
      parameters:
        - name: force
          in: query
          x-narad-since: v3.2.0
          description: |
            `true` deletes a parent with remote children, or a remote
            child's stub, even while records are unshipped, abandoning
            them. Ignored for any other topic. `narad topic rm --force`
            never sends it: there `--force` only skips the prompt.
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Deleted.
        '400':
          description: New in v3.2.0. `force` is not `true` or `false`.
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not the owner and not `admin`, as the node that answers or the cluster leader sees the topic. For a remote child's stub (from v3.2.0), the caller is neither an `admin` nor the parent's owner, or security is off. For a parent with remote children (from v3.2.0), security is off (`remotes require security`).
        '404':
          description: The topic does not exist, also after the answering node caught up with the leader.
        '409':
          description: New in v3.1.0. The topic was deleted and recreated under the request twice in a row (`topic changed since it was read`); nothing was deleted. Read the topic again before deleting it. From v3.2.0, for a parent with remote children or a stub without `force`, records of the parent are not yet on the remote (the body carries `lag_messages`, `lag_complete` and `dispatch_backlog`), or the leader found a remote child the answering node did not know of yet; retry.
        '412':
          description: New in v3.2.0. The cluster leader runs a release without remote children; finish the upgrade.
        '429':
          description: New in v3.2.0. The leader ran an unshipped check for this parent less than 10 seconds ago; retry after `Retry-After`.
          x-narad-origin: forwarding
        '501':
          description: New in v3.2.0. The answering node has no remote plane, so it cannot delete a remote-linked topic.
        '503':
          description: 'The cluster has no leader to write the delete, or the answering node could not reach the leader to confirm a topic it does not have. From v3.2.0, for a remote-linked topic, also when the unshipped check could not run. For a remote-linked topic, when the leader committed the change but the answering node could not confirm that its own copy applied it, `503` with `Retry-After: 2` and an error that says the change is committed: read it back after the delay, or on another node, and do not send it again.'
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X DELETE "$NARAD/v1/topics/orders-audit"
          response: |
            HTTP/1.1 204 No Content
            Date: Mon, 28 Sep 2026 19:31:43 GMT
  /v1/topics/{topic}/schema:
    parameters:
      - $ref: '#/components/parameters/TopicPath'
    get:
      operationId: getSchemaHistory
      tags: [Topics]
      summary: Get a topic's schema history
      description: |
        Returns every schema version of the topic, oldest first, and the
        number of the current one. A topic without a schema has version `0`
        and an empty list. The rules for schemas are in
        [Schema validation rules](schema-rules.md).
      x-narad-grant: |
        Any grant that matches the topic name, ownership, or `admin`.
      responses:
        '200':
          description: The schema history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaHistory'
        '401':
          description: Missing or wrong credentials.
        '403':
          description: No grant on the topic.
        '404':
          description: The topic does not exist.
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" "$NARAD/v1/topics/payments/schema"
          response: |
            HTTP/1.1 200 OK
            Content-Length: 105
            Content-Type: application/json
            Date: Mon, 28 Sep 2026 19:31:43 GMT

            {"topic":"payments","version":1,"versions":[{"version":1,"schema":{"type":"object","required":["id"]}}]}
  /v1/topics/{parent}/children:
    parameters:
      - $ref: '#/components/parameters/ParentPath'
    post:
      operationId: attachChild
      tags: [Fan-out children]
      summary: Attach a child
      description: |
        Links an existing topic as a [fan-out child](glossary.md#fan-out-child)
        of `parent`. The child receives every message produced to the parent
        from the [attach point](glossary.md#attach-point) on; nothing older
        is copied. A child without a schema adopts the parent's schema
        history.

        The delay field here is `delay_ms`. Creating a child in one call
        with [create a topic](#create-topic) takes `fanout_delay_ms`
        instead.

        **New in v3.2.0:** with `remote`, the request creates `child` as a
        [remote child](glossary.md#remote-child) instead: a stub with no
        partitions whose copies go, through the remote's batch produce, to
        `remote_topic` on that cluster. The child must not exist yet. The
        leader runs the attach checks from every member against the target
        (it answers `401` without credentials, the topic exists, is no
        delay child or stub and has no remote children, the schemas match,
        it takes batch produce, the credential is not an admin there),
        resolves the start offsets, and writes one Raft entry. With
        `dry_run` it stops before the entry and answers what it found.
        Without `remotes.allowed_hosts` on the leader, a dry
        run checks from the leader alone, its reports carry only `node`,
        `result`, `class` and this cluster's own `credential_version`,
        `posture` and an empty `warnings` (nothing the target answered: no
        `target_id`, `target_serves_ids`, times or certificate expiry),
        the top-level `warnings` of a dry run or a `201` holds only the
        parent retention warning, a dry run has no `capabilities`,
        and a failed attach or resume answers the
        `class` and the failing `members` instead of each member's report.
        The
        fields `remote_topic`, `from`, `lanes` and `dry_run` without
        `remote` get `400`. Task guide:
        [Replicate a topic to another cluster](../build/remote-children.md).
      x-narad-grant: |
        Ownership of both topics, or `admin`. New in v3.2.0: with `remote`,
        `admin` and a node with security on; ownership is not enough.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachChildRequest'
      responses:
        '200':
          description: 'Attached. The body is the parent topic. From v3.2.0, for a remote `dry_run`: every check passed and nothing was written, and the body is a report instead, with `dry_run`, `attach_offsets` (the start offset per parent partition), `checks` (each member''s report), `warnings` and, when the leader could probe the target and `remotes.allowed_hosts` is set, `capabilities` (`max_messages` per batch and `zstd`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '201':
          description: New in v3.2.0. The remote child was created. The body is its stub, plus `warnings` when there are any (a parent retention below 72 hours; with `remotes.allowed_hosts`, also a target that serves no topic IDs, a target whose batch produce takes at most 1 MiB of body, a certificate that expires within 14 days).
          x-narad-origin: forwarding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '400':
          description: '`child` is missing, the two names are the same, or `delay_ms` is out of range. New in v3.2.0: a remote field without `remote`, a name that is not a remote''s or a topic''s, `lanes` outside 1 to 8, `from` other than `attach`, `unconsumed` or `earliest`, or a remote that does not exist.'
        '401':
          description: Missing or wrong credentials.
        '403':
          description: The caller does not manage both topics, as the node that answers or the cluster leader sees them. From v3.2.0, with `remote`, the caller is not an `admin`, or security is off (`remotes require security`).
        '404':
          description: The parent or the child does not exist, also after the answering node caught up with the leader.
        '409':
          description: 'The link breaks a fan-out rule (a child has one parent and no children), the parent has 108 children, the schemas differ, the delay is longer than the parent''s retention can hold, or (from v3.1.0) the copy of the parent''s schema history the child adopts would pass the cluster''s schema byte budget, or either topic was recreated under the request twice in a row (`topic changed since it was read`). From v3.2.0, with `remote`: a topic named `child` exists, the parent has 16 remote children, this cluster already links to that remote topic, the parent''s retention is below 24 hours, or a check found the target unusable (the body names the `class` and carries each member''s report in `checks`).'
        '412':
          description: 'New in v3.2.0, with `remote`. A member does not apply the remote Raft entry types, did not answer, or reports a posture that forbids remotes (security off or legacy cluster auth on), and the body names it in `members`; a member holds a stale or unreadable credential; the members disagree about the target''s ID; or the leader runs an older release.'
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '429':
          description: New in v3.2.0, with `remote`. This node took 60 remote child writes in the last minute, or a check of this remote ran less than 5 seconds ago on a member; retry after `Retry-After`.
        '501':
          description: New in v3.2.0, with `remote`. The answering node, or the leader, has no remote plane.
        '502':
          description: New in v3.2.0, with `remote`. Something in front of the target answered instead of it (a load balancer or a proxy), or the target answered with a redirect, which is never followed.
          x-narad-origin: forwarding
        '503':
          description: 'No leader, the answering node could not reach the leader to confirm a topic it does not have, or the parent''s partition owners could not be asked for the attach point. Nothing was linked; retry. From v3.2.0, with `remote`, also when the target or a member was unavailable during the checks. With `remote`, when the leader committed the change but the answering node could not confirm that its own copy applied it, `503` with `Retry-After: 2` and an error that says the change is committed: read it back after the delay, or on another node, and do not send it again. For an attach, the body also carries the leader''s `warnings`, which no read shows again.'
      x-narad-examples:
        - title: a local child
          request: |
            curl -i -u "$AUTH" -X POST "$NARAD/v1/topics/orders/children" \
              -H "Content-Type: application/json" \
              -d '{"child": "orders-audit"}'
          response: |
            HTTP/1.1 200 OK
            Content-Length: 268
            Content-Type: application/json
            Date: Mon, 28 Sep 2026 19:31:43 GMT

            {"name":"orders","id":"681a429c0b683b2d","partitions":3,"retention_ms":172800000,"visibility_timeout_ms":30000,"max_in_flight_per_partition":1024,"max_acked_ahead_per_partition":1024,"created_at":1790623903,"owner":"admin","role":"parent","children":["orders-audit"]}
        - title: a remote child, checks only (v3.2.0)
          request: |
            curl -i -u "$AUTH" -X POST "$NARAD/v1/topics/orders/children" \
              -H "Content-Type: application/json" \
              -d '{"child": "orders-to-b", "remote": "b", "remote_topic": "orders",
                   "from": "unconsumed", "dry_run": true}'
          response: |
            HTTP/1.1 200 OK
            Cache-Control: no-store
            Content-Type: application/json
            X-Content-Type-Options: nosniff
            Date: Tue, 06 Oct 2026 13:06:41 GMT
            Content-Length: 435

            {"attach_offsets":[0,0,0],"capabilities":{"max_messages":1000,"zstd":true},"checks":[{"node":"narad-0","result":"pass","credential_version":1,"target_id":"128e63dd156ff568","target_serves_ids":true,"rtt_ms":0,"lane_capacity_per_s":20000,"server_cert_not_after":"2026-11-05T13:04:25Z","warnings":[],"posture":{"security_enabled":true,"legacy_cluster_auth":false,"raft_tls":true,"api_hop_encrypted":true}}],"dry_run":true,"warnings":[]}
        - title: a remote child (v3.2.0)
          request: |
            curl -i -u "$AUTH" -X POST "$NARAD/v1/topics/orders/children" \
              -H "Content-Type: application/json" \
              -d '{"child": "orders-to-b", "remote": "b", "remote_topic": "orders",
                   "from": "unconsumed"}'
          response: |
            HTTP/1.1 201 Created
            Cache-Control: no-store
            Content-Type: application/json
            X-Content-Type-Options: nosniff
            Date: Tue, 06 Oct 2026 13:06:59 GMT
            Content-Length: 408

            {"name":"orders-to-b","id":"d38a4383503cf4ac","partitions":0,"retention_ms":0,"visibility_timeout_ms":0,"max_in_flight_per_partition":0,"max_acked_ahead_per_partition":0,"created_at":1791292019,"role":"child","parent":"orders","attach_epoch":"341e6b8a37a9688a","attach_offsets":[0,0,0],"remote":{"name":"b","topic":"orders","target_id":"128e63dd156ff568","from":"unconsumed","lanes":1,"created_by":"admin"}}
    get:
      operationId: listChildren
      tags: [Fan-out children]
      summary: List a parent's children
      description: |
        Lists the parent's children with their delay and how many messages
        each is behind.

        **New in v3.2.0:** a [remote child](glossary.md#remote-child) also
        carries its link: the remote and the topic there, its state (the
        worst of its partitions'), its recovery point (`lag_seconds`), the
        retention left before drop-behind, the record a cursor is stuck on,
        and when the target was last verified. The listing names the
        remote, never its URL or credential, and a failure as a state,
        never text from the target. The answer also carries `parent_id`,
        which another cluster's remote child reads to notice a recreated
        target. The states are listed in
        [Remotes and remote children](remote-children.md#link-states).
      x-narad-grant: |
        Any grant that matches the parent's name, ownership, or `admin`.
      parameters:
        - name: partitions
          in: query
          x-narad-since: v3.2.0
          description: '`true` adds one row per parent partition to each remote child (`partitions`).'
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The children.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildList'
        '400':
          description: New in v3.2.0. `partitions` is not `true` or `false`.
        '401':
          description: Missing or wrong credentials.
        '403':
          description: No grant on the parent.
        '404':
          description: The parent does not exist.
      x-narad-examples:
        - title: local children
          request: |
            curl -i -u "$AUTH" "$NARAD/v1/topics/orders/children"
          response: |
            HTTP/1.1 200 OK
            Content-Length: 108
            Content-Type: application/json
            Date: Mon, 28 Sep 2026 19:31:43 GMT

            {"parent":"orders","children":[{"name":"orders-audit","delay_ms":0,"lag_messages":0,"lag_complete":false}]}
        - title: a remote child (v3.2.0)
          request: |
            curl -i -u "$AUTH" "$NARAD/v1/topics/orders/children"
          response: |
            HTTP/1.1 200 OK
            Content-Length: 469
            Content-Type: application/json
            Date: Tue, 06 Oct 2026 13:07:03 GMT

            {"parent":"orders","parent_id":"4be76b543f9c4091","children":[{"name":"orders-to-b","delay_ms":0,"lag_messages":0,"lag_complete":true,"remote":{"name":"b","topic":"orders","target_id":"128e63dd156ff568","from":"unconsumed","lanes":1,"created_by":"admin"},"paused":false,"state":"running","lag_seconds":0,"retention_headroom_seconds":259200,"source_drained":false,"blocked_at":null,"target_verified_at":"2026-10-06T13:07:00Z","last_success_at":"2026-10-06T13:07:00Z"}]}
  /v1/topics/{parent}/children/{child}:
    parameters:
      - $ref: '#/components/parameters/ParentPath'
      - name: child
        in: path
        required: true
        description: Name of the child topic.
        schema:
          type: string
    delete:
      operationId: detachChild
      tags: [Fan-out children]
      summary: Detach a child
      description: |
        Removes the link. The child keeps the messages and the schema
        history it already has and becomes a standalone topic again.

        **New in v3.2.0:** detaching a [remote child](glossary.md#remote-child)
        deletes its stub. It travels to the leader, which first checks that
        every record of the parent is on the remote: no cursor lag, every
        partition owner reporting, and no member holding records of the
        parent it answered `202` for and has not committed yet. While any
        is left it answers `409` with the counts, unless `force=true`
        abandons them; the leader's audit line records what a forced delete
        abandoned. The check is a point in time, so stop the producers
        first. A new check for one parent runs at most every 10 seconds.
      x-narad-grant: |
        Ownership of either topic, or `admin`. New in v3.2.0: for a remote
        child, the owner of the parent, or an `admin`, with security on.
      parameters:
        - name: force
          in: query
          x-narad-since: v3.2.0
          description: '`true` deletes a remote child even while records of its parent are unshipped, abandoning them. Ignored for a local child.'
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Detached. For a remote child (from v3.2.0), its stub is deleted.
        '400':
          description: New in v3.2.0. `force` is not `true` or `false`.
        '401':
          description: Missing or wrong credentials.
        '403':
          description: The caller manages neither topic, as the node that answers or the cluster leader sees them. For a remote child (from v3.2.0), the caller is neither an `admin` nor the parent's owner, or security is off.
        '404':
          description: Neither topic exists after the answering node caught up with the leader, or the two are not linked.
        '409':
          description: 'New in v3.1.0. Either topic was deleted and recreated under the request twice in a row (`topic changed since it was read`); nothing was changed. From v3.2.0, for a remote child without `force`: records of the parent are not yet on the remote, with `lag_messages`, `lag_complete` and `dispatch_backlog` (records each member holds, by node) in the body, and `not_answering` or `backlog_over_scan_limit` naming members that could not be counted; or the child turned out to be remote, or local, on the leader; retry.'
        '412':
          description: New in v3.2.0. The cluster leader runs a release without remote children; finish the upgrade.
        '429':
          description: New in v3.2.0. The leader ran an unshipped check for this parent less than 10 seconds ago; retry after `Retry-After`.
          x-narad-origin: forwarding
        '501':
          description: New in v3.2.0. The answering node has no remote plane, so it cannot detach a remote child.
        '503':
          description: 'The cluster has no leader to write the change, or the answering node could not reach the leader to confirm the topics. From v3.2.0, for a remote child, also when the unshipped check could not run. For a remote child, when the leader committed the change but the answering node could not confirm that its own copy applied it, `503` with `Retry-After: 2` and an error that says the change is committed: read it back after the delay, or on another node, and do not send it again.'
      x-narad-examples:
        - title: a local child
          request: |
            curl -i -u "$AUTH" -X DELETE \
              "$NARAD/v1/topics/orders/children/orders-audit"
          response: |
            HTTP/1.1 204 No Content
            Date: Mon, 28 Sep 2026 19:31:43 GMT
        - title: a remote child with records not yet on its remote (v3.2.0)
          request: |
            curl -i -u "$AUTH" -X DELETE \
              "$NARAD/v1/topics/orders/children/orders-to-b"
          response: |
            HTTP/1.1 409 Conflict
            Cache-Control: no-store
            Content-Type: application/json
            X-Content-Type-Options: nosniff
            Date: Tue, 06 Oct 2026 13:07:18 GMT
            Content-Length: 122

            {"dispatch_backlog":{},"error":"remote child \"orders-to-b\" has unshipped records","lag_complete":true,"lag_messages":4}
  /v1/topics/{parent}/children/{child}/pause:
    parameters:
      - $ref: '#/components/parameters/ParentPath'
      - $ref: '#/components/parameters/ChildPath'
    post:
      operationId: pauseRemoteChild
      tags: [Fan-out children]
      summary: Pause a remote child
      x-narad-since: v3.2.0
      description: |
        Stops a [remote child](glossary.md#remote-child) sending. Its
        cursors keep their positions and the parent's retention clock keeps
        running, so a pause longer than the retention headroom loses records
        to drop-behind. The leader checks only that every member applies
        the remote Raft entry types, from the member records, so a pause
        works while a member is down. Pausing a paused child records the new
        reason.
      x-narad-grant: |
        `admin`, with security on.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseRemoteChildRequest'
      responses:
        '200':
          description: Paused. The body is the stub, with `remote.paused`, `pause_reason`, `paused_by` and `paused_at_ms`.
          x-narad-origin: forwarding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '400':
          description: A name is not a topic name, or `reason` is over 256 bytes or holds a control character.
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not an `admin`, or security is off (`remotes require security`).
        '404':
          description: No remote child of that name under that parent.
          x-narad-origin: forwarding
        '409':
          description: The child was detached and attached again under the request; read it and retry.
          x-narad-origin: forwarding
        '412':
          description: A member does not apply the remote Raft entry types (the body names it), or the leader runs an older release.
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '429':
          description: This node took 60 remote child writes in the last minute; retry after `Retry-After`.
        '501':
          description: The answering node has no remote plane.
        '503':
          description: 'The leader could not be reached or could not write the change; retry. A leader that could not be reached answers with `Retry-After: 2`. When the leader committed the change but the answering node could not confirm that its own copy applied it, `503` with `Retry-After: 2` and an error that says the change is committed: read it back after the delay, or on another node, and do not send it again.'
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X POST \
              "$NARAD/v1/topics/orders/children/orders-to-b/pause" \
              -H "Content-Type: application/json" \
              -d '{"reason": "target maintenance, CHG-4211"}'
          response: |
            HTTP/1.1 200 OK
            Cache-Control: no-store
            Content-Type: application/json
            X-Content-Type-Options: nosniff
            Date: Tue, 06 Oct 2026 13:07:15 GMT
            Content-Length: 517

            {"name":"orders-to-b","id":"d38a4383503cf4ac","partitions":0,"retention_ms":0,"visibility_timeout_ms":0,"max_in_flight_per_partition":0,"max_acked_ahead_per_partition":0,"created_at":1791292019,"role":"child","parent":"orders","attach_epoch":"341e6b8a37a9688a","attach_offsets":[0,0,0],"remote":{"name":"b","topic":"orders","target_id":"128e63dd156ff568","from":"unconsumed","lanes":1,"paused":true,"pause_reason":"target maintenance, CHG-4211","paused_by":"admin","paused_at_ms":1791292035849,"created_by":"admin"}}
  /v1/topics/{parent}/children/{child}/resume:
    parameters:
      - $ref: '#/components/parameters/ParentPath'
      - $ref: '#/components/parameters/ChildPath'
    post:
      operationId: resumeRemoteChild
      tags: [Fan-out children]
      summary: Resume a remote child
      x-narad-since: v3.2.0
      description: |
        Runs the attach checks from every member again, then lets a paused
        [remote child](glossary.md#remote-child) send. A target topic that
        was deleted and recreated since the attach (its ID changed) is
        refused with `409` (`target_replaced`) before anything is sent to
        it; `accept_target` records the new ID and resumes. Resuming a
        running child re-runs the checks and changes nothing else. Unlike
        pause, resume needs every member to answer.
      x-narad-grant: |
        `admin`, with security on.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeRemoteChildRequest'
      responses:
        '200':
          description: Resumed. The body is the stub.
          x-narad-origin: forwarding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '400':
          description: A name is not a topic name, or the body is malformed.
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not an `admin`, or security is off (`remotes require security`).
        '404':
          description: No remote child of that name under that parent.
          x-narad-origin: forwarding
        '409':
          description: The remote no longer exists (create it again first), the target topic was replaced (resume with `accept_target`), a check found the target unusable (the body names the `class` and carries each member's report), or the child was detached and attached again under the request.
          x-narad-origin: forwarding
        '412':
          description: A member does not apply the remote Raft entry types, did not answer, or reports a posture that forbids remotes (the body names it); a member holds a stale or unreadable credential; or the leader runs an older release.
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '429':
          description: This node took 60 remote child writes in the last minute, or a check of this remote ran less than 5 seconds ago on a member; retry after `Retry-After`.
        '501':
          description: The answering node has no remote plane.
        '502':
          description: Something in front of the target answered instead of it, or the target answered with a redirect.
          x-narad-origin: forwarding
        '503':
          description: 'The leader could not be reached, or the target or a member was unavailable during the checks; retry. A leader that could not be reached answers with `Retry-After: 2`. When the leader committed the change but the answering node could not confirm that its own copy applied it, `503` with `Retry-After: 2` and an error that says the change is committed: read it back after the delay, or on another node, and do not send it again.'
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X POST \
              "$NARAD/v1/topics/orders/children/orders-to-b/resume" \
              -H "Content-Type: application/json"
          response: |
            HTTP/1.1 200 OK
            Cache-Control: no-store
            Content-Type: application/json
            X-Content-Type-Options: nosniff
            Date: Tue, 06 Oct 2026 13:07:33 GMT
            Content-Length: 423

            {"name":"orders-to-b","id":"d38a4383503cf4ac","partitions":0,"retention_ms":0,"visibility_timeout_ms":0,"max_in_flight_per_partition":0,"max_acked_ahead_per_partition":0,"created_at":1791292019,"role":"child","parent":"orders","attach_epoch":"341e6b8a37a9688a","attach_offsets":[0,0,0],"remote":{"name":"b","topic":"orders","target_id":"128e63dd156ff568","from":"unconsumed","lanes":1,"skip":{"0":[2]},"created_by":"admin"}}
  /v1/topics/{parent}/children/{child}/skip:
    parameters:
      - $ref: '#/components/parameters/ParentPath'
      - $ref: '#/components/parameters/ChildPath'
    post:
      operationId: skipRemoteChildRecord
      tags: [Fan-out children]
      summary: Skip a record a remote child cannot ship
      x-narad-since: v3.2.0
      description: |
        Records that one parent record may be dropped from a
        [remote child](glossary.md#remote-child). The leader asks the
        partition's owner first and accepts the skip only while the
        link's cursor is stuck on exactly that partition and offset in
        `rejected_record` or `record_too_large` (the listing's
        `blocked_at`); any other record is refused with `409`, so a
        mistyped partition or offset is never stored. With several lanes
        stuck, the owner reports the lowest record: skip them in order.
        The record stays in the parent's log for its retention. Each
        dropped record counts on
        `narad_fanout_remote_skipped_records_total` and is logged by the
        node that drops it. The child's `remote.skip` keeps skipped
        offsets per partition, ascending, at most 4000 of them (one
        full slab), always including the one just skipped, so a slab read again (after a
        restart or a partition move) drops each of them again.
      x-narad-grant: |
        `admin`, with security on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkipRemoteRecordRequest'
      responses:
        '200':
          description: Recorded. The body is the stub, with `remote.skip`.
          x-narad-origin: forwarding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '400':
          description: '`partition` or `offset` is missing or negative, `partition` is not a partition of the parent, or a name is not a topic name.'
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not an `admin`, or security is off (`remotes require security`).
        '404':
          description: No remote child of that name under that parent, or the parent is gone.
          x-narad-origin: forwarding
        '409':
          description: The link's cursor of that partition is not stuck on that offset in `rejected_record` or `record_too_large` (the body names the record it is stuck on, as `blocked_at`, if any), or the child was detached and attached again under the request; read it and retry.
          x-narad-origin: forwarding
        '412':
          description: A member does not apply the remote Raft entry types (the body names it), or the leader runs an older release.
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '429':
          description: This node took 60 remote child writes in the last minute; retry after `Retry-After`.
        '501':
          description: The answering node has no remote plane.
        '503':
          description: 'The leader could not be reached, could not ask the partition''s owner, or could not write the change; retry. A leader that could not be reached answers with `Retry-After: 2`. When the leader committed the change but the answering node could not confirm that its own copy applied it, `503` with `Retry-After: 2` and an error that says the change is committed: read it back after the delay, or on another node, and do not send it again.'
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X POST \
              "$NARAD/v1/topics/orders/children/orders-to-b/skip" \
              -H "Content-Type: application/json" \
              -d '{"partition": 0, "offset": 2}'
          response: |
            HTTP/1.1 200 OK
            Cache-Control: no-store
            Content-Type: application/json
            X-Content-Type-Options: nosniff
            Date: Tue, 06 Oct 2026 13:07:33 GMT
            Content-Length: 532

            {"name":"orders-to-b","id":"d38a4383503cf4ac","partitions":0,"retention_ms":0,"visibility_timeout_ms":0,"max_in_flight_per_partition":0,"max_acked_ahead_per_partition":0,"created_at":1791292019,"role":"child","parent":"orders","attach_epoch":"341e6b8a37a9688a","attach_offsets":[0,0,0],"remote":{"name":"b","topic":"orders","target_id":"128e63dd156ff568","from":"unconsumed","lanes":1,"paused":true,"pause_reason":"target maintenance, CHG-4211","paused_by":"admin","paused_at_ms":1791292035849,"skip":{"0":[2]},"created_by":"admin"}}
  /v1/topics/{topic}/produce:
    parameters:
      - $ref: '#/components/parameters/TopicPath'
    post:
      operationId: produce
      tags: [Messages]
      summary: Produce a message
      description: |
        Stores the request body as one message. A
        [`202`](status-codes.md#status-202) means the node that answered has
        written the message to its [ingress WAL](glossary.md#ingress-wal)
        and synced it to disk; it then moves the message to the partition's
        owner in the background. What a `202` promises is in the
        [delivery contract](../understand/delivery-contract.md#what-202-means).

        The body is stored byte for byte. Send JSON with
        `Content-Type: application/json` and anything else with
        `Content-Type: application/octet-stream`. On a topic with a schema,
        the body must be one JSON text that the current schema accepts
        ([Schema validation rules](schema-rules.md#validation)).
      x-narad-grant: |
        `produce` on the topic.
      parameters:
        - name: key
          in: query
          description: |
            Routes the message: messages with the same key go to the same
            partition while the partition count is unchanged and its owner
            is up. This is not an ordering guarantee. Without a key, messages
            are spread round-robin.
          schema:
            type: string
        - name: partition
          in: query
          description: Pins the message to this partition. Wins over `key`.
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        description: The message, 1 byte to 1 MiB.
        content:
          application/json:
            schema: {}
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: Accepted and synced to disk. The body is empty.
        '400':
          description: Empty body, `partition` out of range, `key` or `partition` given twice, or the body fails the topic's schema (from v3.1.0, that includes a body nested deeper than 256 levels).
        '401':
          description: Missing or wrong credentials.
        '403':
          description: No `produce` grant on the topic.
        '404':
          description: The topic does not exist.
        '409':
          description: 'The topic is a delay child, which only its parent can feed. New in v3.2.0: the topic is a remote child''s stub, whose messages live on its remote (`remote child "<name>" lives on remote <remote>; consume it there`).'
        '413':
          description: The body is over 1 MiB.
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '429':
          description: Too many produces in flight for this user on this node, only when the operator set a produce cap ([Configuration reference](configuration.md#http)).
        '500':
          description: The node could not write to its ingress WAL. It answers every produce this way until it restarts.
        '503':
          description: 'New in v3.1.0. Nothing was checked or stored; retry through another node. Either this node is being decommissioned and takes no new produce (with `Retry-After: 1`), or the topic has a schema and every schema validation slot on the node stayed busy for 5 seconds.'
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X POST \
              "$NARAD/v1/topics/orders/produce?key=customer-42" \
              -H "Content-Type: application/json" \
              -d '{"order_id": "ord_123", "amount": 1250}'
          response: |
            HTTP/1.1 202 Accepted
            Date: Mon, 28 Sep 2026 19:31:43 GMT
            Content-Length: 0
  /v1/topics/{topic}/produce/batch:
    parameters:
      - $ref: '#/components/parameters/TopicPath'
    post:
      operationId: produceBatch
      tags: [Messages]
      summary: Produce a batch
      x-narad-since: v3.1.0
      description: |
        Stores 1 to 1,000 messages in one request, all or none (1 to 100
        in v3.1.0). Every message
        is checked as a single produce would check it before any is stored.
        If one fails, the request gets the status a single produce of that
        message would get, its error starts with `message <index>: `, and
        nothing is stored. The `202` comes once every message is synced to
        the ingress WAL, and carries the same promise as a single `202` for
        each of them.

        `key` and `partition` belong to each message; as query parameters
        they get `400`. A node on v3.0.1 or earlier answers `404`: fall back
        to single produces.

        **New in v3.2.0:** the body may be up to 16 MiB, with each message's
        decoded payload at most 1 MiB, the single-produce cap, so anything a
        single produce accepts fits in a batch. It may be sent compressed,
        `Content-Encoding: zstd` or `gzip`, decoded under the same cap. A
        body over 1 MiB first takes its share of the node's batch body
        budget (`http.max_batch_body_bytes_in_flight`, 256 MiB by default)
        and is answered `503` with `Retry-After: 1` when the budget is
        full; bodies of 1 MiB or less never touch it. v3.1.0 answers a
        batch over 100 messages `400` and a body over 1 MiB `413`, and does
        not decode a compressed body. This is the route a
        [remote child](glossary.md#remote-child) sends to.
      x-narad-grant: |
        `produce` on the topic.
      requestBody:
        required: true
        description: At most 16 MiB in total, each payload at most 1 MiB (from v3.2.0; 1 MiB in total in v3.1.0), optionally zstd or gzip compressed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProduceBatchRequest'
      responses:
        '202':
          description: Every message accepted and synced to disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProduceBatchAccepted'
        '400':
          description: No messages, more than 1,000 (more than 100 in v3.1.0), a bad encoding, an empty payload, a message the schema refuses (one nested deeper than 256 levels included), `key` or `partition` in the query, or (from v3.2.0) a compressed body that does not decode.
        '401':
          description: Missing or wrong credentials.
        '403':
          description: No `produce` grant on the topic.
        '404':
          description: The topic does not exist, or the node runs v3.0.1 or earlier.
        '409':
          description: 'The topic is a delay child. New in v3.2.0: the topic is a remote child''s stub, whose messages live on its remote (`remote child "<name>" lives on remote <remote>; consume it there`).'
        '413':
          description: 'The body is over 16 MiB, decoded or as sent (1 MiB in v3.1.0), or (from v3.2.0) one message''s payload is over 1 MiB (`message <i>: message too large`).'
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header, or (from v3.2.0) a `Content-Encoding` other than `zstd`, `gzip` or none.
        '429':
          description: The batch does not fit this user's produce cap on this node (only when the cap is set). A batch counts as its message count, clamped to the cap.
        '500':
          description: The node could not write to its ingress WAL.
        '503':
          description: 'Nothing was checked or stored; retry through another node. Either this node is being decommissioned and takes no new produce (with `Retry-After: 1`), or the topic has a schema and every schema validation slot on the node stayed busy for 5 seconds, or (from v3.2.0) the body is over 1 MiB and the node''s batch body budget is full (with `Retry-After: 1`).'
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X POST "$NARAD/v1/topics/orders/produce/batch" \
              -H "Content-Type: application/json" \
              -d '{"messages": [
                    {"key": "customer-42", "payload": {"order_id": "ord_124"}},
                    {"key": "customer-7", "payload": "aGVsbG8=",
                     "payload_encoding": "base64"}
                  ]}'
          response: |
            HTTP/1.1 202 Accepted
            Content-Length: 15
            Content-Type: application/json
            Date: Mon, 28 Sep 2026 19:31:43 GMT

            {"accepted":2}
  /v1/topics/{topic}/consume:
    parameters:
      - $ref: '#/components/parameters/TopicPath'
    get:
      operationId: consume
      tags: [Messages]
      summary: Consume messages
      description: |
        Without `offset`, takes the next available message and gives the
        caller a [lease](glossary.md#lease) on it for the topic's
        `visibility_timeout_ms`. Settle it with [ack](#ack) before the lease
        runs out, or the message is delivered again. The request can reach
        any node; the node gathers a message from whichever partition owner
        has one.

        With `partition` and `offset`, reads the record at that offset
        without taking a lease: a [replay](../build/replay.md). The answer
        has no `receipt_handle` and nothing needs acking.
      x-narad-grant: |
        `consume` on the topic.
      parameters:
        - name: wait
          in: query
          description: |
            How long to wait for a message before answering `204`, as a Go
            duration such as `500ms` or `10s`. Without it the answer is
            immediate. Values above the server's maximum (10 s by default,
            [Configuration reference](configuration.md#http)) are cut to it,
            and the response then carries `X-Narad-Wait-Clamped` with the
            value used.
          schema:
            type: string
            default: 0s
        - name: partition
          in: query
          description: Take messages from this partition only. Required with `offset`.
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          description: |
            Replay the record at this offset of `partition`. An offset past
            the end of the partition answers `204`; one that aged out of
            retention answers `410`.
          schema:
            type: integer
            minimum: 0
        - name: max
          in: query
          x-narad-since: v3.1.0
          description: |
            Take up to this many messages in one answer,
            `{"messages": [...]}`, each with its own lease. The request does
            not wait to fill `max`. Requires an `X-Narad-Client` header
            ([Required headers](#required-headers)). It counts as `max`,
            clamped to the cap, against the per-user consume cap. Cannot be combined with `offset`. A v3.0.1
            node ignores it and answers with one message in the
            single-message shape.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 'One message, or `{"messages": [...]}` with `max`.'
          headers:
            X-Narad-Wait-Clamped:
              description: Present when `wait` was cut to the server's maximum; the value used.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '204':
          description: No message arrived within `wait`, or `offset` is past the end of the partition.
        '400':
          description: A parameter is invalid, `partition` is out of range, `offset` came without `partition`, `max` came with `offset`, or `max` came without an `X-Narad-Client` header.
        '401':
          description: Missing or wrong credentials.
        '403':
          description: No `consume` grant on the topic.
        '404':
          description: The topic does not exist.
        '409':
          description: 'New in v3.2.0. The topic is a remote child''s stub, whose messages live on its remote (`remote child "<name>" lives on remote <remote>; consume it there`).'
        '410':
          description: Replay only. The record at `offset` aged out of retention or cannot be read.
        '421':
          description: The partition moved to another node while the request was served. Retry.
        '429':
          description: Too many consumes in flight for this user on this node.
        '500':
          description: The node could not read the partition, for example after a disk error.
        '502':
          description: With `partition`, the node forwarded the request to the partition's owner and got no answer.
          x-narad-origin: forwarding
        '503':
          description: With `partition`, the partition's owner is down. Retry after `Retry-After`. Releases up to v3.2.1 sent no `Retry-After`.
          headers:
            Retry-After:
              description: Seconds to wait before retrying, `1`.
              schema:
                type: string
      x-narad-examples:
        - title: one message
          request: |
            curl -i -u "$AUTH" "$NARAD/v1/topics/orders/consume?wait=5s"
          response: |
            HTTP/1.1 200 OK
            Content-Length: 179
            Content-Type: application/json
            Date: Mon, 28 Sep 2026 19:31:43 GMT

            {"topic":"orders","partition":1,"offset":0,"key":"customer-42","payload":{"order_id": "ord_123", "amount": 1250},"timestamp":1790623903,"receipt_handle":"1:0:181499699661178901"}
        - title: a batch (v3.1.0)
          request: |
            curl -i -u "$AUTH" -H 'X-Narad-Client: curl' \
              "$NARAD/v1/topics/orders/consume?max=10&wait=5s"
          response: |
            HTTP/1.1 200 OK
            Content-Length: 326
            Content-Type: application/json
            Date: Mon, 28 Sep 2026 19:31:43 GMT

            {"messages":[{"topic":"orders","partition":1,"offset":1,"key":"customer-42","payload":{"order_id": "ord_124"},"timestamp":1790623903,"receipt_handle":"1:1:6130356697557286029"},{"topic":"orders","partition":0,"offset":0,"key":"customer-7","payload":"hello","timestamp":1790623903,"receipt_handle":"0:0:2681459915124828679"}]}
  /v1/topics/{topic}/ack:
    parameters:
      - $ref: '#/components/parameters/TopicPath'
    post:
      operationId: ack
      tags: [Messages]
      summary: Ack, extend or nack a message
      description: |
        Settles the lease a [receipt handle](glossary.md#receipt-handle)
        names. By default it acks: the message is done and is not delivered
        again. `extend=true` renews the lease for a full
        `visibility_timeout_ms` from now, for a handler that needs longer.
        `extend=0` is a [nack](glossary.md#nack): the lease ends now and the
        message can be delivered again at once. A handle whose lease ran out,
        or that was already settled, gets `410`.

        Without a `receipt_handle` parameter, a JSON body
        `{"receipt_handles": [...]}` settles 1 to 100 handles in one
        request (**v3.1.0**). Each handle is settled on its own with the
        mode `extend` selects, and the answer is `200` with one result per
        handle, in request order. A v3.0.1 node answers such a request `400`.

        The request is a `POST`, so it needs the `Content-Type` or
        `X-Narad-Client` header even without a body.
      x-narad-grant: |
        `consume` on the topic.
      parameters:
        - name: receipt_handle
          in: query
          description: The `receipt_handle` from the consume answer. Required unless the body lists handles.
          schema:
            type: string
        - name: extend
          in: query
          description: |
            Leave it out (or `false`) to ack, `true` or `1` to extend the
            lease, `0` to nack. Any other value gets `400`.
          schema:
            type: string
            enum: ['false', 'true', '1', '0']
      requestBody:
        required: false
        description: Only for a batch ack, at most 64 KiB.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckBatchRequest'
      responses:
        '204':
          description: Settled.
        '200':
          description: A batch ack. One result per handle, each the status a single ack of that handle would have answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckBatchResults'
        '400':
          description: No `receipt_handle`, a handle that cannot be decoded, a bad `extend`, or more than 100 handles.
        '401':
          description: Missing or wrong credentials.
        '403':
          description: No `consume` grant on the topic.
        '404':
          description: The topic does not exist.
        '409':
          description: 'New in v3.2.0. The topic is a remote child''s stub, whose messages live on its remote (`remote child "<name>" lives on remote <remote>; consume it there`).'
        '410':
          description: The lease ran out, or the message was already settled or delivered again under a new handle. A handle from another topic, or for a partition this topic does not have, also answers `410`.
        '413':
          description: A batch body over 64 KiB.
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '421':
          description: The partition moved to another node while the request was served. Retry.
        '502':
          description: The node forwarded the request to the partition's owner and got no answer in time, so the ack may have been applied. Retry; an ack that already landed answers `410` the second time. The plain-text body names neither the owner nor the transport error.
          x-narad-origin: forwarding
        '503':
          description: The partition's owner is down, or the node could not get the forwarded request to the owner in time (no connection, or 2 seconds without a free slot to the owner). Nothing was applied. Retry after `Retry-After`; a `410` on the retry means the lease is gone. Releases up to v3.2.1 answered a forward that never left with `502`, and sent no `Retry-After`.
          headers:
            Retry-After:
              description: Seconds to wait before retrying, `1`.
              schema:
                type: string
          x-narad-origin: forwarding
      x-narad-examples:
        - title: one handle
          request: |
            curl -i -u "$AUTH" -X POST \
              "$NARAD/v1/topics/orders/ack?receipt_handle=1:0:181499699661178901" \
              -H "Content-Type: application/json"
          response: |
            HTTP/1.1 204 No Content
            Date: Mon, 28 Sep 2026 19:31:43 GMT
        - title: a batch (v3.1.0)
          request: |
            curl -i -u "$AUTH" -X POST "$NARAD/v1/topics/orders/ack" \
              -H "Content-Type: application/json" \
              -d '{"receipt_handles": [
                    "1:1:6130356697557286029",
                    "0:0:2681459915124828679",
                    "0:0:1"
                  ]}'
          response: |
            HTTP/1.1 200 OK
            Content-Length: 124
            Content-Type: application/json
            Date: Mon, 28 Sep 2026 19:31:43 GMT

            {"results":[{"status":204},{"status":204},{"status":410,"error":"receipt handle no longer matches an active reservation"}]}
  /v1/users:
