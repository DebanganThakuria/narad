    MoveWorker:
      type: object
      x-narad-since: v3.1.0
      description: A destination's own report of one move.
      properties:
        topic:
          type: string
          description: Topic name.
        partition:
          type: integer
          description: Partition number.
        source:
          type: string
          description: The node the copy comes from.
        target:
          type: string
          description: This node.
        started_at:
          type: string
          description: When the worker started, RFC 3339.
        phase:
          type: string
          enum: [copying, frozen, flip_pending, waiting_for_source, blocked]
