      x-narad-since: v3.2.0
      description: |
        Changes the fields named and nothing else. A new `url`, `username`
        or `ca_pem` needs `password` in the same request: a stored password
        is only ever sent to the URL and user it was entered with, verified
        against the CA it was entered with. `ca_pem: ""` drops the CA and
        uses the system roots. A new password is sealed on this node, as on
        a create, and the links pick it up without a restart. `limits`
        change live; a limit named with `0` or `""` is refused.
      x-narad-grant: |
        `admin`, with security on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRemoteRequest'
      responses:
        '200':
          description: Changed. The body is the remote.
          x-narad-origin: forwarding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Remote'
        '400':
          description: A field is unknown or invalid, nothing to change, or a new `url`, `username` or `ca_pem` came without `password`.
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not an `admin`, or security is off (`remotes require security`).
        '404':
          description: No remote of that name.
        '409':
          description: The remote changed since this node read it (retry), or it was created again under the same name.
          x-narad-origin: forwarding
        '412':
          description: As for [register a remote](#create-remote); the hop and secret rules apply only to a change that carries a password.
        '413':
          description: The body is over 128 KiB.
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '429':
          description: 'This node took 10 remote writes in the last minute; retry after `Retry-After`, the seconds until the oldest of them leaves the minute.'
        '500':
          description: The node failed to seal the password; logged on the node.
        '501':
          description: The answering node has no remote plane.
        '503':
          description: 'The leader could not be reached, or could not write the change. Read the remote back before retrying. A leader that could not be reached answers with `Retry-After: 2`. When the leader committed the change but the answering node could not confirm that its own copy applied it, `503` with `Retry-After: 2` and an error that says the change is committed: read it back after the delay, or on another node, and do not send it again.'
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X PATCH "$NARAD/v1/remotes/b" \
              -H "Content-Type: application/json" \
              -d '{"limits": {"max_in_flight": 32, "compression": "zstd"}}'
          response: |
            HTTP/1.1 200 OK
            Cache-Control: no-store
            Content-Type: application/json
            X-Content-Type-Options: nosniff
            Date: Tue, 06 Oct 2026 13:06:32 GMT
            Content-Length: 622

            {"name":"b","id":"8ccffc20e36f644c","url":"https://localhost:8443","username":"repl-from-a-7f3k9q","password":{"fingerprint":"ced1ea5d18d1","set_at":"2026-10-06T13:06:22Z","set_by":"admin","key_version":"b51c9412df29325d"},"credential_version":1,"ca_pem_sha512":"a85bc5f06c550eb18ff2a2a29187fe3a290b1fc74c76d0ef2781531bd4df4f84187980295b5484a6e363a2ff24c52fd9cec309bd74405beb5c815fb48b1e80b0","limits":{"max_in_flight":32,"request_timeout_ms":30000,"idle_conn_timeout_ms":30000,"conn_max_age_ms":300000,"check_interval_ms":60000,"compression":"zstd"},"revision":2,"created_at":"2026-10-06T13:06:22Z","created_by":"admin"}
    delete:
      operationId: deleteRemote
      tags: [Remotes]
      summary: Delete a remote
      x-narad-since: v3.2.0
      description: |
        Deletes the remote and its stored password. Refused while remote
        children name it, unless `force=true`: they then hold, without
        loss while the parent's retention lasts, in state
        `remote_missing` until a remote of that name exists again. Each
        member drops its cached credential and closes its connections when
        it applies the delete; [list remotes](#list-remotes) shows the
        members that have not under `lingering`. The leader checks only
        the member records, so a delete works while a member is down. In
        an emergency, revoke the user on the target first
        ([Manage remotes](../operate/remotes.md#emergency-revocation)).
      x-narad-grant: |
        `admin`, with security on.
      parameters:
        - name: force
          in: query
          description: '`true` deletes the remote even while remote children use it.'
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Deleted.
          x-narad-origin: forwarding
        '400':
          description: '`name` is not a remote''s name, or `force` is not `true` or `false`.'
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not an `admin`, or security is off (`remotes require security`).
        '404':
          description: No remote of that name.
          x-narad-origin: forwarding
        '409':
          description: Remote children use the remote; the body lists them in `links`.
          x-narad-origin: forwarding
        '412':
          description: A member does not apply the remote Raft entry types (the body names it), or the leader runs an older release.
        '429':
          description: 'This node took 10 remote writes in the last minute; retry after `Retry-After`, the seconds until the oldest of them leaves the minute.'
        '501':
          description: The answering node has no remote plane.
        '503':
          description: 'The leader could not be reached, or could not write the change. Read the remotes back before retrying. A leader that could not be reached answers with `Retry-After: 2`. When the leader committed the change but the answering node could not confirm that its own copy applied it, `503` with `Retry-After: 2` and an error that says the change is committed: read it back after the delay, or on another node, and do not send it again.'
      x-narad-examples:
        - title: in use
          request: |
            curl -i -u "$AUTH" -X DELETE "$NARAD/v1/remotes/b"
          response: |
            HTTP/1.1 409 Conflict
            Cache-Control: no-store
            Content-Type: application/json
            X-Content-Type-Options: nosniff
            Date: Tue, 06 Oct 2026 13:07:49 GMT
            Content-Length: 79

            {"error":"remote is used by 1 remote children","links":["orders/orders-to-b"]}
        - title: once no remote child uses it
          request: |
            curl -i -u "$AUTH" -X DELETE "$NARAD/v1/remotes/b"
          response: |
            HTTP/1.1 204 No Content
            Cache-Control: no-store
            Date: Tue, 06 Oct 2026 13:07:49 GMT
  /v1/remotes/{name}/test:
    parameters:
      - $ref: '#/components/parameters/RemoteNamePath'
    post:
      operationId: testRemote
      tags: [Remotes]
      summary: Test a remote
      x-narad-since: v3.2.0
      description: |
        Runs the attach checks against `topic` on the remote, writing
        nothing on either cluster: the dial passes the address guard, TLS
        verifies against the remote's CA (or the system roots), the target
        answers `401` without credentials, the topic exists and is no delay
        child or remote child stub, its children include no remote child,
        the schemas match (with `source`), an empty batch produce is
        answered as a target that takes batch produce answers it, and the
        credential is not an admin there. With `remotes.allowed_hosts` set,
        every member runs the checks and reports the connect time
        (`rtt_ms`) and an estimate of one lane's capacity; without it only
        this node runs them, and its report carries only `node`, `result`,
        `class` and this cluster's own fields: no time, no target ID, no
        `target_serves_ids`, no certificate expiry, no warnings drawn from
        the target's answers.

        The answer is `200` whether or not the checks pass: read `result`.
        `narad remote test` exits non-zero unless it is `pass`.
      x-narad-grant: |
        `admin`, with security on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestRemoteRequest'
      responses:
        '200':
          description: The checks ran. `result` is `pass` only when every member passed at the remote's current credential version; otherwise `class` names the most important failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteTestResult'
        '400':
          description: '`topic` is missing or not a topic name, or `source` is not one.'
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not an `admin`, or security is off (`remotes require security`).
        '404':
          description: No remote of that name, or no `source` topic of that name.
        '413':
          description: The body is over 128 KiB.
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '429':
          description: A check of this remote ran less than 5 seconds ago on this node (or, with an allowlist, on a member); retry after `Retry-After`.
        '501':
          description: The answering node has no remote plane.
        '503':
          description: The cluster's members could not be listed; retry.
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X POST "$NARAD/v1/remotes/b/test" \
              -H "Content-Type: application/json" \
              -d '{"topic": "orders", "source": "orders"}'
          response: |
            HTTP/1.1 200 OK
            Cache-Control: no-store
            Content-Length: 361
            Content-Type: application/json
            Date: Tue, 06 Oct 2026 13:06:32 GMT

            {"remote":"b","result":"pass","checks":[{"node":"narad-0","result":"pass","credential_version":1,"target_id":"128e63dd156ff568","target_serves_ids":true,"rtt_ms":0,"lane_capacity_per_s":20000,"server_cert_not_after":"2026-11-05T13:04:25Z","warnings":[],"posture":{"security_enabled":true,"legacy_cluster_auth":false,"raft_tls":true,"api_hop_encrypted":true}}]}
  /v1/cluster/reencrypt-remotes:
    post:
      operationId: reencryptRemotes
      tags: [Remotes]
      summary: Re-encrypt remote passwords
      x-narad-since: v3.2.0
      description: |
        After a cluster secret rotation, re-seals every stored remote
        password that is still under the previous key: the leader opens it
        with `NARAD_CLUSTER_SECRET_PREVIOUS` and seals it under the current
        secret, bound to the same remote, URL, username and CA. A remote
        changed in between keeps its newer ciphertext. Safe to repeat.
        Steps: [Rotate the cluster secret](../operate/remotes.md#rotate-cluster-secret).
      x-narad-grant: |
        `admin`, with security on.
      requestBody:
        required: false
        description: Empty, or `{}`.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: 'Done. `reencrypted` names the remotes moved to the current key, `already_current` the ones that were, and `failed` the ones the leader could not open (`key_unknown`: sealed under a key neither secret derives, as when `NARAD_CLUSTER_SECRET_PREVIOUS` is not set on the leader; `open_failed`) or write, each with a `reason`.'
          x-narad-origin: forwarding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReencryptResult'
        '400':
          description: The body is not empty or `{}`.
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not an `admin`, or security is off (`remotes require security`).
        '412':
          description: The leader's cluster secret is missing or decodes to fewer than 32 bytes, a member does not apply the remote Raft entry types, did not answer, or reports a posture that forbids remotes (the body names it in `members`), or the leader runs an older release. Nothing was re-sealed.
        '413':
          description: The body is over 128 KiB.
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '429':
          description: 'This node took 10 remote writes in the last minute; retry after `Retry-After`, the seconds until the oldest of them leaves the minute.'
        '501':
          description: The answering node has no remote plane.
        '503':
          description: 'The leader could not be reached; it is safe to repeat. A leader that could not be reached answers with `Retry-After: 2`. When the leader committed the change but the answering node could not confirm that its own copy applied it, `503` with `Retry-After: 2` and an error that says the change is committed: read it back after the delay, or on another node, and do not send it again.'
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X POST "$NARAD/v1/cluster/reencrypt-remotes" \
              -H "Content-Type: application/json"
          response: |
            HTTP/1.1 200 OK
            Cache-Control: no-store
            Content-Type: application/json
            X-Content-Type-Options: nosniff
            Date: Tue, 06 Oct 2026 13:07:49 GMT
            Content-Length: 88

            {"key_version":"b51c9412df29325d","reencrypted":[],"already_current":["b"],"failed":[]}
  /healthz:
    get:
      operationId: healthz
      tags: [Health and metrics]
      summary: Check liveness
      security: []
      description: |
        Answers `200` while the process runs, from the moment it starts,
        and `503` once a graceful shutdown has begun. It never needs
        credentials. It is also served on the metrics listener when
        `http.metrics_addr` is set.
      x-narad-grant: |
        None.
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: The node is shutting down.
      x-narad-examples:
        - request: |
            curl -i "$NARAD/healthz"
          response: |
            HTTP/1.1 200 OK
            Content-Length: 16
            Content-Type: application/json
            Date: Mon, 28 Sep 2026 19:31:44 GMT

            {"status":"ok"}
  /readyz:
    get:
      operationId: readyz
      tags: [Health and metrics]
      summary: Check readiness
      security: []
      description: |
        Answers `200` only while the node should receive traffic: its
        startup work is done, it has a Raft leader in view that it heard
        from within the last 5 seconds (or it is the leader), and its copy
        of the cluster metadata has caught up with the leader since it
        started. Otherwise it answers `503` with the reason in `error`.
        The check runs on every request. It never needs credentials.

        A `200` can list conditions under `degraded` (from v3.1.0): an
        expired Raft TLS certificate or CA bundle. They do not make the
        node unready, because one certificate usually serves every node
        and expires on all of them at once, and failing readiness would
        take every pod out of its Services. See
        [Raft TLS certificates](../operate/raft-tls.md#expiry).
      x-narad-grant: |
        None.
      responses:
        '200':
          description: Ready for traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Not ready. The `error` field says why.
      x-narad-examples:
        - request: |
            curl -i "$NARAD/readyz"
          response: |
            HTTP/1.1 200 OK
            Content-Length: 19
            Content-Type: application/json
            Date: Mon, 28 Sep 2026 19:31:44 GMT

            {"status":"ready"}
  /metrics:
    get:
      operationId: metrics
      tags: [Health and metrics]
      summary: Scrape metrics
      description: |
        The Prometheus text exposition; every series is in the
        [Metrics reference](metrics.md). Where it is served depends on
        `http.metrics_addr`:

        - Not set (the binary's default): on the API port, and it needs
          the same credentials as the API unless
          `http.metrics_unauthenticated` is `true`.
        - Set (the Helm chart sets `:9100`): on that listener without
          credentials, and not on the API port, where a request gets
          `404` (or `401` without credentials).
      x-narad-grant: |
        Any valid credentials on the API port; none on the metrics
        listener.
      responses:
        '200':
          description: The exposition.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or wrong credentials on the API port.
      x-narad-examples:
        - request: |
            curl -sS -u "$AUTH" "$NARAD/metrics" | grep '^narad_topics_total'
          response: |
            narad_topics_total 2
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  parameters:
    TopicPath:
      name: topic
      in: path
      required: true
      description: Name of the topic.
      schema:
        type: string
    ParentPath:
      name: parent
      in: path
      required: true
      description: Name of the parent topic.
      schema:
        type: string
    ChildPath:
      name: child
      in: path
      required: true
      description: Name of the child topic.
      schema:
        type: string
    RemoteNamePath:
      name: name
      in: path
      required: true
      description: The remote's name.
      schema:
        type: string
    UsernamePath:
      name: username
      in: path
      required: true
      description: The username.
      schema:
        type: string
  schemas:
    CreateTopicRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 200
          description: |
            1 to 200 characters from `A-Z a-z 0-9 . _ -`, not `.` or `..`,
            and not differing from an existing topic's name only in letter
            case (`409`). Topics an earlier release created with names up to
            255 characters keep working.
        partitions:
          type: integer
          minimum: 3
          description: |
            At least 3 and at most the server's maximum (108 by default).
            Defaults to the server default (3), or to the parent's count
            when `parent` is set. It can grow later, never shrink. Both
            server settings are in the
            [Configuration reference](configuration.md#topic-defaults).
        retention_ms:
          type: integer
          description: |
            How long a message is kept after it is written, whether or not
            it was consumed. At least 3,600,000 (1 hour), or `0` to keep
            messages forever; a negative value gets `400`. Left out, it
            takes the server default
            ([Configuration reference](configuration.md#topic-defaults)):
            7 days in the binary, 12 hours in the Helm chart.
        visibility_timeout_ms:
          type: integer
          default: 30000
          description: How long a consumer's lease lasts before the message is delivered again. Defaults to the server default ([Configuration reference](configuration.md#topic-defaults)). Fixed after creation.
        max_in_flight_per_partition:
          type: integer
          default: 1024
          description: Most messages of one partition leased at once. At the cap, consumes find nothing new in that partition until a lease ends. Defaults to the server default ([Configuration reference](configuration.md#topic-defaults)).
        max_acked_ahead_per_partition:
          type: integer
          default: 1024
          description: |
            Most acks one partition holds above its oldest unacked message.
            At the cap the partition delivers no new messages until that
            message is acked. Defaults to the server default
            ([Configuration reference](configuration.md#topic-defaults)).
        schema:
          description: A JSON Schema every message must match; registered as version 1. A JSON object or `true`.
        parent:
          type: string
          description: |
            Create the topic as a fan-out child of this existing topic. Its
            partitions are placed on other nodes than the parent's where the
            cluster allows, which is what makes a
            [replica child](../operate/backups.md#replica-children).
        fanout_delay_ms:
          type: integer
          description: |
            With `parent`, make the topic a delay child that receives each
            message this long after the parent committed it. At most
            31,536,000,000 (one year). Attaching an existing topic takes
            `delay_ms` instead.
        owner:
          type: string
          description: Ignored. The server sets the owner to the caller.
    AlterTopicRequest:
      type: object
      additionalProperties: false
      properties:
        retention_ms:
          type: integer
          description: New retention. At least 3,600,000 (1 hour), or `0` to keep messages forever; a negative value gets `400`. To return to the server default, send its value.
        max_in_flight_per_partition:
          type: integer
          description: New in-flight cap; `0` sets the server default. A cap left out keeps its value.
        max_acked_ahead_per_partition:
          type: integer
          description: New acked-ahead cap; `0` sets the server default. A cap left out keeps its value.
        partitions:
          type: integer
          description: New partition count, larger than the current one and at most the server's maximum (108 by default). New keys may then map to other partitions.
        schema:
          description: |
            A new schema version, checked for compatibility with the current
            one. Sending the current schema again changes nothing and
            answers `200`. A schema cannot be removed (`null` gets `400`).
        schema_base_version:
          type: integer
          description: With `schema`, apply it only if the current version is exactly this number; `409` otherwise.
    Topic:
      type: object
      properties:
        name:
          type: string
          description: Topic name.
        id:
          type: string
          description: The [incarnation](glossary.md#incarnation) ID, 16 hex characters. A topic deleted and created again under the same name gets a new one. Absent on a topic created before v2.2.0.
        partitions:
          type: integer
          description: Partition count.
        retention_ms:
          type: integer
          description: Retention in milliseconds; `0` keeps messages forever.
        visibility_timeout_ms:
          type: integer
          description: Lease length in milliseconds.
        max_in_flight_per_partition:
          type: integer
          description: In-flight cap per partition.
        max_acked_ahead_per_partition:
          type: integer
          description: Acked-ahead cap per partition.
        created_at:
          type: integer
          description: Creation time, Unix seconds.
        owner:
          type: string
          description: The user that created the topic. Absent when security was off.
        role:
          type: string
          enum: [standalone, parent, child]
          description: Fan-out role. Absent in the answer to a create without `parent`, which means `standalone`.
        children:
          type: array
          items:
            type: string
          description: A parent's children, in attach order.
        parent:
          type: string
          description: A child's parent.
        attach_epoch:
          type: string
          description: A child's current attachment; it changes on every attach.
        fanout_delay_ms:
          type: integer
          description: A delay child's delay in milliseconds.
        attach_offsets:
          type: array
          items:
            type: integer
          description: A child's attach point, one offset per parent partition.
        remote:
          $ref: '#/components/schemas/RemoteLink'
    RemoteLink:
      type: object
      x-narad-since: v3.2.0
      description: A [remote child](glossary.md#remote-child)'s link. Present only on a remote child's stub, which has `partitions` `0` and no owner.
      properties:
        name:
          type: string
          description: The remote the copies go to.
        topic:
          type: string
          description: The topic on the remote.
        target_id:
          type: string
          description: The target topic's ID as the attach, or the last resume with `accept_target`, saw it. A target on v3.1.0 serves it in its describe answer, so recreate detection works there too. Empty for a target topic created before topic IDs (v2.1 and earlier); such a link stops in `target_replaced` if the target later reports an ID, because a topic gains one only by being recreated.
        from:
          type: string
          enum: [attach, unconsumed, earliest]
          description: Where the link started on each parent partition.
        lanes:
          type: integer
          description: Ordered streams per parent partition, 1 to 8.
        paused:
          type: boolean
          description: '`true` while paused. Absent otherwise.'
        pause_reason:
          type: string
          description: The reason given to pause.
        paused_by:
          type: string
          description: The admin who paused it; shown to admins only.
        paused_at_ms:
          type: integer
          description: When it was paused, Unix milliseconds.
        skip:
          type: object
          additionalProperties:
            type: array
            items:
              type: integer
          description: Per parent partition, the offsets an admin accepted to lose, ascending, at most 4000. A cursor drops a record only while it is stuck on exactly one of them.
        created_by:
          type: string
          description: The admin who attached it; shown to admins only.
    TopicDetails:
      allOf:
        - $ref: '#/components/schemas/Topic'
        - type: object
          properties:
            schema_version:
              type: integer
              description: Current schema version, `0` without a schema.
            schema:
              description: The current schema document. Absent without a schema.
            partition_stats:
              type: array
              description: One entry per partition, or only the one `partition` asked for.
              items:
                $ref: '#/components/schemas/PartitionStats'
            partial:
              type: boolean
              x-narad-since: v3.1.0
              description: '`true` when some entries are placeholders whose owner could not report (`status` `owner_unavailable`). Absent otherwise.'
    PartitionStats:
      type: object
      properties:
        index:
          type: integer
          description: Partition number.
        segments:
          type: integer
          description: Segment files on disk.
        oldest_offset:
          type: integer
          description: Lowest offset still kept.
        next_offset:
          type: integer
          description: Offset the next record will get. It can lead `high_watermark` while a commit runs.
        high_watermark:
          type: integer
          description: One past the last offset consumers can see.
        size_bytes:
          type: integer
          description: Bytes on disk.
        oldest_segment_at:
          type: integer
          description: Time of the oldest segment, Unix seconds. Absent when unknown.
        owner_node:
          type: string
          description: ID of the node that owns the partition.
        status:
          type: string
          enum: [ok, owner_unavailable]
          x-narad-since: v3.1.0
          description: '`ok` when the statistics are the owner''s; `owner_unavailable` for a placeholder with zero statistics, because the owner could not report them. Never add a placeholder''s numbers to a total.'
        owner_liveness:
          type: string
          enum: [dead, unreachable, unknown, unassigned]
          x-narad-since: v3.1.0
          description: 'Why an `owner_unavailable` partition''s owner could not report: `dead` (marked dead), `unreachable` (alive, but its statistics did not come back within 2 seconds), `unknown` (no member with an address), `unassigned` (no owner yet). Absent for `ok`.'
    TopicPage:
      type: object
      properties:
        topics:
          type: array
          description: Topics the caller can read.
          items:
            $ref: '#/components/schemas/Topic'
        next_page_token:
          type: string
          description: Pass as `page_token` for the next page; empty when there are no more.
    SchemaHistory:
      type: object
      properties:
        topic:
          type: string
          description: Topic name.
        version:
          type: integer
          description: Current version, `0` without a schema.
        versions:
          type: array
          description: Every version, oldest first.
          items:
            type: object
            properties:
              version:
                type: integer
                description: Version number, from 1.
              schema:
                description: The schema document.
    AttachChildRequest:
      type: object
      required: [child]
      additionalProperties: false
      properties:
        child:
          type: string
          description: Name of the existing topic to attach.
        delay_ms:
          type: integer
          description: Make the child a delay child that receives each message this long after the parent committed it. At most one year. Fixed while attached.
        remote:
          type: string
          x-narad-since: v3.2.0
          description: Create `child` as a remote child that sends to this remote. `child` must not exist yet.
        remote_topic:
          type: string
          x-narad-since: v3.2.0
          description: With `remote`, the topic on the remote. Defaults to the parent's name.
        from:
          type: string
          enum: [attach, unconsumed, earliest]
          default: attach
          x-narad-since: v3.2.0
          description: With `remote`, where the link starts on each parent partition. `attach` at the parent's committed high watermark, as a local child; `unconsumed` at the parent's consumer ack frontier, so everything not yet acked here is sent; `earliest` at the oldest retained record.
        lanes:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
          x-narad-since: v3.2.0
          description: With `remote`, ordered streams per parent partition. A key always uses one lane; more lanes help a link with a long round trip.
        dry_run:
          type: boolean
          default: false
          x-narad-since: v3.2.0
          description: With `remote`, run every check and resolve the start offsets, and write nothing.
    ChildList:
      type: object
      properties:
        parent:
          type: string
          description: Parent topic name.
        parent_id:
          type: string
          x-narad-since: v3.2.0
          description: The parent's incarnation ID, empty for a topic created before topic IDs (v2.1 and earlier). A remote child on another cluster that sends to this topic reads it to notice a recreate.
        children:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Child topic name.
              delay_ms:
                type: integer
                description: The child's delay, `0` for an immediate child.
              lag_messages:
                type: integer
                description: Parent messages not yet copied into the child, summed over partitions. For a remote child, not yet accepted by the remote.
              lag_complete:
                type: boolean
                description: '`false` while some partitions have not reported, so `lag_messages` is a lower bound.'
              remote:
                $ref: '#/components/schemas/RemoteLink'
              paused:
                type: boolean
                x-narad-since: v3.2.0
                description: A remote child only. `true` while it is paused.
              state:
                type: string
                x-narad-since: v3.2.0
                description: A remote child only. Its worst partition's [link state](remote-children.md#link-states), `running` or `paused` when healthy; `unknown` when a partition owner did not report, or when its owner is still stuck on a record this node shows as skipped. `running` and `paused` follow the pause flag as the node answering has applied it, so a read straight after a pause or resume agrees with it even while an owner has not caught up.
              lag_seconds:
                type: number
                x-narad-since: v3.2.0
                description: 'A remote child only. Age, on the owners'' clocks, of the oldest parent record not yet accepted by the remote, the worst partition''s: the link''s live recovery point.'
              retention_headroom_seconds:
                type: number
                x-narad-since: v3.2.0
                description: A remote child only. The parent's retention minus `lag_seconds`, the time left before drop-behind. Absent when the parent keeps messages forever.
              source_drained:
                type: boolean
                x-narad-since: v3.2.0
                description: A remote child only. `true` once the parent's consumers have acked past the link's start offset on every partition.
              blocked_at:
                type: object
                x-narad-since: v3.2.0
                description: A remote child only. The one record a cursor is stuck on, as `partition`, `offset` and `state` (`rejected_record` or `record_too_large`); `null` when none is.
              target_verified_at:
                type: string
                x-narad-since: v3.2.0
                description: A remote child only. The oldest of the cursors' last successful target checks, RFC 3339; `null` while any cursor has had none (a node whose checks keep failing is not hidden behind another node's success).
              unverified:
                type: boolean
                x-narad-since: v3.2.0
                description: A remote child only. `true` for a running link with a cursor whose node has had no successful target check in the last 10 minutes (counted from when the node began checking, for a cursor that never had one).
              last_success_at:
                type: string
                x-narad-since: v3.2.0
                description: A remote child only. When the remote last accepted a chunk, RFC 3339.
              partitions:
                type: array
                x-narad-since: v3.2.0
                description: A remote child only, with `partitions=true`. One row per parent partition.
                items:
                  type: object
                  properties:
                    partition:
                      type: integer
                      description: Parent partition.
                    node:
                      type: string
                      description: The owner that reported the cursor.
                    start_offset:
                      type: integer
                      description: Where the link started on this partition.
                    next_offset:
                      type: integer
                      description: The cursor's next offset; `null` when the owner did not report.
                    high_watermark:
                      type: integer
                      description: The partition's high watermark; `null` when the owner did not report.
                    ack_frontier:
                      type: integer
                      description: The parent's consumer ack frontier on this partition; `null` when unknown.
                    state:
                      type: string
                      description: This partition's link state.
                    last_success_at:
                      type: string
                      description: When the remote last accepted a chunk from this partition.
                    blocked_at:
                      type: object
                      description: The record this partition's cursor is stuck on, if any.
    Message:
      type: object
      description: 'One message. A batch consume answers `{"messages": [...]}` with one of these per message.'
      properties:
        topic:
          type: string
          description: Topic name.
        partition:
          type: integer
          description: Partition the message is stored in.
        offset:
          type: integer
          description: Position in the partition.
        key:
          type: string
          description: The produce key. Absent for a message produced without one.
        key_encoding:
          type: string
          enum: [base64]
          x-narad-since: v3.1.0
          description: '`base64` when the key is not valid UTF-8 and `key` holds it in base64.'
        payload:
          description: |
            The message as it was produced. Valid JSON comes back as JSON,
            other UTF-8 text as a JSON string, and anything else as a base64
            string with `payload_encoding`.
        payload_encoding:
          type: string
          enum: [base64]
          description: '`base64` when `payload` holds binary data in base64.'
        timestamp:
          type: integer
          description: When the message was committed to its partition, Unix seconds.
        receipt_handle:
          type: string
          description: The lease to settle with [ack](#ack), `partition:offset:nonce`. Absent on a replay.
    ProduceBatchRequest:
      type: object
      required: [messages]
      additionalProperties: false
      properties:
        messages:
          type: array
          description: 1 to 1,000 messages (from v3.2.0; 1 to 100 in v3.1.0), stored in this order.
          items:
            type: object
            required: [payload]
            additionalProperties: false
            properties:
              payload:
                description: |
                  A JSON value, stored exactly as written (a JSON string
                  keeps its quotes). With `payload_encoding`, a base64
                  string of any bytes.
              payload_encoding:
                type: string
                enum: [base64]
                description: Set to `base64` for a payload that is not JSON.
              key:
                type: string
                description: The message's key. Absent or empty means no key.
              key_encoding:
                type: string
                enum: [base64]
                description: Set to `base64` for a key that is not valid UTF-8.
              partition:
                type: integer
                minimum: 0
                description: Pin the message to this partition.
    PauseRemoteChildRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          description: Why, shown in the listing and the audit line. At most 256 bytes of printable text.
    ResumeRemoteChildRequest:
      type: object
      additionalProperties: false
      properties:
        accept_target:
          type: boolean
          default: false
          description: Accept a target topic that was deleted and recreated since the attach (state `target_replaced`), and send to it.
    SkipRemoteRecordRequest:
      type: object
      required: [partition, offset]
      additionalProperties: false
      properties:
        partition:
          type: integer
          minimum: 0
          description: The parent partition of the stuck record.
        offset:
          type: integer
          minimum: 0
          description: Its offset, as `blocked_at` shows it.
    RemoteLimits:
      type: object
      additionalProperties: false
      description: A remote's limits. Each applies per node and changes live; a field left out keeps its value (its default on a create).
      properties:
        max_in_flight:
          type: integer
          minimum: 1
          maximum: 256
          default: 16
          description: Requests to the remote in flight at once on each node, shared by every cursor that sends to it.
        request_timeout_ms:
          type: integer
          minimum: 5000
          maximum: 120000
          default: 30000
          description: Timeout of one request to the remote.
        idle_conn_timeout_ms:
          type: integer
          minimum: 1000
          maximum: 300000
          default: 30000
          description: How long an idle connection to the remote is kept.
        conn_max_age_ms:
          type: integer
          minimum: 10000
          maximum: 3600000
          default: 300000
          description: How often the connections are replaced, busy ones included (each closes once its request ends), so a DNS change or a load balancer scale-out is picked up.
        check_interval_ms:
          type: integer
          minimum: 10000
          maximum: 3600000
          default: 60000
          description: How often each node re-checks the target of each link, with records to send or not (with 20% jitter).
        compression:
          type: string
          enum: [none, zstd]
          default: none
          description: '`zstd` compresses a chunk when that saves at least 10% and the target decodes zstd; otherwise it goes uncompressed.'
    CreateRemoteRequest:
      type: object
      required: [name, url, username, password]
      additionalProperties: false
      properties:
        name:
          type: string
          description: A lowercase letter, then up to 62 lowercase letters, digits or `-`.
        url:
          type: string
          description: The remote cluster's `https` URL, such as its ingress. Stored in a canonical form.
        username:
          type: string
          description: The replicator user on the remote. Give it `produce` on the replicated topics only; an admin credential fails the checks.
        password:
          type: string
          writeOnly: true
          description: That user's password, 24 to 72 bytes. Write-only.
        ca_pem:
          type: string
          description: 1 to 16 PEM certificates, at most 64 KiB, that alone verify the remote. Left out, the system roots do.
        limits:
          $ref: '#/components/schemas/RemoteLimits'
    UpdateRemoteRequest:
      type: object
      additionalProperties: false
      description: Name at least one field. A new `url`, `username` or `ca_pem` needs `password` too.
      properties:
        url:
          type: string
          description: A new `https` URL.
        username:
          type: string
          description: A new replicator user.
        password:
          type: string
          writeOnly: true
          description: A new password, 24 to 72 bytes.
        ca_pem:
          type: string
          description: A new CA bundle, or `""` for the system roots.
        limits:
          $ref: '#/components/schemas/RemoteLimits'
    Remote:
      type: object
      description: A remote as the API shows it. It never holds the password.
      properties:
        name:
          type: string
          description: The remote's name.
        id:
          type: string
          description: An ID minted at create; a remote created again under the same name gets a new one.
        url:
          type: string
          description: The canonical URL.
        username:
          type: string
          description: The replicator user on the remote.
        password:
          type: object
          description: 'What can be said about the password: `fingerprint` (keyed, so it reveals nothing without the cluster secret), `set_at`, `set_by` and `key_version`, the key it is sealed under.'
        credential_version:
          type: integer
          description: Moves on every new password or re-encrypt.
        ca_pem_sha512:
          type: string
          description: SHA-512 of the CA bundle. Absent when the system roots verify the remote.
        limits:
          $ref: '#/components/schemas/RemoteLimits'
        revision:
          type: integer
          description: Moves on every change.
        created_at:
          type: string
          description: RFC 3339.
        created_by:
          type: string
          description: The admin who created it.
        links:
          type: array
          items:
            type: string
          description: The remote children that use it, as `parent/child`. Absent in a write's answer.
        nodes:
          type: array
          description: What each member's credential cache holds for the remote. Absent with `nodes=false` and in a write's answer.
          items:
            type: object
            properties:
              node:
                type: string
                description: Member ID.
              state:
                type: string
                enum: [ready, stale, credential_unreadable, node_insecure, missing, unknown]
                description: '`ready`; `stale` while it holds an older credential version than the record; `credential_unreadable` when it cannot open the password (a secret it does not have); `node_insecure` when its posture forbids remotes; `missing` when it holds no entry yet; `unknown` when it did not answer, with `last_error` `unreachable` or `old_release`.'
              credential_version:
                type: integer
                description: The credential version it decrypted.
              key_version:
                type: string
                description: The key that version was sealed under.
              fingerprint:
                type: string
                description: The fingerprint of the password it holds.
              last_ok_at:
                type: string
                description: When it last reached the remote successfully.
              last_error:
                type: string
                description: The class of its last failure toward the remote, `none` when there was none. Never text from the remote.
              server_cert_not_after:
                type: string
                description: When the remote's certificate expires, as the last check saw it; only with `remotes.allowed_hosts` set.
              rtt_ms:
                type: integer
                description: Connect time to the remote; only with `remotes.allowed_hosts` set.
    RemoteList:
      type: object
      properties:
        allowlist:
          type: string
          enum: [set, none]
          description: Whether the answering node has `remotes.allowed_hosts` set.
        key:
          type: object
          description: The current encryption key's `key_version`, `first_sealed_at` and `age_seconds`. Absent before the first remote.
        remotes:
          type: array
          items:
            $ref: '#/components/schemas/Remote'
        lingering:
          type: array
          description: Deleted remotes some member still holds, with the members `holding` them and the ones `not_answering`.
          items:
            type: object
        not_answering:
          type: array
          description: Every member that was asked and did not answer, whether or not an answering member still holds a deleted remote. Such a member may still hold one.
          items:
            type: string
    TestRemoteRequest:
      type: object
      required: [topic]
      additionalProperties: false
      properties:
        topic:
          type: string
          description: The topic on the remote.
        source:
          type: string
          description: The parent topic on this cluster, for the schema, source and loop checks.
    RemoteTestResult:
      type: object
      properties:
        remote:
          type: string
          description: The remote.
        result:
          type: string
          enum: [pass, fail]
          description: '`pass` only when every member passed.'
        class:
          type: string
          description: When `result` is `fail`, the most important failure ([check classes](remote-children.md#check-classes)).
        checks:
          type: array
          description: One report per member that ran the checks.
          items:
            type: object
            properties:
              node:
                type: string
                description: Member ID.
              result:
                type: string
                enum: [pass, fail]
                description: This member's verdict.
              class:
                type: string
                description: Why it failed.
              credential_version:
                type: integer
                description: The credential version it checked with.
              target_id:
                type: string
                description: The target topic's ID.
              target_serves_ids:
                type: boolean
                description: '`false` for a target whose children listing serves no `parent_id` and no `remote` objects (v3.1.0): it cannot hold a remote child, so loop detection starts once it is upgraded; recreate detection reads the topic id from its describe answer. Absent without `remotes.allowed_hosts` (a blind report) and when the checks stopped before they read the target''s children listing.'
              rtt_ms:
                type: integer
                description: TCP connect time, with `remotes.allowed_hosts` set.
              lane_capacity_per_s:
                type: integer
                description: An estimate of one lane's records per second at that round trip, with `remotes.allowed_hosts` set.
              server_cert_not_after:
                type: string
                description: When the target's certificate expires, with `remotes.allowed_hosts` set.
              warnings:
                type: array
                items:
                  type: string
                description: Advisories, such as a certificate that expires within 14 days.
              posture:
                type: object
                description: The member's `security_enabled`, `legacy_cluster_auth`, `raft_tls` and `api_hop_encrypted`.
    ReencryptResult:
      type: object
      properties:
        key_version:
          type: string
          description: The current key.
        reencrypted:
          type: array
          items:
            type: string
          description: Remotes moved to the current key.
        already_current:
          type: array
          items:
            type: string
          description: Remotes already under it.
        failed:
          type: array
          description: Remotes not moved, each with `name` and `reason`.
          items:
            type: object
    ProduceBatchAccepted:
      type: object
      properties:
        accepted:
          type: integer
