  /v1/cluster/members:
    get:
      operationId: listMembers
      tags: [Cluster]
      summary: List cluster members
      description: |
        Lists every node the cluster knows, alive or dead, with how many
        partitions it owns and how many are moving off it, whether it is a
        Raft voter or the leader, how long ago its last heartbeat was
        stamped, and why a decommission in progress is blocked. Answered
        from the receiving node's replica without asking any other node,
        unless `detail` is set.
      x-narad-grant: |
        `admin`.
      parameters:
        - name: detail
          in: query
          x-narad-since: unreleased
          description: |
            `true` also asks every member for its own status (dispatch
            backlog, quarantined copies, move workers), all at once and
            within 2 seconds in total. A member that cannot answer gets a
            `status_error` instead; a v3.0.1 node is reported as an older
            release that cannot report its status.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The members, in ID order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '401':
          description: Missing or wrong credentials.
        '400':
          description: '`detail` is not `true` or `false`.'
        '403':
          description: Not `admin`.
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" "$NARAD/v1/cluster/members"
          response: |
            HTTP/1.1 200 OK
            Content-Length: 183
            Content-Type: application/json
            Date: Mon, 05 Oct 2026 19:14:29 GMT

            {"members":[{"id":"narad-0","addr":"127.0.0.1:17970","status":"alive","draining":false,"owned_partitions":4,"outbound_moves":0,"voter":true,"leader":true,"heartbeat_age_seconds":2}]}
  /v1/cluster/moves:
    get:
      operationId: listMoves
      tags: [Cluster]
      summary: List partition moves
      description: |
        Lists every partition that is moving between nodes right now, with
        each side's liveness and why a move is blocked. Abort one with
        `POST /v1/cluster/moves/{topic}/{partition}/abort`.
      x-narad-grant: |
        `admin`.
      parameters:
        - name: detail
          in: query
          x-narad-since: unreleased
          description: |
            `true` also asks each move's destination for its move worker's
            own report: phase, copy attempts, copied bytes, last error and
            why it is blocked. Within 2 seconds in total.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The moves, by topic and partition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveList'
        '401':
          description: Missing or wrong credentials.
        '400':
          description: '`detail` is not `true` or `false`.'
        '403':
          description: Not `admin`.
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" "$NARAD/v1/cluster/moves"
          response: |
            HTTP/1.1 200 OK
            Content-Length: 119
            Content-Type: application/json
            Date: Mon, 05 Oct 2026 19:15:09 GMT

            {"moves":[{"topic":"orders","partition":3,"from":"narad-0","to":"narad-2","from_status":"alive","to_status":"alive"}]}
  /v1/cluster/members/{id}/decommission:
    parameters:
      - name: id
        in: path
        required: true
        description: The node ID, as `GET /v1/cluster/members` lists it (the pod name under the Helm chart).
        schema:
          type: string
    post:
      operationId: decommissionMember
      tags: [Cluster]
      summary: Decommission a node
      description: |
        Marks the node as draining. The cluster moves every partition it
        owns onto the other nodes and, once it owns none and its ingress WAL
        has handed every accepted message to its owner, removes it from
        the Raft voters. Remove the node only after that; the steps are in
        [Scale out and in](../operate/scaling.md#decommission). While it
        drains, the node answers produce with `503`.

        The request is checked first, on the node that receives it and
        again on the leader. A decommission that could never complete
        safely is refused with `409` and every reason, and nothing changes:
        `below_min_voters` (fewer than three voters would remain),
        `no_healthy_majority` (the voters left alive would not be a
        majority), `no_receivers` (no other alive node can take its
        partitions) or `owner_dead` (the node is dead and owns partitions).
      x-narad-grant: |
        `admin`.
      parameters:
        - name: dry_run
          in: query
          x-narad-since: unreleased
          description: |
            `true` answers `200` with what a decommission would do and
            changes nothing. Answered by the receiving node, never
            forwarded.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          x-narad-since: unreleased
          description: '`dry_run=true`: the verdict. Nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecommissionDryRun'
        '204':
          description: Marked as draining.
        '400':
          description: '`dry_run` is not `true` or `false`.'
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not `admin`.
        '404':
          description: No member has this ID.
        '409':
          x-narad-since: unreleased
          description: The decommission could never complete safely. The body names every reason; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecommissionRefusal'
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '503':
          description: The cluster has no leader to write the change.
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X POST \
              "$NARAD/v1/cluster/members/narad-0/decommission" \
              -H "Content-Type: application/json"
          response: |
            HTTP/1.1 204 No Content
            Date: Mon, 28 Sep 2026 19:31:44 GMT
    delete:
      operationId: cancelDecommission
      tags: [Cluster]
      summary: Cancel a decommission
      description: |
        Clears the draining mark. Partitions that already moved stay where
        they are; the node keeps the rest.
      x-narad-grant: |
        `admin`.
      responses:
        '204':
          description: No longer draining.
        '400':
          description: '`dry_run` was given: a cancel cannot be dry-run.'
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not `admin`.
        '404':
          description: No member has this ID.
        '503':
          description: The cluster has no leader to write the change.
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X DELETE \
              "$NARAD/v1/cluster/members/narad-0/decommission"
          response: |
            HTTP/1.1 204 No Content
            Date: Mon, 28 Sep 2026 19:31:44 GMT
  /v1/cluster/moves/{topic}/{partition}/abort:
    parameters:
      - $ref: '#/components/parameters/TopicPath'
      - name: partition
        in: path
        required: true
        description: The partition number.
        schema:
          type: integer
          minimum: 0
    post:
      operationId: abortMove
      tags: [Cluster]
      summary: Abort a partition move
      x-narad-since: unreleased
      description: |
        Clears the move's target, so the partition stays with its owner
        and keeps serving there. The destination discards its copy. The
        abort is a compare-and-set on the leader: a move re-planned to
        another node in the meantime is left alone. The answer is read
        back from the leader's assignment after the abort, so a move whose
        flip committed before the abort reached the leader is refused
        with `409`, never reported as aborted. The cluster may plan a move
        for the partition again later. An abort that took effect is
        audited as `cluster.move.abort`; one whose outcome could not be
        read back is audited with `outcome unknown`.
      x-narad-grant: |
        `admin`.
      parameters:
        - name: target
          in: query
          description: |
            The destination you mean, as `GET /v1/cluster/moves` showed
            it. When the move now targets another node, the request is
            refused with `409` and nothing changes.
          schema:
            type: string
      responses:
        '202':
          description: The leader cleared the target; the partition stays with its owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveAbort'
        '400':
          description: The partition is not a number.
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not `admin`.
        '404':
          description: The partition has no assignment.
        '409':
          description: No move is in flight for the partition, or it targets another node than `target`, or the leader's assignment after the abort shows the move finished first (another node owns the partition now) or still in flight; the message names the owner and target. Nothing was aborted.
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '503':
          description: The cluster has no leader to write the change, or the abort reached the leader but whether it cleared the target could not be read back; list the moves to see.
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X POST \
              "$NARAD/v1/cluster/moves/orders/3/abort?target=narad-2" \
              -H "Content-Type: application/json"
          response: |
            HTTP/1.1 202 Accepted
            Content-Length: 240
            Content-Type: application/json
            Date: Mon, 05 Oct 2026 19:15:09 GMT

            {"move":{"topic":"orders","partition":3,"from":"narad-0","to":"narad-2","from_status":"alive","to_status":"alive"},"note":"the move's target was cleared; the partition stays with its owner, and the controller may plan a move for it again"}
  /v1/cluster/members/{id}/forget:
    parameters:
      - name: id
        in: path
        required: true
        description: >-
          The Raft server ID. The leader's warnings name a server with no
          member record as `raft server "<id>" has no member record`; under
          the Helm chart a node's Raft ID is its pod name, such as `narad-3`.
        schema:
          type: string
    post:
      operationId: forgetServer
      tags: [Cluster]
      summary: Forget a Raft server with no member record
      x-narad-since: unreleased
      description: |
        Removes a Raft voter or non-voter that has no member record, such as
        a joiner a 3.0.x leader admitted that never registered. Such a
        server counts against quorum as a voter, and holds back new Raft
        entry types whatever its suffrage, and decommission cannot reach
        it. Forget moves and deletes no data: it refuses a server with a
        member record, alive, dead or draining (decommission it instead),
        and one a partition assignment names. It also refuses a voter
        unless the leader and the other voters it reaches make a majority
        of the voters left after the removal: Raft commits the removal
        under the new configuration, so a cluster left without that
        majority loses its leader and cannot undo the change. It runs on
        the leader; followers forward it. The steps are in
        [Troubleshooting](../operate/troubleshooting.md#raft-server-no-member-record).
      x-narad-grant: |
        `admin`.
      responses:
        '200':
          description: Removed from the Raft configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgottenServer'
        '400':
          description: The ID names the leader itself.
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not `admin`.
        '404':
          description: No Raft server has this ID.
        '409':
          description: The server has a member record (decommission it instead), a partition assignment names it as owner or move target, or it is a voter and the voters left could lack a quorum (the leader's Raft heartbeats to too many of them are failing, or it has led for less than 12 s). The message says which.
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '501':
          description: The leader runs a release before forget. Upgrade it first.
          x-narad-origin: forwarding
        '503':
          description: The cluster has no leader to write the change, or the leader could not be reached. The server may have been removed; read the leader's log or retry.
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X POST \
              "$NARAD/v1/cluster/members/narad-3/forget" \
              -H "Content-Type: application/json"
          response: |
            HTTP/1.1 200 OK
            Content-Length: 31
            Content-Type: application/json
            Date: Mon, 05 Oct 2026 14:20:04 GMT

            {"id":"narad-3","voter":false}
  /healthz:
    get:
      operationId: healthz
      tags: [Health and metrics]
      summary: Check liveness
      security: []
      description: |
        Answers `200` while the process runs, from the moment it starts,
        and `503` once a graceful shutdown has begun. It never needs
        credentials. It is also served on the metrics listener when
        `http.metrics_addr` is set.
      x-narad-grant: |
        None.
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: The node is shutting down.
      x-narad-examples:
        - request: |
            curl -i "$NARAD/healthz"
          response: |
            HTTP/1.1 200 OK
            Content-Length: 16
            Content-Type: application/json
            Date: Mon, 28 Sep 2026 19:31:44 GMT

            {"status":"ok"}
  /readyz:
    get:
      operationId: readyz
      tags: [Health and metrics]
      summary: Check readiness
      security: []
      description: |
        Answers `200` only while the node should receive traffic: its
        startup work is done, it has a Raft leader in view that it heard
        from within the last 5 seconds (or it is the leader), and its copy
        of the cluster metadata has caught up with the leader since it
        started. Otherwise it answers `503` with the reason in `error`.
        The check runs on every request. It never needs credentials.

        A `200` can list conditions under `degraded` (unreleased): an
        expired Raft TLS certificate or CA bundle. They do not make the
        node unready, because one certificate usually serves every node
        and expires on all of them at once, and failing readiness would
        take every pod out of its Services. See
        [Raft TLS certificates](../operate/raft-tls.md#expiry).
      x-narad-grant: |
        None.
      responses:
        '200':
          description: Ready for traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Not ready. The `error` field says why.
      x-narad-examples:
        - request: |
            curl -i "$NARAD/readyz"
          response: |
            HTTP/1.1 200 OK
            Content-Length: 19
            Content-Type: application/json
            Date: Mon, 28 Sep 2026 19:31:44 GMT

            {"status":"ready"}
  /metrics:
    get:
      operationId: metrics
      tags: [Health and metrics]
      summary: Scrape metrics
      description: |
        The Prometheus text exposition; every series is in the
        [Metrics reference](metrics.md). Where it is served depends on
        `http.metrics_addr`:

        - Not set (the binary's default): on the API port, and it needs
          the same credentials as the API unless
          `http.metrics_unauthenticated` is `true`.
        - Set (the Helm chart sets `:9100`): on that listener without
          credentials, and not on the API port, where a request gets
          `404` (or `401` without credentials).
      x-narad-grant: |
        Any valid credentials on the API port; none on the metrics
        listener.
      responses:
        '200':
          description: The exposition.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or wrong credentials on the API port.
      x-narad-examples:
        - request: |
            curl -sS -u "$AUTH" "$NARAD/metrics" | grep '^narad_topics_total'
          response: |
            narad_topics_total 2
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  parameters:
    TopicPath:
      name: topic
      in: path
      required: true
      description: Name of the topic.
      schema:
        type: string
    ParentPath:
      name: parent
      in: path
      required: true
      description: Name of the parent topic.
      schema:
        type: string
    UsernamePath:
      name: username
      in: path
      required: true
      description: The username.
      schema:
        type: string
  schemas:
    CreateTopicRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 200
          description: |
            1 to 200 characters from `A-Z a-z 0-9 . _ -`, not `.` or `..`,
            and not differing from an existing topic's name only in letter
            case (`409`). Topics an earlier release created with names up to
            255 characters keep working.
        partitions:
          type: integer
          minimum: 3
          description: |
            At least 3 and at most the server's maximum (108 by default).
            Defaults to the server default (3), or to the parent's count
            when `parent` is set. It can grow later, never shrink. Both
            server settings are in the
            [Configuration reference](configuration.md#topic-defaults).
        retention_ms:
          type: integer
          description: |
            How long a message is kept after it is written, whether or not
            it was consumed. At least 3,600,000 (1 hour), or `0` to keep
            messages forever; a negative value gets `400`. Left out, it
            takes the server default
            ([Configuration reference](configuration.md#topic-defaults)):
            7 days in the binary, 12 hours in the Helm chart.
        visibility_timeout_ms:
          type: integer
          default: 30000
          description: How long a consumer's lease lasts before the message is delivered again. Defaults to the server default ([Configuration reference](configuration.md#topic-defaults)). Fixed after creation.
        max_in_flight_per_partition:
          type: integer
          default: 1024
          description: Most messages of one partition leased at once. At the cap, consumes find nothing new in that partition until a lease ends. Defaults to the server default ([Configuration reference](configuration.md#topic-defaults)).
        max_acked_ahead_per_partition:
          type: integer
          default: 1024
          description: |
            Most acks one partition holds above its oldest unacked message.
            At the cap the partition delivers no new messages until that
            message is acked. Defaults to the server default
            ([Configuration reference](configuration.md#topic-defaults)).
        schema:
          description: A JSON Schema every message must match; registered as version 1. A JSON object or `true`.
        parent:
          type: string
          description: |
            Create the topic as a fan-out child of this existing topic. Its
            partitions are placed on other nodes than the parent's where the
            cluster allows, which is what makes a
            [replica child](../operate/backups.md#replica-children).
        fanout_delay_ms:
          type: integer
          description: |
            With `parent`, make the topic a delay child that receives each
            message this long after the parent committed it. At most
            31,536,000,000 (one year). Attaching an existing topic takes
            `delay_ms` instead.
        owner:
          type: string
          description: Ignored. The server sets the owner to the caller.
    AlterTopicRequest:
      type: object
      additionalProperties: false
      properties:
        retention_ms:
          type: integer
          description: New retention. At least 3,600,000 (1 hour), or `0` to keep messages forever; a negative value gets `400`. To return to the server default, send its value.
        max_in_flight_per_partition:
          type: integer
          description: New in-flight cap; `0` sets the server default. A cap left out keeps its value.
        max_acked_ahead_per_partition:
          type: integer
          description: New acked-ahead cap; `0` sets the server default. A cap left out keeps its value.
        partitions:
          type: integer
          description: New partition count, larger than the current one and at most the server's maximum (108 by default). New keys may then map to other partitions.
        schema:
          description: |
            A new schema version, checked for compatibility with the current
            one. Sending the current schema again changes nothing and
            answers `200`. A schema cannot be removed (`null` gets `400`).
        schema_base_version:
          type: integer
          description: With `schema`, apply it only if the current version is exactly this number; `409` otherwise.
    Topic:
      type: object
      properties:
        name:
          type: string
          description: Topic name.
        id:
          type: string
          description: The [incarnation](glossary.md#incarnation) ID, 16 hex characters. A topic deleted and created again under the same name gets a new one. Absent on a topic created before v2.2.0.
        partitions:
          type: integer
          description: Partition count.
        retention_ms:
          type: integer
          description: Retention in milliseconds; `0` keeps messages forever.
        visibility_timeout_ms:
          type: integer
          description: Lease length in milliseconds.
        max_in_flight_per_partition:
          type: integer
          description: In-flight cap per partition.
        max_acked_ahead_per_partition:
          type: integer
          description: Acked-ahead cap per partition.
        created_at:
          type: integer
          description: Creation time, Unix seconds.
        owner:
          type: string
          description: The user that created the topic. Absent when security was off.
        role:
          type: string
          enum: [standalone, parent, child]
          description: Fan-out role. Absent in the answer to a create without `parent`, which means `standalone`.
        children:
          type: array
          items:
            type: string
          description: A parent's children, in attach order.
        parent:
          type: string
          description: A child's parent.
        attach_epoch:
          type: string
          description: A child's current attachment; it changes on every attach.
        fanout_delay_ms:
          type: integer
          description: A delay child's delay in milliseconds.
        attach_offsets:
          type: array
          items:
            type: integer
          description: A child's attach point, one offset per parent partition.
    TopicDetails:
      allOf:
        - $ref: '#/components/schemas/Topic'
        - type: object
          properties:
            schema_version:
              type: integer
              description: Current schema version, `0` without a schema.
            schema:
              description: The current schema document. Absent without a schema.
            partition_stats:
              type: array
              description: One entry per partition, or only the one `partition` asked for.
              items:
                $ref: '#/components/schemas/PartitionStats'
            partial:
              type: boolean
              description: '**Unreleased.** `true` when some entries are placeholders whose owner could not report (`status` `owner_unavailable`). Absent otherwise.'
    PartitionStats:
      type: object
      properties:
        index:
          type: integer
          description: Partition number.
        segments:
          type: integer
          description: Segment files on disk.
        oldest_offset:
          type: integer
          description: Lowest offset still kept.
        next_offset:
          type: integer
          description: Offset the next record will get. It can lead `high_watermark` while a commit runs.
        high_watermark:
          type: integer
          description: One past the last offset consumers can see.
        size_bytes:
          type: integer
          description: Bytes on disk.
        oldest_segment_at:
          type: integer
          description: Time of the oldest segment, Unix seconds. Absent when unknown.
        owner_node:
          type: string
          description: ID of the node that owns the partition.
        status:
          type: string
          enum: [ok, owner_unavailable]
          description: '**Unreleased.** `ok` when the statistics are the owner''s; `owner_unavailable` for a placeholder with zero statistics, because the owner could not report them. Never add a placeholder''s numbers to a total.'
        owner_liveness:
          type: string
          enum: [dead, unreachable, unknown, unassigned]
          description: '**Unreleased.** Why an `owner_unavailable` partition''s owner could not report: `dead` (marked dead), `unreachable` (alive, but its statistics did not come back within 2 seconds), `unknown` (no member with an address), `unassigned` (no owner yet). Absent for `ok`.'
    TopicPage:
      type: object
      properties:
        topics:
          type: array
          description: Topics the caller can read.
          items:
            $ref: '#/components/schemas/Topic'
        next_page_token:
          type: string
          description: Pass as `page_token` for the next page; empty when there are no more.
    SchemaHistory:
      type: object
      properties:
        topic:
          type: string
          description: Topic name.
        version:
          type: integer
          description: Current version, `0` without a schema.
        versions:
          type: array
          description: Every version, oldest first.
          items:
            type: object
            properties:
              version:
                type: integer
                description: Version number, from 1.
              schema:
                description: The schema document.
    AttachChildRequest:
      type: object
      required: [child]
      additionalProperties: false
      properties:
        child:
          type: string
          description: Name of the existing topic to attach.
        delay_ms:
          type: integer
          description: Make the child a delay child that receives each message this long after the parent committed it. At most one year. Fixed while attached.
    ChildList:
      type: object
      properties:
        parent:
          type: string
          description: Parent topic name.
        children:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Child topic name.
              delay_ms:
                type: integer
                description: The child's delay, `0` for an immediate child.
              lag_messages:
                type: integer
                description: Parent messages not yet copied into the child, summed over partitions.
              lag_complete:
                type: boolean
                description: '`false` while some partitions have not reported, so `lag_messages` is a lower bound.'
    Message:
      type: object
      description: 'One message. A batch consume answers `{"messages": [...]}` with one of these per message.'
      properties:
        topic:
          type: string
          description: Topic name.
        partition:
          type: integer
          description: Partition the message is stored in.
        offset:
          type: integer
          description: Position in the partition.
        key:
          type: string
          description: The produce key. Absent for a message produced without one.
        key_encoding:
          type: string
          enum: [base64]
          x-narad-since: unreleased
          description: '`base64` when the key is not valid UTF-8 and `key` holds it in base64.'
        payload:
          description: |
            The message as it was produced. Valid JSON comes back as JSON,
            other UTF-8 text as a JSON string, and anything else as a base64
            string with `payload_encoding`.
        payload_encoding:
          type: string
          enum: [base64]
          description: '`base64` when `payload` holds binary data in base64.'
        timestamp:
          type: integer
          description: When the message was committed to its partition, Unix seconds.
        receipt_handle:
          type: string
          description: The lease to settle with [ack](#ack), `partition:offset:nonce`. Absent on a replay.
    ProduceBatchRequest:
      type: object
      required: [messages]
      additionalProperties: false
      properties:
        messages:
          type: array
          description: 1 to 100 messages, stored in this order.
          items:
            type: object
            required: [payload]
            additionalProperties: false
            properties:
              payload:
                description: |
                  A JSON value, stored exactly as written (a JSON string
                  keeps its quotes). With `payload_encoding`, a base64
                  string of any bytes.
              payload_encoding:
                type: string
                enum: [base64]
                description: Set to `base64` for a payload that is not JSON.
              key:
                type: string
                description: The message's key. Absent or empty means no key.
              key_encoding:
                type: string
                enum: [base64]
                description: Set to `base64` for a key that is not valid UTF-8.
              partition:
                type: integer
                minimum: 0
                description: Pin the message to this partition.
    ProduceBatchAccepted:
      type: object
      properties:
        accepted:
          type: integer
          description: How many messages were stored.
    AckBatchRequest:
      type: object
      required: [receipt_handles]
      additionalProperties: false
      properties:
        receipt_handles:
          type: array
          x-narad-since: unreleased
          description: 1 to 100 receipt handles of this topic.
          items:
            type: string
    AckBatchResults:
      type: object
      properties:
        results:
          type: array
          description: One result per handle, in request order.
          items:
            type: object
            properties:
              status:
                type: integer
                description: The status a single ack of this handle would have answered.
              error:
                type: string
                description: The error message, for a failed handle.
    Grant:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [produce, consume, create, admin]
          description: What the grant allows; see [Access model and grants](access-model.md#actions).
        patterns:
          type: array
          items:
            type: string
          description: Topic names or prefix wildcards such as `invoices.*`. Required for every action but `admin`, which takes none.
    CreateUserRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          description: 1 to 64 characters from `A-Z a-z 0-9 . _ -`, not `.` or `..`.
        password:
          type: string
          description: 1 to 72 bytes. A character outside ASCII counts as more than one byte.
        grants:
          type: array
          description: What the user may do. Leave it out for a user with no grants.
          items:
            $ref: '#/components/schemas/Grant'
    UpdateGrantsRequest:
      type: object
      required: [grants]
      additionalProperties: false
      properties:
        grants:
          type: array
          description: The complete new list; it replaces the old one. An empty list removes every grant.
          items:
            $ref: '#/components/schemas/Grant'
    UpdatePasswordRequest:
      type: object
      required: [new_password]
      additionalProperties: false
      properties:
        new_password:
          type: string
          description: 1 to 72 bytes.
        current_password:
          type: string
          description: The user's current password. Required when a user who is not `admin` changes their own.
    User:
      type: object
      properties:
        username:
          type: string
          description: The username.
        grants:
          type: array
          description: The user's grants. Absent when it has none.
          items:
            $ref: '#/components/schemas/Grant'
        root:
          type: boolean
          description: '`true` for the root admin, which holds every right and cannot be deleted. Absent otherwise.'
        created_at_ms:
          type: integer
          description: Creation time, Unix milliseconds.
        updated_at_ms:
          type: integer
          description: Time of the last change, Unix milliseconds.
    MemberList:
      type: object
      properties:
        members:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Node ID.
              addr:
                type: string
                description: The node's API address.
              status:
                type: string
                enum: [alive, dead]
                description: '`dead` once the node stopped sending heartbeats.'
              draining:
                type: boolean
                description: '`true` while the node is being decommissioned.'
              owned_partitions:
                type: integer
                description: Partitions the node owns.
              outbound_moves:
                type: integer
                description: Partitions moving off the node.
              voter:
                type: boolean
                x-narad-since: unreleased
                description: '`true` when the node is a Raft voter.'
              leader:
                type: boolean
                x-narad-since: unreleased
                description: '`true` for the Raft leader.'
              heartbeat_age_seconds:
                type: integer
                x-narad-since: unreleased
                description: Seconds since the leader last stamped the node's heartbeat, by the answering node's clock.
              decommission_blocked:
                type: array
                x-narad-since: unreleased
                description: For a draining node, every reason its decommission cannot progress that the cluster metadata shows. Absent when none. The leader also logs each reason and exports `narad_decommission_blocked`.
                items:
                  $ref: '#/components/schemas/DecommissionReason'
              node_status:
                $ref: '#/components/schemas/NodeStatus'
              status_error:
                type: string
                x-narad-since: unreleased
                description: With `detail=true`, why the node's own status could not be read.
    NodeStatus:
      type: object
      x-narad-since: unreleased
      description: With `detail=true`, the node's own report about itself.
      properties:
        node:
          type: string
          description: Node ID.
        draining:
          type: boolean
          description: The node's own view of its draining mark.
        produce_in_flight:
          type: integer
          description: Client produce requests the node admitted and has not answered yet. Once it is draining it admits none, and a decommission waits for 0.
        dispatch_backlog:
          type: integer
          description: Messages its ingress WAL accepted and has not yet handed to their partition owners. A decommission waits for 0.
        quarantine:
          type: object
          description: Partition copies the node set aside instead of deleting ([Troubleshooting](../operate/troubleshooting.md#quarantined-copies)).
          properties:
            copies:
              type: integer
              description: Every set-aside copy.
            bytes:
              type: integer
              description: Their total size.
            list:
              type: array
              description: The first 100 copies.
              items:
                type: object
                properties:
                  kind:
                    type: string
                    description: '`partition`, `topic_incarnation` or `staging`.'
                  topic:
                    type: string
                    description: Topic name.
                  partition:
                    type: integer
                    description: Partition number, `-1` for a whole topic directory.
                  dir:
                    type: string
                    description: The copy's directory on the node.
                  bytes:
                    type: integer
                    description: Its size.
                  mod_time:
                    type: string
                    description: When it was last modified, RFC 3339.
        moves:
          type: array
          description: The moves this node runs as the destination.
          items:
            $ref: '#/components/schemas/MoveWorker'
    MoveWorker:
      type: object
      x-narad-since: unreleased
      description: A destination's own report of one move.
      properties:
        topic:
          type: string
          description: Topic name.
        partition:
          type: integer
          description: Partition number.
        source:
          type: string
          description: The node the copy comes from.
        target:
          type: string
          description: This node.
        started_at:
          type: string
          description: When the worker started, RFC 3339.
        phase:
          type: string
          enum: [copying, frozen, flip_pending, waiting_for_source, blocked]
          description: What the worker is doing.
        attempts:
          type: integer
          description: Copy attempts against a live source.
        last_error:
          type: string
          description: The last thing that failed.
        copied_bytes:
          type: integer
          description: Bytes the current copy fetched.
        blocked:
          type: string
          enum: [copy_unverifiable, source_dead_copy_behind]
          description: Why the move cannot finish on its own. Absent while it can.
    DecommissionReason:
      type: object
      x-narad-since: unreleased
      properties:
        code:
          type: string
          enum: [below_min_voters, no_healthy_majority, move_target, dispatch_backlog, node_status_unavailable, no_receivers, owner_dead, move_budget_full, leader_transfer]
          description: The reason, as `narad_decommission_blocked` labels it ([Troubleshooting](../operate/troubleshooting.md#decommission-blocked)).
        message:
          type: string
          description: What it means here and what to do.
    DecommissionRefusal:
      type: object
      x-narad-since: unreleased
      properties:
        error:
          type: string
          description: The first reason, in a sentence.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/DecommissionReason'
    DecommissionDryRun:
      type: object
