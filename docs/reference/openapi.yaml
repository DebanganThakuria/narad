              description: Every set-aside copy.
            bytes:
              type: integer
              description: Their total size.
            list:
              type: array
              description: The first 100 copies.
              items:
                type: object
                properties:
                  kind:
                    type: string
                    description: '`partition`, `topic_incarnation` or `staging`.'
                  topic:
                    type: string
                    description: Topic name.
                  partition:
                    type: integer
                    description: Partition number, `-1` for a whole topic directory.
                  dir:
                    type: string
                    description: The copy's directory on the node.
                  bytes:
                    type: integer
                    description: Its size.
                  mod_time:
                    type: string
                    description: When it was last modified, RFC 3339.
        moves:
          type: array
