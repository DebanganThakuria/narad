  /v1/cluster/members/{id}/decommission:
    parameters:
      - name: id
        in: path
        required: true
        description: The node ID, as `GET /v1/cluster/members` lists it (the pod name under the Helm chart).
        schema:
          type: string
    post:
      operationId: decommissionMember
      tags: [Cluster]
      summary: Decommission a node
      description: |
        Marks the node as draining. The cluster moves every partition it
        owns onto the other nodes and, once it owns none and its ingress WAL
        has handed every accepted message to its owner, removes it from
        the Raft voters. Remove the node only after that; the steps are in
        [Scale out and in](../operate/scaling.md#decommission). While it
        drains, the node answers produce with `503`.

        The request is checked first, on the node that receives it and
        again on the leader. A decommission that could never complete
        safely is refused with `409` and every reason, and nothing changes:
        `below_min_voters` (fewer than three voters would remain),
        `no_healthy_majority` (the voters left alive would not be a
        majority), `no_receivers` (no other alive node can take its
        partitions) or `owner_dead` (the node is dead and owns partitions).
      x-narad-grant: |
        `admin`.
      parameters:
        - name: dry_run
          in: query
          x-narad-since: v3.1.0
          description: |
            `true` answers `200` with what a decommission would do and
            changes nothing. Answered by the receiving node, never
            forwarded.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          x-narad-since: v3.1.0
          description: '`dry_run=true`: the verdict. Nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecommissionDryRun'
        '204':
          description: Marked as draining.
        '400':
          description: '`dry_run` is not `true` or `false`.'
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not `admin`.
        '404':
          description: No member has this ID.
        '409':
          x-narad-since: v3.1.0
          description: The decommission could never complete safely. The body names every reason; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecommissionRefusal'
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '503':
          description: The cluster has no leader to write the change.
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X POST \
              "$NARAD/v1/cluster/members/narad-0/decommission" \
              -H "Content-Type: application/json"
          response: |
            HTTP/1.1 204 No Content
            Date: Mon, 28 Sep 2026 19:31:44 GMT
    delete:
      operationId: cancelDecommission
      tags: [Cluster]
      summary: Cancel a decommission
      description: |
        Clears the draining mark. Partitions that already moved stay where
        they are; the node keeps the rest.
      x-narad-grant: |
        `admin`.
      responses:
        '204':
          description: No longer draining.
        '400':
          description: '`dry_run` was given: a cancel cannot be dry-run.'
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not `admin`.
        '404':
          description: No member has this ID.
        '503':
          description: The cluster has no leader to write the change.
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X DELETE \
              "$NARAD/v1/cluster/members/narad-0/decommission"
          response: |
            HTTP/1.1 204 No Content
            Date: Mon, 28 Sep 2026 19:31:44 GMT
  /v1/cluster/moves/{topic}/{partition}/abort:
    parameters:
      - $ref: '#/components/parameters/TopicPath'
      - name: partition
        in: path
        required: true
        description: The partition number.
        schema:
          type: integer
          minimum: 0
    post:
      operationId: abortMove
      tags: [Cluster]
      summary: Abort a partition move
      x-narad-since: v3.1.0
      description: |
        Clears the move's target, so the partition stays with its owner
        and keeps serving there. The destination discards its copy. The
        abort is a compare-and-set on the leader: a move re-planned to
        another node in the meantime is left alone. The answer is read
        back from the leader's assignment after the abort, so a move whose
        flip committed before the abort reached the leader is refused
        with `409`, never reported as aborted. The cluster may plan a move
        for the partition again later. An abort that took effect is
        audited as `cluster.move.abort`; one whose outcome could not be
        read back is audited with `outcome unknown`.
      x-narad-grant: |
        `admin`.
      parameters:
        - name: target
          in: query
          description: |
            The destination you mean, as `GET /v1/cluster/moves` showed
            it. When the move now targets another node, the request is
            refused with `409` and nothing changes.
          schema:
            type: string
      responses:
        '202':
          description: The leader cleared the target; the partition stays with its owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveAbort'
        '400':
          description: The partition is not a number.
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not `admin`.
        '404':
          description: The partition has no assignment.
        '409':
          description: No move is in flight for the partition, or it targets another node than `target`, or the leader's assignment after the abort shows the move finished first (another node owns the partition now) or still in flight; the message names the owner and target. Nothing was aborted.
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '503':
          description: The cluster has no leader to write the change, or the abort reached the leader but whether it cleared the target could not be read back; list the moves to see.
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X POST \
              "$NARAD/v1/cluster/moves/orders/3/abort?target=narad-2" \
              -H "Content-Type: application/json"
          response: |
            HTTP/1.1 202 Accepted
            Content-Length: 240
            Content-Type: application/json
            Date: Mon, 05 Oct 2026 19:15:09 GMT

            {"move":{"topic":"orders","partition":3,"from":"narad-0","to":"narad-2","from_status":"alive","to_status":"alive"},"note":"the move's target was cleared; the partition stays with its owner, and the controller may plan a move for it again"}
  /v1/cluster/members/{id}/forget:
    parameters:
      - name: id
        in: path
        required: true
        description: >-
          The Raft server ID. The leader's warnings name a server with no
          member record as `raft server "<id>" has no member record`; under
          the Helm chart a node's Raft ID is its pod name, such as `narad-3`.
        schema:
          type: string
    post:
      operationId: forgetServer
      tags: [Cluster]
      summary: Forget a Raft server with no member record
      x-narad-since: v3.1.0
      description: |
        Removes a Raft voter or non-voter that has no member record, such as
        a joiner a 3.0.x leader admitted that never registered. Such a
        server counts against quorum as a voter, and holds back new Raft
        entry types whatever its suffrage, and decommission cannot reach
        it. Forget moves and deletes no data: it refuses a server with a
        member record, alive, dead or draining (decommission it instead),
        and one a partition assignment names. It also refuses a voter
        unless the leader and the other voters it reaches make a majority
        of the voters left after the removal: Raft commits the removal
        under the new configuration, so a cluster left without that
        majority loses its leader and cannot undo the change. It runs on
        the leader; followers forward it. The steps are in
        [Troubleshooting](../operate/troubleshooting.md#raft-server-no-member-record).
      x-narad-grant: |
        `admin`.
      responses:
        '200':
          description: Removed from the Raft configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgottenServer'
        '400':
          description: The ID names the leader itself.
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not `admin`.
        '404':
          description: No Raft server has this ID.
        '409':
          description: The server has a member record (decommission it instead), a partition assignment names it as owner or move target, or it is a voter and the voters left could lack a quorum (the leader's Raft heartbeats to too many of them are failing, or it has led for less than 12 s). The message says which.
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '501':
          description: The leader runs a release before forget. Upgrade it first.
          x-narad-origin: forwarding
        '503':
          description: The cluster has no leader to write the change, or the leader could not be reached. The server may have been removed; read the leader's log or retry.
      x-narad-examples:
        - request: |
            curl -i -u "$AUTH" -X POST \
              "$NARAD/v1/cluster/members/narad-3/forget" \
              -H "Content-Type: application/json"
          response: |
            HTTP/1.1 200 OK
            Content-Length: 31
            Content-Type: application/json
            Date: Mon, 05 Oct 2026 14:20:04 GMT

            {"id":"narad-3","voter":false}
  /v1/remotes:
    post:
      operationId: createRemote
      tags: [Remotes]
      summary: Register a remote
      x-narad-since: v3.2.0
      description: |
        Registers another Narad cluster this one may send remote children
        to. The node that takes the request checks every field, resolves
        the URL's host and checks it against the address guard, and seals
        the password with AES-256-GCM under a key derived from the cluster
        secret; only the ciphertext travels to the leader and into Raft.
        The password is never shown again: answers carry a keyed
        `fingerprint` instead. Nothing is sent to the remote; run
        [test a remote](#test-remote) next.

        The URL must be `https`, on a port in `remotes.allowed_ports`
        (443 by default), on a host in `remotes.allowed_hosts` when that is
        set, with no user, query or fragment. A node takes at most 10
        remote writes a minute, and a cluster holds at most 64 remotes.
      x-narad-grant: |
        `admin`, with security on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRemoteRequest'
      responses:
        '201':
          description: Registered. The body is the remote.
          x-narad-origin: forwarding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Remote'
        '400':
          description: A field is missing, unknown or invalid (the message names the field, never its value), or the URL's host resolves to an address the guard refuses.
        '401':
          description: Missing or wrong credentials.
        '403':
          description: Not an `admin`, or security is off (`remotes require security`).
        '409':
          description: A remote of that name exists, the cluster holds 64 remotes, or two first creates raced (retry).
          x-narad-origin: forwarding
        '412':
          description: 'Nothing was sealed or stored: this node does not attest an encrypted API hop (`remotes.api_hop_encrypted`); the cluster secret is missing or decodes to fewer than 32 bytes; the current key''s seal budget is spent (rotate the cluster secret); a member does not apply the remote Raft entry types, did not answer, or reports a posture that forbids remotes (the body names it in `members`); or the leader runs an older release.'
        '413':
          description: The body is over 128 KiB.
        '415':
          description: No accepted `Content-Type` and no `X-Narad-Client` header.
        '429':
          description: 'This node took 10 remote writes in the last minute; retry after `Retry-After`, the seconds until the oldest of them leaves the minute.'
        '500':
          description: The node failed to seal the password; logged on the node.
        '501':
          description: The answering node has no remote plane.
        '503':
          description: 'The leader could not be reached, or could not write the change; the request ID in the node''s audit line joins it to the leader''s. Read the remote back before retrying. A leader that could not be reached answers with `Retry-After: 2`. When the leader committed the change but the answering node could not confirm that its own copy applied it, `503` with `Retry-After: 2` and an error that says the change is committed: read it back after the delay, or on another node, and do not send it again.'
