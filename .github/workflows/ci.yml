# CI runs three independent jobs in parallel: build, unit tests, e2e
# tests. Splitting them keeps logs focused and lets a failing test
# suite not mask compile errors (or vice versa). All three use the
# Go version pinned in go.mod via go-version-file, so bumping Go
# happens in one place.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Formatting was checked only by `make check` on developer
      # machines, so a file drifted out of format on master and the
      # documented `make check` failed for everyone who ran it.
      - name: Install the pinned formatters
        run: make tools-install

      - name: gofmt / goimports check
        run: make fmt-check

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # The contract test reads the published spec,
      # docs/reference/openapi.yaml, and fails when its operations and
      # the routes in router.go disagree, when it documents a status
      # code a handler can never answer, or when it leaves out a 2xx
      # code a handler can. Named here so a spec-only change shows the
      # failure next to the build, not deep in the unit-test log.
      - name: Check the published OpenAPI spec against the handlers
        run: go test -count=1 -run '^TestOpenAPIContract' ./internal/transport/httpserver/

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    # Leaves room above the race step's 20m per-package -timeout for
    # setup, race builds and queueing (go test's clock starts when each
    # package's test binary does), so a package that hangs usually fails
    # with go test's goroutine dump rather than the runner killing the
    # job.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Excludes the e2e package; that has its own job below so HTTP
      # surface failures don't get buried in unit-test output and
      # vice versa. internal/cluster alone takes 450-580 s under -race
      # on a laptop, close to go test's default 10-minute per-package
      # timeout, hence the explicit one.
      - name: go test (excluding e2e)
        run: go test -race -count=1 -timeout 20m $(go list ./... | grep -v '/tests/e2e$')

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go test (e2e only)
        run: go test -race -count=1 ./tests/e2e/...

  local-cluster-integration:
    name: Local cluster integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run 3-node cluster integration
        run: |
          ./scripts/local-cluster-e2e.sh \
            --topics 3 \
            --messages 120 \
            --produce-concurrency 12 \
            --consume-concurrency 12 \
            --timeout 2m

  local-cluster-chaos:
    name: Local cluster chaos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run 3-node chaos smoke test
        run: |
          ./scripts/local-cluster-chaos.sh \
            --topics 2 \
            --messages 120 \
            --produce-concurrency 8 \
            --consume-concurrency 8 \
            --timeout 2m
