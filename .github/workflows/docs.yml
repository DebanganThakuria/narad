name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "includes/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      # The HTTP API reference page is generated from the spec, and the
      # check below also compares the spec with the router.
      - "scripts/gen_http_api.py"
      - "internal/transport/httpserver/router.go"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      # Fails when docs/reference/http-api.md is not what
      # docs/reference/openapi.yaml renders to, when the spec and
      # router.go list different routes, or when a status code in the
      # spec has no heading on the status codes page.
      - name: Check the generated HTTP API page
        run: python scripts/gen_http_api.py --check
      # No -q: with -q, MkDocs 1.6 drops warnings before --strict counts
      # them, so a broken link or #anchor would pass.
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
