name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "includes/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      # The contract test below compares the published spec with the
      # router and the handlers.
      - "internal/transport/httpserver/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      # The published spec is the file the Go contract test checks
      # against the handlers, so a deploy never ships a spec that
      # documents a status code the server cannot answer.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the published OpenAPI spec against the handlers
        run: go test -count=1 -run '^TestOpenAPIContract' ./internal/transport/httpserver/
      # No -q: with -q, MkDocs 1.6 drops warnings before --strict counts
      # them, so a broken link or #anchor would pass.
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
