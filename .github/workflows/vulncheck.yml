# Dependency vulnerability scanning, separate from CodeQL: CodeQL looks
# for flaws in our code, govulncheck asks whether a known advisory
# affects a dependency along a call path we actually reach. The
# reachability filter is why this can be a required check without
# drowning pull requests in advisories against code nobody calls.
#
# The weekly run matters as much as the pull-request run. Advisories are
# published against dependencies that have not changed, so a repository
# that only scans on code change learns about them whenever it next
# happens to change code.
name: Vulnerability scan

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Deliberately @latest rather than pinned: a scanner pinned to an
      # old version reports an old view of the vulnerability database,
      # which is the one failure this job exists to prevent.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan module
        run: govulncheck ./...
