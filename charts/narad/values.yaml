replicaCount: 3

# Number of pods that formed the ORIGINAL cluster (they may bootstrap a
# brand-new Raft cluster; everyone else joins the existing one via the
# leader). Set once at first install and never change it. Scaling up is
# done by raising replicaCount only; the bootstrap configuration is
# seeded with exactly these pods, never with every replica.
initialClusterSize: 3

# Size of the PINNED peer list (NARAD_CLUSTER_PEERS) every pod receives.
# 0 = initialClusterSize. The list is only used to bootstrap the initial
# members and to give joining pods addresses to walk when looking for the
# leader; each pod advertises its own address separately, so a pod that
# is not in the list works fine. Deriving it from replicaCount would put
# it in the pod template, and every scale operation would then roll every
# existing member at the same time as the join or decommission. Change
# this only when you mean to roll the whole cluster (for instance after
# decommissioning an initial member for good).
clusterPeerCount: 0

# Lowering replicaCount is a SCALE-IN, and so is a helm rollback to a
# revision with fewer replicas: the pods the StatefulSet deletes must
# have been decommissioned first (narad cluster decommission <pod>, then
# wait until narad cluster members no longer lists it), or their
# partition data strands and the remaining voters may lose quorum.
#
# Two checks hold you to it:
#   - On helm upgrade, the chart refuses to lower a running StatefulSet's
#     replicas unless allowScaleInTo equals the new replicaCount: "I
#     decommissioned the pods above this size". It approves that one size
#     only, so a value kept by --reuse-values cannot approve a later
#     scale-in to another size. It replaces the allowScaleIn boolean,
#     which is no longer read. This check needs a live cluster (Helm's
#     lookup), so helm template and GitOps renderers skip it.
#   - scaleInGuard (below) checks the cluster itself, on helm rollback
#     too.
# 0 approves no scale-in.
allowScaleInTo: 0

# The scale-in guard: a pre-upgrade and pre-rollback hook Job on the
# narad image. Hooks run on helm rollback, which renders no templates and
# so never reaches the allowScaleInTo check; Argo CD runs it as a PreSync
# hook. It finds the pods at or above the new replicaCount through the
# headless Service's DNS names, and trusts a failed lookup only while
# cluster DNS answers for the API server's Service
# (kubernetes.default.svc) or a pod that stays; otherwise DNS is failing
# and it refuses. If none exists (a first Argo CD sync, every pod
# Pending), the change deletes no pod and is allowed without calling the
# API. Otherwise it reads
# narad cluster members, signed in as admin with the admin-password key
# of the security Secret, and refuses while any pod being deleted is
# still a member, or when no member list can be read. It needs no
# Kubernetes API access, so it runs as the namespace's default
# ServiceAccount with no token mounted, not as the account this chart
# creates (which a first Argo CD sync creates only after PreSync).
#
# On a scale-in it needs that key to hold the root admin's current
# password; without it the guard refuses and says so. To go ahead after
# checking by hand, pass --no-hooks to that one helm command. A rollback
# to a revision rendered by an older chart runs that revision's hooks,
# which have no guard.
scaleInGuard:
  enabled: true

image:
  repository: ghcr.io/debanganthakuria/narad
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

clusterDomain: cluster.local

# Extra labels applied to EVERY resource's metadata (never the immutable
# StatefulSet selector). The escape hatch for cluster admission policies
# that demand a site-specific label on everything.
commonLabels: {}

# Extra labels applied to pods only.
podLabels: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001

service:
  ports:
    api: 7942
    cluster: 7943
    pprof: 6060
    # Prometheus exposition. Served on its own listener (never on the
    # API port) when metrics.enabled is true, so scrapes need no
    # credentials and /metrics is not reachable through the public API.
    metrics: 9100

  headless:
    annotations: {}
    publishNotReadyAddresses: true

  internal:
    enabled: true
    type: ClusterIP
    annotations: {}

  loadBalancer:
    enabled: false
    type: LoadBalancer
    annotations: {}
    # Example for an internal AWS NLB on EKS:
    # annotations:
    #   service.beta.kubernetes.io/aws-load-balancer-type: external
    #   service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    #   service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    externalTrafficPolicy: Cluster
    loadBalancerSourceRanges: []

narad:
  logLevel: info
  logFormat: json

  # Keep the default retention short so a test cluster does not fill its
  # disk. Topics can still override retention during creation.
  defaultRetentionAgeMs: 43200000
  defaultVisibilityTimeoutMs: 30000
  defaultPartitions: 3
  maxPartitions: 108
  defaultMaxInFlightPerPartition: 1024
  defaultMaxAckedAheadPerPartition: 1024
  maxConsumeWait: 10s

  pprof:
    enabled: false

  # Optional engine config rendered to a JSON file and passed via --config.
  # Use for settings not exposed as env vars (e.g. storage codec/compression).
  # Empty = no config file. Example:
  #   config:
  #     storage: { codec: zstd, compression_level: fastest }
  config: {}

# Authentication and authorization (RBAC).
security:
  # When true, every HTTP API call requires Basic auth and RBAC applies,
  # and node-to-node cluster RPC requires the shared secret. TLS is
  # assumed to terminate at the ingress in front of Narad.
  enabled: true

  # With security disabled, a multi-node cluster has an open API, an
  # open node-to-node RPC plane (QUIC on the API port over UDP) and
  # plaintext Raft. The broker refuses to start that way unless told
  # it is deliberate; this is that acknowledgement, only read when
  # security.enabled is false.
  allowInsecureCluster: false

  # Secrets are read from a Kubernetes Secret, never from values.yaml.
  # By default the chart expects a Secret named "<release>-security" with
  # the keys below. Point existingSecret at your own Secret to override.
  #   kubectl create secret generic narad-security \
  #     --from-literal=cluster-secret="$(openssl rand -base64 32)" \
  #     --from-literal=admin-password="$(openssl rand -base64 24)"
  # admin-password is optional: if the key is absent, the seeding node
  # generates a random password and writes it to /var/lib/narad/admin-password
  # on its own volume (never logged); see docs/operate/users.md.
  existingSecret: ""
  adminPasswordKey: admin-password
  clusterSecretKey: cluster-secret

  # One-release compatibility for a rolling upgrade from a release whose
  # node-to-node auth was a fixed token (before session-bound proofs).
  # Set true, roll every pod, then set false and roll again; leaving it
  # on keeps accepting the replayable token from any peer that asks for
  # it. Not needed for a fresh install.
  allowLegacyClusterAuth: false

  # Mutual TLS on the Raft metadata transport (which replicates user
  # password hashes and grants). When enabled, mount a Secret holding a
  # cluster CA + a node cert/key whose SAN includes "narad-cluster.local".
  #   openssl ... -addext "subjectAltName=DNS:narad-cluster.local"
  # All nodes may share one cluster-membership cert. NOTE: enabling this on
  # a running cluster is a breaking transport change — plaintext and mTLS
  # nodes cannot talk, so consensus writes briefly pause mid-rollout until
  # every pod is updated.
  clusterTLS:
    enabled: false
    secretName: narad-cluster-tls
    mountPath: /etc/narad/cluster-tls
    certKey: tls.crt
    keyKey: tls.key
    caKey: ca.crt

  # Raft is plaintext and unauthenticated without clusterTLS, and the
  # cluster secret does not cover it: anything that can reach the
  # cluster port (7943/tcp) can force elections or rewrite the metadata,
  # password hashes and grants included. The broker refuses to start a
  # secured cluster on plaintext Raft unless told the port is fenced.
  #
  # The chart tells it so (NARAD_SECURITY_ALLOW_PLAINTEXT_RAFT=true) only
  # when clusterTLS is off and either networkPolicy.enabled is true (the
  # default: this chart then fences 7943/tcp and 7942/udp itself) or this
  # value is true. Set it only if you turn the chart's policy off and
  # something else already fences 7943/tcp and 7942/udp (the QUIC node
  # RPC plane) to the narad pods: your own NetworkPolicy, a service mesh,
  # a firewall. With security on, clusterTLS off, networkPolicy off and
  # this false, the install fails and names the three ways out.
  allowPlaintextRaft: false

# NetworkPolicy for the narad pods, on by default. It needs a CNI that
# enforces NetworkPolicy (Calico, Cilium and most managed offerings do);
# on one that does not, the policy is accepted and ignored, and the
# ports stay as open as without it. Ingress only; egress is left alone.
#
# When enabled, ingress to the narad pods is denied except:
#   - Raft (service.ports.cluster, TCP) and the node RPC plane
#     (service.ports.api, UDP), from this release's pods only;
#   - the API (service.ports.api, TCP), from apiFrom, or from anywhere
#     when apiFrom is empty;
#   - the metrics port, when metrics.enabled, from metricsFrom, or from
#     anywhere when it is empty;
#   - pprof, when narad.pprof.enabled, from pprofFrom only (empty keeps
#     it closed; kubectl port-forward still reaches it);
#   - the rules in extraIngress, appended as given.
# Kubelet probes come from the pod's own node, which a NetworkPolicy does
# not block. With clusterTLS off, this policy is also what lets the chart
# acknowledge plaintext Raft (see security.allowPlaintextRaft): turning
# it off then needs clusterTLS or allowPlaintextRaft. An upgrade with
# --reuse-values from a release older than this key keeps rendering
# without a policy, as it did before.
networkPolicy:
  enabled: true
  # NetworkPolicyPeer entries, for example:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: my-app
  apiFrom: []
  metricsFrom: []
  pprofFrom: []
  # Extra NetworkPolicyIngressRule entries.
  extraIngress: []

metrics:
  # Serve /metrics on the dedicated metrics port (service.ports.metrics)
  # instead of the API port. When false, /metrics stays on the API port
  # and requires the same Basic credentials as the API.
  enabled: true
  path: /metrics
  annotations: {}

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClassName: ""
  annotations: {}

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits: {}

# The probes are deliberately split across ports.
#
# Startup and liveness ask whether the process is alive and booted, which
# a saturated broker is, so they hit /healthz on the metrics port when
# metrics.enabled (the default) and fall back to the API port with
# metrics off. Keeping them off the API listener is what stops a queue of
# client traffic from getting a healthy node killed: a 1s timeout there
# once cost a restart storm, because the restarting pod could not pass
# its startup probe while clients kept hammering it.
#
# Readiness asks whether traffic should come here, so it stays on the API
# port on purpose. A wedged API listener (fd exhaustion, a stuck accept
# path, a TLS fault) must take the pod out of the service, and a probe
# answered from another listener would report ready while nothing can
# reach it. Failing readiness sheds traffic and recovers on its own,
# which is the cheap outcome; the timeouts below give a busy node room
# before that happens.
startupProbe:
  failureThreshold: 30
  periodSeconds: 2
  timeoutSeconds: 5

livenessProbe:
  failureThreshold: 6
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  failureThreshold: 3
  periodSeconds: 5
  timeoutSeconds: 3

podManagementPolicy: Parallel
updateStrategy:
  type: RollingUpdate
terminationGracePeriodSeconds: 30

# Voluntary evictions (node drains, cluster upgrades) may take down at
# most one pod at a time whatever the cluster size: a fixed minAvailable
# would let a five-node cluster lose three pods and its Raft quorum.
# minAvailable is honoured only if maxUnavailable is left empty.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  minAvailable: ""

serviceMonitor:
  enabled: false
  labels: {}
  interval: 15s
  scrapeTimeout: 10s

traefik:
  enabled: false
  apiVersion: traefik.containo.us/v1alpha1
  ingressClass: traefik
  entryPoints:
    - http
  host: narad.example.com
  annotations: {}
  labels: {}
  middlewares: []
  # Paths excluded from the PUBLIC ingress route. With metrics.enabled
  # the exposition is on its own port and /metrics on the API port is
  # 404; with it off, /metrics on the API port needs API credentials but
  # still leaks topic names + traffic volumes to any credential holder,
  # so keep it off the public host. Add /healthz and /readyz here too if
  # external probes don't need them.
  blockedPathPrefixes:
    - /metrics

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
